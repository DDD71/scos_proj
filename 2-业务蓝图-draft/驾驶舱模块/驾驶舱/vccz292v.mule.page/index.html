<html lang="zh-CN">
<head><script>var __mr='',__md='xxxxxx.com';document.addEventListener('DOMContentLoaded', function () {
  var BAR_HEIGHT = 38;

  // --- detect page theme ---
  var isDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;

  // fallback: sample body/html background color
  if (!isDark) {
    try {
      var sample = getComputedStyle(document.body).backgroundColor;
      if (sample === 'rgba(0, 0, 0, 0)' || sample === 'transparent') {
        sample = getComputedStyle(document.documentElement).backgroundColor;
      }
      if (sample && sample !== 'rgba(0, 0, 0, 0)' && sample !== 'transparent') {
        var m = sample.match(/\d+/g);
        if (m) {
          var brightness = (parseInt(m[0]) * 299 + parseInt(m[1]) * 587 + parseInt(m[2]) * 114) / 1000;
          isDark = brightness < 128;
        }
      }
    } catch (e) {}
  }

  // --- shared CSS (always injected into <head>) ---
  var SHARED_CSS = '<style>' +
    '@keyframes mulepage-svg-glow-dark{0%,100%{color:#ffffff}50%{color:#3b82f6}}' +
    '@keyframes mulepage-svg-glow-light{0%,100%{color:#000000}50%{color:#3b82f6}}' +
    '.mulepage-anim-dark{animation:mulepage-svg-glow-dark 2.5s ease-in-out infinite}' +
    '.mulepage-anim-light{animation:mulepage-svg-glow-light 2.5s ease-in-out infinite}' +
    '.mulepage-btn-dark{background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.08);border-radius:0;transition:all 0.2s ease}' +
    '.mulepage-btn-dark:hover{background:rgba(255,255,255,0.08);border-color:rgba(255,255,255,0.15)}' +
    '.mulepage-btn-light{background:rgba(0,0,0,0.03);border:1px solid rgba(0,0,0,0.08);border-radius:0;transition:all 0.2s ease}' +
    '.mulepage-btn-light:hover{background:rgba(0,0,0,0.08);border-color:rgba(0,0,0,0.15)}' +
    '.mulepage-close-dark{color:rgba(255,255,255,0.3);transition:color 0.2s ease}' +
    '.mulepage-close-dark:hover{color:#ffffff}' +
    '.mulepage-close-light{color:rgba(0,0,0,0.3);transition:color 0.2s ease}' +
    '.mulepage-close-light:hover{color:#000000}' +
    '#mulepage-footer-link{transition:opacity 0.2s ease}' +
    '#mulepage-footer-link:hover{opacity:0.7}' +
    '.mulepage-float{transition:box-shadow 0.2s ease;will-change:box-shadow}' +
    '.mulepage-float:hover{box-shadow:0 6px 20px rgba(0,0,0,0.12),0 2px 6px rgba(0,0,0,0.08)}' +

    '.mulepage-float:hover .mulepage-float-close{max-width:14px;margin-left:4px;opacity:1}' +
    '</style>';

  // always inject shared CSS into <head> so it survives banner removal
  document.head.insertAdjacentHTML('beforeend', SHARED_CSS);

  // --- SVG icon (shared, rx=0 for sharp corners) ---
  var ICON16 = '<svg width="16" height="16" viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg">' +
    '<rect width="36" height="36" rx="0" fill="#FBF9F6"/><g clip-path="url(#c_top)">' +
    '<path d="M6.387 21.732v8.895H18.762V28.5h2.32v1.16h8.121V28.5h1.16v-7.928h-1.16v-1.16h-4.64v-1.16h-1.16v-1.16h-1.16v-1.16h-1.16v-1.16h-1.16v-1.16h3.287v-1.934h3.48V9.357H16.442v3.48h-2.128V6.07h-2.32v2.127H9.674v3.48H7.547v10.055H6.387Z" fill="#000"/>' +

    '<path d="M21.082 27.34v-5.608h1.16v-1.16h5.801v1.16h1.16v5.608h-1.16V28.5h-5.801v-1.16h-1.16Z" fill="#fff"/>' +
    '<path d="M26.883 21.732h-2.32v1.16h1.16v1.16h1.16v-2.32Z" fill="#000"/>' +

  //

  var BRAND_SVG_DARK = '';
  var BRAND_SVG_LIGHT = '';

  // --- banner (adapts to page theme) ---
  var bannerBg = isDark ? '#050505' : '#ffffff';
  var bannerBorder = isDark ? 'rgba(255,255,255,0.08)' : 'rgba(0,0,0,0.06)';
  var bannerColor = isDark ? '#fff' : '#000';
  var bannerSubColor = isDark ? 'rgba(255,255,255,0.45)' : 'rgba(0,0,0,0.45)';
  var bannerTextColor = isDark ? 'rgba(255,255,255,0.65)' : 'rgba(0,0,0,0.65)';
  var bannerArrowColor = isDark ? 'rgba(255,255,255,0.4)' : 'rgba(0,0,0,0.4)';

  //   '</div>';

  // --- floating widget (bottom-right, glassmorphism) ---
  var floatBg = isDark ? 'rgba(30,30,30,0.65)' : 'rgba(255,255,255,0.65)';
  var floatBorder = isDark ? 'rgba(255,255,255,0.12)' : 'rgba(0,0,0,0.08)';
  var floatShadow = isDark
    ? '0 4px 16px rgba(0,0,0,0.4),0 1px 4px rgba(0,0,0,0.3)'
    : '0 4px 16px rgba(0,0,0,0.08),0 1px 4px rgba(0,0,0,0.06)';
  var floatBrandSvg = isDark ? BRAND_SVG_LIGHT.replace('mulepage-anim-light', 'mulepage-anim-dark') : BRAND_SVG_LIGHT;
  var floatCloseColor = isDark ? 'rgba(255,255,255,0.35)' : 'rgba(0,0,0,0.3)';
  var floatCloseHover = isDark ? '#ffffff' : '#000000';
  var byColor = isDark ? 'rgba(255,255,255,0.6)' : 'rgba(0,0,0,0.6)';

  var FOOTER = '<div id="mulepage-footer" class="mulepage-float" style="position:fixed !important;bottom:16px !important;right:16px !important;z-index:2147483646;' +

  // --- insert banner (only when mode is "all") ---

    fi.rel = 'icon'; fi.type = 'image/svg+xml'; fi.href = 'https://mule.page/favicon.svg';

    document.body.style.paddingTop = (origPT + BAR_HEIGHT) + 'px';

    // push down all existing position:fixed elements

      if (cs.position === 'fixed') {

        el.style.top = (t + BAR_HEIGHT) + 'px';
        shifted.push({ el: el, orig: t });

    // close handler: restore everything

      if (floatEl) {

  }

  // --- inject canonical link (all users) ---
  var canon = document.createElement('link');
  canon.rel = 'canonical';

  document.head.appendChild(canon);

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>COFCO SCOS - 供应链优化系统</title>
<!-- 静态演示使用系统字体，避免字体文件缺失；ECharts 使用随页面交付的本地副本。 -->
<script src="../cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
<style>
:root{
--bg-primary:#0a0e1a;--bg-secondary:#0f1525;--bg-card:#111827;--bg-card-hover:#1a2236;
--border:#1e293b;--border-light:#334155;--text-primary:#f1f5f9;--text-secondary:#94a3b8;
--text-muted:#64748b;--blue:#3b82f6;--cyan:#06b6d4;--green:#10b981;--yellow:#f59e0b;
--red:#ef4444;--purple:#8b5cf6;--orange:#f97316;--sidebar-w:220px;--header-h:56px;
--radius:8px;--radius-sm:4px;--radius-lg:12px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;overflow:hidden;}
body{font-family:'Noto Sans SC',sans-serif;background:var(--bg-primary);color:var(--text-primary);font-size:13px;line-height:1.6;}
::-webkit-scrollbar{width:6px;height:6px;}
::-webkit-scrollbar-track{background:var(--bg-secondary);}
::-webkit-scrollbar-thumb{background:var(--border-light);border-radius:3px;}
::-webkit-scrollbar-thumb:hover{background:var(--text-muted);}
.app{display:flex;height:100vh;width:100vw;overflow:hidden;}
.sidebar{width:var(--sidebar-w);min-width:var(--sidebar-w);height:100vh;background:var(--bg-secondary);border-right:1px solid var(--border);display:flex;flex-direction:column;z-index:100;overflow-y:auto;overflow-x:hidden;}
.sidebar-logo{padding:14px 16px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--border);}
.sidebar-logo .logo-icon{width:32px;height:32px;background:linear-gradient(135deg,var(--blue),var(--cyan));border-radius:8px;display:flex;align-items:center;justify-content:center;font-family:'Orbitron',sans-serif;font-weight:900;font-size:14px;color:#fff;}
.sidebar-logo .logo-text{font-family:'Orbitron',sans-serif;font-size:13px;font-weight:700;color:var(--text-primary);letter-spacing:1px;}
.sidebar-logo .logo-sub{font-size:10px;color:var(--text-muted);margin-top:1px;}
.sidebar-section{padding:12px 12px 4px;font-size:10px;color:var(--text-muted);text-transform:uppercase;letter-spacing:1.5px;font-weight:500;}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 16px;margin:2px 8px;border-radius:var(--radius);cursor:pointer;transition:all .2s;color:var(--text-secondary);font-size:13px;position:relative;}
.nav-item:hover{background:rgba(59,130,246,.08);color:var(--text-primary);}
.nav-item.active{background:rgba(59,130,246,.15);color:var(--blue);font-weight:500;}
.nav-item.active::before{content:'';position:absolute;left:0;top:50%;transform:translateY(-50%);width:3px;height:20px;background:var(--blue);border-radius:0 3px 3px 0;}
.nav-icon{font-size:15px;width:20px;text-align:center;flex-shrink:0;}
.nav-badge{margin-left:auto;background:var(--red);color:#fff;font-size:10px;padding:1px 6px;border-radius:10px;font-weight:700;}
.main-wrap{flex:1;display:flex;flex-direction:column;overflow:hidden;}
.header{height:var(--header-h);min-height:var(--header-h);background:var(--bg-secondary);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 24px;z-index:99;}
.header-left{display:flex;align-items:center;gap:16px;}
.header-title{font-size:15px;font-weight:500;color:var(--text-primary);}
.header-breadcrumb{font-size:12px;color:var(--text-muted);}
.header-right{display:flex;align-items:center;gap:20px;}
.header-clock{font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--cyan);letter-spacing:.5px;}
.header-env{font-size:11px;padding:3px 10px;border-radius:10px;background:rgba(16,185,129,.15);color:var(--green);font-weight:500;}
.header-user{display:flex;align-items:center;gap:8px;color:var(--text-secondary);font-size:12px;}
.header-avatar{width:28px;height:28px;background:linear-gradient(135deg,var(--blue),var(--purple));border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;color:#fff;font-weight:700;}
.content{flex:1;overflow-y:auto;overflow-x:hidden;padding:20px 24px;background:var(--bg-primary);position:relative;}
.content::before{content:'';position:fixed;top:var(--header-h);left:var(--sidebar-w);right:0;bottom:0;background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(255,255,255,.003) 2px,rgba(255,255,255,.003) 4px);pointer-events:none;z-index:0;}
.page{display:none;position:relative;z-index:1;animation:fadeIn .3s ease;}
.page.active{display:block;}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
.page-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;}
.page-title{font-size:20px;font-weight:700;color:var(--text-primary);}
.page-subtitle{font-size:12px;color:var(--text-muted);margin-top:2px;}
.card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius-lg);padding:18px;position:relative;overflow:hidden;transition:border-color .2s;}
.card:hover{border-color:var(--border-light);}
.card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,var(--blue),var(--cyan),var(--blue));opacity:.6;}
.card-title{font-size:13px;font-weight:600;color:var(--text-primary);margin-bottom:12px;display:flex;align-items:center;gap:8px;}
.card-title .dot{width:6px;height:6px;border-radius:50%;flex-shrink:0;}
.grid{display:grid;gap:16px;}
.grid-2{grid-template-columns:repeat(2,1fr);}
.grid-3{grid-template-columns:repeat(3,1fr);}
.grid-4{grid-template-columns:repeat(4,1fr);}
.grid-5{grid-template-columns:repeat(5,1fr);}
.grid-6{grid-template-columns:repeat(6,1fr);}
.grid-23{grid-template-columns:2fr 1fr;}
.grid-32{grid-template-columns:3fr 2fr;}
.grid-13{grid-template-columns:1fr 2fr;}
.kpi-card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius-lg);padding:16px 18px;position:relative;overflow:hidden;}
.kpi-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;}
.kpi-card.blue::before{background:var(--blue);}
.kpi-card.cyan::before{background:var(--cyan);}
.kpi-card.green::before{background:var(--green);}
.kpi-card.yellow::before{background:var(--yellow);}
.kpi-card.purple::before{background:var(--purple);}
.kpi-label{font-size:11px;color:var(--text-muted);margin-bottom:6px;font-weight:500;}
.kpi-value{font-family:'JetBrains Mono',monospace;font-size:24px;font-weight:700;margin-bottom:4px;}
.kpi-card.blue .kpi-value{color:var(--blue);}
.kpi-card.cyan .kpi-value{color:var(--cyan);}
.kpi-card.green .kpi-value{color:var(--green);}
.kpi-card.yellow .kpi-value{color:var(--yellow);}
.kpi-card.purple .kpi-value{color:var(--purple);}
.kpi-change{font-size:11px;font-family:'JetBrains Mono',monospace;}
.kpi-change.up{color:var(--green);}
.kpi-change.down{color:var(--cyan);}
.kpi-change.flat{color:var(--text-muted);}
.data-table{width:100%;border-collapse:collapse;font-size:12px;}
.data-table thead th{background:rgba(59,130,246,.08);color:var(--text-secondary);font-weight:600;padding:8px 12px;text-align:left;border-bottom:1px solid var(--border);white-space:nowrap;font-size:11px;text-transform:uppercase;letter-spacing:.5px;}
.data-table tbody td{padding:8px 12px;border-bottom:1px solid rgba(30,41,59,.5);color:var(--text-primary);vertical-align:middle;}
.data-table tbody tr{transition:background .15s;}
.data-table tbody tr:hover{background:rgba(59,130,246,.04);}
.tag{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:10px;font-size:10px;font-weight:600;}
.tag-green{background:rgba(16,185,129,.15);color:var(--green);}
.tag-blue{background:rgba(59,130,246,.15);color:var(--blue);}
.tag-yellow{background:rgba(245,158,11,.15);color:var(--yellow);}
.tag-red{background:rgba(239,68,68,.15);color:var(--red);}
.tag-cyan{background:rgba(6,182,212,.15);color:var(--cyan);}
.tag-purple{background:rgba(139,92,246,.15);color:var(--purple);}
.tag-gray{background:rgba(100,116,139,.15);color:var(--text-muted);}
.status-dot{width:7px;height:7px;border-radius:50%;display:inline-block;margin-right:4px;}
.status-dot.green{background:var(--green);box-shadow:0 0 6px rgba(16,185,129,.5);}
.status-dot.yellow{background:var(--yellow);box-shadow:0 0 6px rgba(245,158,11,.5);}
.status-dot.red{background:var(--red);box-shadow:0 0 6px rgba(239,68,68,.5);}
.status-dot.blue{background:var(--blue);box-shadow:0 0 6px rgba(59,130,246,.5);}
.tab-bar{display:flex;gap:2px;margin-bottom:16px;background:var(--bg-secondary);border-radius:var(--radius);padding:3px;border:1px solid var(--border);}
.tab-btn{padding:7px 16px;border:none;background:none;color:var(--text-muted);font-size:12px;font-weight:500;cursor:pointer;border-radius:6px;transition:all .2s;font-family:'Noto Sans SC',sans-serif;white-space:nowrap;}
.tab-btn:hover{color:var(--text-secondary);background:rgba(255,255,255,.03);}
.tab-btn.active{background:rgba(59,130,246,.15);color:var(--blue);font-weight:600;}
.tab-content{display:none;}
.tab-content.active{display:block;animation:fadeIn .25s ease;}
.btn{display:inline-flex;align-items:center;gap:6px;padding:6px 14px;border-radius:var(--radius);font-size:12px;font-weight:500;cursor:pointer;border:1px solid var(--border);background:var(--bg-card);color:var(--text-secondary);transition:all .2s;font-family:'Noto Sans SC',sans-serif;}
.btn:hover{border-color:var(--border-light);color:var(--text-primary);background:var(--bg-card-hover);}
.btn-primary{background:var(--blue);border-color:var(--blue);color:#fff;}
.btn-primary:hover{background:#2563eb;border-color:#2563eb;}
.btn-sm{padding:4px 10px;font-size:11px;}
.btn-green{background:rgba(16,185,129,.15);border-color:rgba(16,185,129,.3);color:var(--green);}
.btn-yellow{background:rgba(245,158,11,.15);border-color:rgba(245,158,11,.3);color:var(--yellow);}
.btn-red{background:rgba(239,68,68,.15);border-color:rgba(239,68,68,.3);color:var(--red);}
.progress{height:6px;background:var(--bg-secondary);border-radius:3px;overflow:hidden;}
.progress-bar{height:100%;border-radius:3px;transition:width .6s ease;}
.progress-bar.blue{background:linear-gradient(90deg,var(--blue),var(--cyan));}
.progress-bar.green{background:linear-gradient(90deg,var(--green),#34d399);}
.progress-bar.yellow{background:linear-gradient(90deg,var(--yellow),var(--orange));}
.progress-bar.red{background:linear-gradient(90deg,var(--red),#f87171);}
.progress-bar.purple{background:linear-gradient(90deg,var(--purple),#a78bfa);}
.chart-box{width:100%;min-height:250px;}
.alert-item{display:flex;align-items:flex-start;gap:10px;padding:10px 12px;border-radius:var(--radius);border:1px solid var(--border);margin-bottom:8px;transition:background .15s;cursor:pointer;}
.alert-item:hover{background:rgba(255,255,255,.02);}
.alert-level{width:4px;min-height:36px;border-radius:2px;flex-shrink:0;}
.alert-level.critical{background:var(--red);}
.alert-level.warning{background:var(--yellow);}
.alert-level.info{background:var(--blue);}
.alert-body{flex:1;min-width:0;}
.alert-title-text{font-size:12px;font-weight:500;color:var(--text-primary);margin-bottom:2px;}
.alert-desc{font-size:11px;color:var(--text-muted);line-height:1.5;}
.alert-meta{display:flex;align-items:center;gap:8px;margin-top:4px;}
.alert-time{font-size:10px;color:var(--text-muted);font-family:'JetBrains Mono',monospace;}
.slider-group{margin-bottom:14px;}
.slider-label{display:flex;justify-content:space-between;margin-bottom:6px;font-size:12px;color:var(--text-secondary);}
.slider-val{font-family:'JetBrains Mono',monospace;color:var(--cyan);font-weight:600;}
input[type=range]{width:100%;height:4px;-webkit-appearance:none;background:var(--border);border-radius:2px;outline:none;}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;background:var(--blue);border-radius:50%;cursor:pointer;border:2px solid var(--bg-card);}
.workflow{display:flex;align-items:center;gap:0;margin:12px 0;}
.wf-step{display:flex;flex-direction:column;align-items:center;gap:4px;position:relative;}
.wf-dot{width:28px;height:28px;border-radius:50%;border:2px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:11px;background:var(--bg-card);z-index:1;transition:all .3s;}
.wf-step.done .wf-dot{background:var(--green);border-color:var(--green);color:#fff;}
.wf-step.active .wf-dot{background:var(--blue);border-color:var(--blue);color:#fff;box-shadow:0 0 12px rgba(59,130,246,.4);}
.wf-step.pending .wf-dot{color:var(--text-muted);}
.wf-name{font-size:10px;color:var(--text-muted);text-align:center;max-width:70px;}
.wf-line{flex:1;height:2px;background:var(--border);min-width:30px;position:relative;top:-10px;}
.wf-line.done{background:var(--green);}
.supplier-card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius-lg);padding:16px;position:relative;overflow:hidden;}
.supplier-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,var(--blue),var(--cyan));}
.supplier-name{font-size:14px;font-weight:600;margin-bottom:4px;}
.supplier-score{font-family:'JetBrains Mono',monospace;font-size:20px;font-weight:700;color:var(--cyan);}
.flex{display:flex;}
.flex-wrap{flex-wrap:wrap;}
.flex-col{flex-direction:column;}
.flex-1{flex:1;}
.items-center{align-items:center;}
.items-start{align-items:flex-start;}
.justify-between{justify-content:space-between;}
.gap-4{gap:4px;}
.gap-8{gap:8px;}
.gap-12{gap:12px;}
.gap-16{gap:16px;}
.gap-20{gap:20px;}
.mt-8{margin-top:8px;}
.mt-12{margin-top:12px;}
.mt-16{margin-top:16px;}
.mb-8{margin-bottom:8px;}
.mb-12{margin-bottom:12px;}
.mb-16{margin-bottom:16px;}
.text-mono{font-family:'JetBrains Mono',monospace;}
.text-xs{font-size:11px;}
.text-sm{font-size:12px;}
.text-muted{color:var(--text-muted);}
.text-secondary{color:var(--text-secondary);}
.text-blue{color:var(--blue);}
.text-cyan{color:var(--cyan);}
.text-green{color:var(--green);}
.text-yellow{color:var(--yellow);}
.text-red{color:var(--red);}
.fw-600{font-weight:600;}
.w-full{width:100%;}
.overflow-auto{overflow:auto;}
.formula-box{background:var(--bg-secondary);border:1px solid var(--border);border-radius:var(--radius-sm);padding:4px 8px;font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--cyan);display:inline-block;max-width:100%;overflow-x:auto;white-space:nowrap;}
.section-title{font-size:14px;font-weight:600;color:var(--text-primary);margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px;}
.section-title .icon{color:var(--blue);}
.empty-placeholder{display:flex;align-items:center;justify-content:center;min-height:300px;color:var(--text-muted);font-size:14px;}
.filter-bar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px;}
.filter-btn{padding:4px 12px;border-radius:14px;border:1px solid var(--border);background:none;color:var(--text-muted);font-size:11px;cursor:pointer;transition:all .15s;font-family:'Noto Sans SC',sans-serif;}
.filter-btn:hover{border-color:var(--border-light);color:var(--text-secondary);}
.filter-btn.active{background:rgba(59,130,246,.15);border-color:var(--blue);color:var(--blue);}
.scroll-y{overflow-y:auto;max-height:360px;}
.param-row{display:flex;align-items:center;gap:12px;padding:6px 0;border-bottom:1px solid rgba(30,41,59,.3);}
.param-label{font-size:11px;color:var(--text-muted);width:100px;flex-shrink:0;}
.param-value{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--text-primary);}
.model-card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius-lg);padding:16px;position:relative;overflow:hidden;}
.model-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,var(--purple),var(--blue));opacity:.7;}
.scenario-btn{padding:8px 14px;border:1px solid var(--border);border-radius:var(--radius);background:var(--bg-card);color:var(--text-secondary);cursor:pointer;font-size:12px;font-family:'Noto Sans SC',sans-serif;transition:all .2s;}
.scenario-btn:hover{border-color:var(--blue);color:var(--blue);background:rgba(59,130,246,.08);}
.dash-map-wrap{position:relative;height:420px;background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius-lg);overflow:hidden;}
.dash-map-wrap::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,var(--cyan),var(--blue),var(--cyan));opacity:.6;z-index:1;}
.mini-kpi{display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--bg-secondary);border:1px solid var(--border);border-radius:var(--radius);font-size:12px;}
.mini-kpi .val{font-family:'JetBrains Mono',monospace;font-weight:600;font-size:14px;}
.gantt-row{display:flex;align-items:center;border-bottom:1px solid rgba(30,41,59,.3);min-height:40px;}
.gantt-label{width:120px;flex-shrink:0;padding:8px;font-size:12px;color:var(--text-secondary);border-right:1px solid var(--border);}
.gantt-track{flex:1;position:relative;min-height:32px;padding:4px 0;}
.gantt-bar{position:absolute;height:24px;border-radius:3px;display:flex;align-items:center;justify-content:center;font-size:10px;color:#fff;font-weight:500;cursor:pointer;overflow:hidden;white-space:nowrap;padding:0 4px;}
.gantt-bar.prod{background:linear-gradient(135deg,#2563eb,#3b82f6);}
.gantt-bar.clean{background:repeating-linear-gradient(135deg,#8b5cf6,#8b5cf6 3px,#7c3aed 3px,#7c3aed 6px);}
.gantt-bar.setup{background:repeating-linear-gradient(135deg,#f59e0b,#f59e0b 3px,#d97706 3px,#d97706 6px);}
.gantt-bar.maint{background:repeating-linear-gradient(135deg,#ef4444,#ef4444 3px,#dc2626 3px,#dc2626 6px);}
.gantt-header{display:flex;border-bottom:1px solid var(--border);}
.gantt-time-axis{flex:1;display:flex;}
.gantt-hour{flex:1;text-align:center;font-size:10px;color:var(--text-muted);padding:4px 0;font-family:'JetBrains Mono',monospace;border-left:1px solid rgba(30,41,59,.2);}
.trace-graph{display:flex;align-items:center;justify-content:center;padding:24px 16px;gap:0;overflow-x:auto;}
.trace-node{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:100px;cursor:pointer;transition:transform .2s;}
.trace-node:hover{transform:translateY(-4px);}
.trace-node-circle{width:50px;height:50px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px;border:2px solid;position:relative;transition:box-shadow .2s;}
.trace-node-circle.active{box-shadow:0 0 16px rgba(6,182,212,.5);}
.trace-connector{width:50px;height:2px;background:linear-gradient(90deg,var(--blue),var(--cyan));position:relative;flex-shrink:0;}
.trace-connector::after{content:'\25B8';position:absolute;right:-2px;top:-8px;color:var(--cyan);font-size:12px;}
.trace-node-label{font-size:11px;color:var(--text-primary);font-weight:600;text-align:center;}
.trace-node-id{font-size:10px;color:var(--cyan);font-family:'JetBrains Mono',monospace;text-align:center;}
.trace-node-sys{font-size:9px;color:var(--text-muted);text-align:center;}
.trace-node-status{font-size:9px;padding:1px 6px;border-radius:8px;text-align:center;}
.trace-detail-panel{background:var(--bg-secondary);border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin-top:12px;animation:fadeIn .25s ease;}
.trace-task-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid rgba(30,41,59,.4);font-size:12px;}
.trace-task-item:last-child{border-bottom:none;}
.trace-task-priority{padding:2px 8px;border-radius:10px;font-size:10px;font-weight:700;flex-shrink:0;}
.trace-task-priority.urgent{background:rgba(239,68,68,.15);color:var(--red);}
.trace-task-priority.important{background:rgba(245,158,11,.15);color:var(--yellow);}
.trace-task-priority.follow{background:rgba(59,130,246,.15);color:var(--blue);}
.trace-input-field{background:var(--bg-secondary);border:1px solid var(--border);border-radius:var(--radius-sm);padding:7px 12px;color:var(--text-primary);font-size:13px;font-family:'JetBrains Mono',monospace;outline:none;width:280px;transition:border-color .2s;}
.trace-input-field:focus{border-color:var(--blue);}
.trace-compliance-item{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid rgba(30,41,59,.3);font-size:12px;}
.trace-compliance-item:last-child{border-bottom:none;}
.trace-report-preview{background:var(--bg-secondary);border:1px solid var(--border);border-radius:var(--radius);padding:14px;font-size:12px;color:var(--text-secondary);line-height:2;}
.kpi-card{cursor:pointer;transition:all .2s;}
.kpi-card:hover{border-color:var(--border-light);transform:translateY(-2px);}
.kpi-drill{font-size:10px;color:var(--text-muted);margin-top:6px;display:flex;align-items:center;gap:4px;opacity:.6;}
.kpi-card:hover .kpi-drill{opacity:1;color:var(--cyan);}
.modal-mask{position:fixed;inset:0;background:rgba(5,8,15,.72);backdrop-filter:blur(3px);z-index:1000;display:flex;align-items:center;justify-content:center;animation:fadeIn .2s ease;}
.modal-panel{background:var(--bg-card);border:1px solid var(--border-light);border-radius:var(--radius-lg);width:600px;max-width:92vw;max-height:84vh;overflow-y:auto;padding:22px;position:relative;box-shadow:0 20px 60px rgba(0,0,0,.5);}
.modal-close{position:absolute;top:12px;right:14px;background:none;border:none;color:var(--text-muted);font-size:20px;cursor:pointer;line-height:1;}
.modal-close:hover{color:var(--text-primary);}
.drill-path{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:12px;}
.drill-node{background:var(--bg-secondary);border:1px solid var(--border);border-radius:var(--radius);padding:6px 12px;font-size:11px;color:var(--text-secondary);}
.drill-node.active{background:rgba(59,130,246,.15);border-color:var(--blue);color:var(--blue);font-weight:600;}
.drill-arrow{color:var(--text-muted);}
.check-row{display:flex;align-items:center;gap:10px;padding:8px 10px;border:1px solid var(--border);border-radius:var(--radius);margin-bottom:8px;background:var(--bg-secondary);font-size:12px;color:var(--text-secondary);cursor:pointer;}
.check-row:hover{border-color:var(--border-light);}
.check-row input{accent-color:var(--blue);width:16px;height:16px;cursor:pointer;}
/* ===== COCKPIT SANDBOX ===== */
.sandbox-card{border-color:rgba(139,92,246,.35);padding:0;overflow:hidden;}
.sandbox-card::before{background:linear-gradient(90deg,var(--purple),var(--blue),var(--cyan));opacity:.9;}
.sandbox-header{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;padding:18px 20px 14px;border-bottom:1px solid var(--border);}
.sandbox-title{font-size:16px;font-weight:700;color:var(--text-primary);display:flex;align-items:center;gap:9px;}
.sandbox-title-mark{width:22px;height:22px;border-radius:6px;display:inline-flex;align-items:center;justify-content:center;background:rgba(139,92,246,.18);color:#c4b5fd;font-size:12px;}
.sandbox-safety{margin:14px 20px 0;padding:9px 12px;border:1px solid rgba(6,182,212,.3);background:rgba(6,182,212,.06);border-radius:var(--radius);display:flex;align-items:center;gap:9px;color:var(--text-secondary);font-size:11px;}
.sandbox-safety strong{color:var(--cyan);font-weight:600;}
.sandbox-baseline{margin:12px 20px 0;display:grid;grid-template-columns:1.2fr 1fr 1fr 1.4fr .8fr;gap:8px;}
.sandbox-baseline-item{padding:9px 11px;border:1px solid var(--border);background:var(--bg-secondary);border-radius:var(--radius);min-width:0;}
.sandbox-baseline-label{font-size:9px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.6px;margin-bottom:2px;}
.sandbox-baseline-value{font-size:11px;color:var(--text-primary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.sandbox-workspace{display:grid;grid-template-columns:245px minmax(0,1fr);gap:16px;padding:16px 20px;}
.sandbox-library{border-right:1px solid var(--border);padding-right:16px;}
.sandbox-library-title{font-size:11px;color:var(--text-muted);letter-spacing:.6px;margin-bottom:8px;}
.sandbox-scenario-item{width:100%;display:flex;align-items:center;gap:9px;text-align:left;padding:9px 10px;margin-bottom:6px;border:1px solid transparent;border-radius:var(--radius);background:transparent;color:var(--text-secondary);cursor:pointer;font-family:'Noto Sans SC',sans-serif;transition:all .18s;}
.sandbox-scenario-item:hover{background:rgba(255,255,255,.025);border-color:var(--border);color:var(--text-primary);}
.sandbox-scenario-item.active{background:rgba(139,92,246,.12);border-color:rgba(139,92,246,.45);color:#ddd6fe;}
.sandbox-scenario-icon{width:28px;height:28px;display:flex;align-items:center;justify-content:center;border-radius:7px;background:var(--bg-secondary);color:var(--purple);font-size:13px;flex-shrink:0;}
.sandbox-scenario-name{display:block;font-size:12px;font-weight:600;line-height:1.3;}
.sandbox-scenario-meta{display:block;font-size:9px;color:var(--text-muted);margin-top:2px;}
.sandbox-editor{min-width:0;}
.sandbox-editor-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:12px;}
.sandbox-editor-name{font-size:14px;font-weight:600;color:var(--text-primary);}
.sandbox-editor-desc{font-size:11px;color:var(--text-muted);margin-top:2px;max-width:760px;}
.sandbox-param-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 14px;padding:12px;background:var(--bg-secondary);border:1px solid var(--border);border-radius:var(--radius);}
.sandbox-param{min-width:0;}
.sandbox-param-top{display:flex;justify-content:space-between;gap:10px;margin-bottom:6px;font-size:11px;color:var(--text-secondary);}
.sandbox-param-value{font-family:'JetBrains Mono',monospace;color:var(--cyan);font-weight:600;white-space:nowrap;}
.sandbox-select{width:100%;height:30px;background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text-primary);font-size:11px;padding:0 8px;outline:none;font-family:'Noto Sans SC',sans-serif;}
.sandbox-select:focus{border-color:var(--blue);}
.sandbox-flow-wrap{margin-top:12px;padding:11px 12px;border:1px solid var(--border);border-radius:var(--radius);background:rgba(15,21,37,.65);}
.sandbox-flow-title{display:flex;justify-content:space-between;align-items:center;color:var(--text-muted);font-size:10px;margin-bottom:9px;}
.sandbox-flow{display:flex;align-items:stretch;gap:0;overflow-x:auto;padding-bottom:2px;}
.sandbox-module{min-width:118px;flex:1;padding:8px 9px;border:1px solid var(--border);background:var(--bg-card);border-radius:var(--radius);position:relative;transition:all .25s;}
.sandbox-module-name{font-size:10px;color:var(--text-secondary);font-weight:600;white-space:nowrap;}
.sandbox-module-status{font-size:9px;color:var(--text-muted);margin-top:2px;white-space:nowrap;}
.sandbox-module.active{border-color:var(--blue);background:rgba(59,130,246,.1);box-shadow:0 0 14px rgba(59,130,246,.12);}
.sandbox-module.active .sandbox-module-status{color:var(--blue);}
.sandbox-module.done{border-color:rgba(16,185,129,.45);background:rgba(16,185,129,.07);}
.sandbox-module.done .sandbox-module-status{color:var(--green);}
.sandbox-flow-arrow{width:24px;min-width:24px;display:flex;align-items:center;justify-content:center;color:var(--text-muted);font-size:12px;}
.sandbox-actions{display:flex;align-items:center;gap:8px;margin-top:12px;flex-wrap:wrap;}
.sandbox-run-state{margin:0 20px 16px;padding:12px 14px;border:1px solid var(--border);border-radius:var(--radius);background:var(--bg-secondary);display:none;}
.sandbox-run-state.visible{display:block;}
.sandbox-run-top{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:7px;font-size:11px;}
.sandbox-results{display:none;border-top:1px solid var(--border);padding:16px 20px 20px;background:rgba(10,14,26,.35);}
.sandbox-results.visible{display:block;animation:fadeIn .25s ease;}
.sandbox-result-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px;}
.sandbox-result-title{font-size:14px;font-weight:600;color:var(--text-primary);}
.sandbox-result-grid{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(320px,1fr);gap:14px;}
.sandbox-subcard{border:1px solid var(--border);background:var(--bg-card);border-radius:var(--radius);padding:12px;min-width:0;}
.sandbox-subtitle{font-size:11px;font-weight:600;color:var(--text-secondary);margin-bottom:9px;display:flex;align-items:center;gap:6px;}
.sandbox-delta-good{color:var(--green);font-family:'JetBrains Mono',monospace;}
.sandbox-delta-bad{color:var(--red);font-family:'JetBrains Mono',monospace;}

function procValidateFinalQty(showMessage){
var inputs=Array.from(document.querySelectorAll('.proc-final')),sum=0,cost=0,valid=true;inputs.forEach(function(i){var v=Number(i.value)||0,max=Number(i.max);sum+=v;cost+=v*Number(i.dataset.unit);var ok=v>=0&&v<=max;i.classList.toggle('invalid',!ok);if(!ok)valid=false;});var diff=sum-PROC_TARGET_QTY;if(diff!==0)valid=false;
var total=document.getElementById('procFinalTotal'),dif=document.getElementById('procFinalDiff'),costEl=document.getElementById('procFinalCost'),tag=document.getElementById('procValidationTag'),btn=document.getElementById('procConfirmBtn');if(total)total.textContent=sum.toLocaleString()+'吨';if(dif){dif.textContent=(diff>0?'+':'')+diff.toLocaleString()+'吨';dif.className=diff===0?'text-green':'text-red';}if(costEl)costEl.textContent=(cost/10000).toFixed(1)+'万元';if(tag)tag.innerHTML=valid?'<span class="tag tag-green">数量校验通过</span>':'<span class="tag tag-red">需求或上限约束未满足</span>';if(btn)btn.disabled=!valid;if(showMessage)alert(valid?'数量与最大可供约束校验通过。':'校验未通过：最终量合计必须为10,300吨，且单家不得超过最大可供量。');return valid;
}

if(idx===0){initChart('procDemandTimeline',mOpt({legend:{data:['生产排程需求','修正后毛需求','净采购需求'],top:0,right:0},xAxis:{type:'category',data:['玉米淀粉','液化酶','糖化酶','活性炭']},yAxis:{type:'log',name:'数量(对数展示)'},series:[{name:'生产排程需求',type:'bar',data:[18400,35,31,58],itemStyle:{color:'rgba(59,130,246,.55)'}},{name:'修正后毛需求',type:'bar',data:[20300,40,35,66],itemStyle:{color:'rgba(139,92,246,.60)'}},{name:'净采购需求',type:'bar',data:[10300,18,14,30],itemStyle:{color:'rgba(245,158,11,.68)'}}]}));}
else if(idx===1){procValidateFinalQty(false);initChart('procCostComposition',{backgroundColor:'transparent',tooltip:{trigger:'item',formatter:'{b}: {c}万元'},series:[{type:'pie',radius:['38%','65%'],data:[{value:2745.4,name:'含税报价',itemStyle:{color:'#3b82f6'}},{value:144.2,name:'运费/保险',itemStyle:{color:'#f59e0b'}},{value:15.8,name:'库存持有',itemStyle:{color:'#8b5cf6'}},{value:9.6,name:'质检/加工',itemStyle:{color:'#06b6d4'}},{value:7.4,name:'资金占用',itemStyle:{color:'#64748b'}},{value:22,name:'风险折价',itemStyle:{color:'#ef4444'}},{value:16,name:'融资收益（抵减项）',itemStyle:{color:'#10b981'}}],label:{color:'#94a3b8',fontSize:11}}]});}
else if(idx===2){initChart('procWeeklyRolling',mOpt({legend:{data:['原未执行量'],top:0,right:0},xAxis:{type:'category',data:['德州金玉米','吉林长龙','齐齐哈尔龙凤']},yAxis:{type:'value',name:'吨'},series:[{name:'原未执行量',type:'bar',data:[3100,2200,1500],itemStyle:{color:'rgba(59,130,246,.55)'}}]}));}
else if(idx===3){initChart('procPlanCost',mOpt({xAxis:{type:'category',data:['TCO最优','交付优先','风险分散']},yAxis:{type:'value',name:'万元',min:2900},series:[{type:'bar',data:[2928.4,2946.2,2958.7],itemStyle:{color:function(p){return p.dataIndex===0?'rgba(16,185,129,.72)':'rgba(59,130,246,.62)';}},label:{show:true,position:'top',color:'#94a3b8'}}]}));initChart('procContractSplit',{backgroundColor:'transparent',tooltip:{trigger:'item',formatter:'{b}: {c}吨 ({d}%)'},series:[{type:'pie',radius:['42%','68%'],data:[{value:5000,name:'固定价锁定',itemStyle:{color:'#3b82f6'}},{value:5300,name:'现货/浮动价',itemStyle:{color:'#f59e0b'}}],label:{color:'#94a3b8',fontSize:10}}]});initChart('procPriceForecast',mOpt({legend:{data:['历史/预测中位','预测上界','预测下界'],top:0,right:0},xAxis:{type:'category',data:['W31','W32','W33','W34','W35','W36','W37','W38','W39']},yAxis:{type:'value',name:'元/吨',min:2500},series:[{name:'历史/预测中位',type:'line',data:[2580,2610,2635,2660,2680,2695,2712,2720,2728],smooth:true,itemStyle:{color:'#06b6d4'}},{name:'预测上界',type:'line',data:[2580,2610,2635,2660,2680,2730,2760,2790,2810],symbol:'none',lineStyle:{type:'dashed',color:'#ef4444'}},{name:'预测下界',type:'line',data:[2580,2610,2635,2660,2680,2635,2640,2650,2648],symbol:'none',lineStyle:{type:'dashed',color:'#10b981'}}]}));procRunTenderScenario(1);}
else if(idx===4){initChart('procExecFeedback',mOpt({legend:{data:['计划到货偏差','实际到货偏差'],top:0,right:0},xAxis:{type:'category',data:['PO-0810','PO-0814','PO-0817','PO-0821']},yAxis:{type:'value',name:'天'},series:[{name:'计划到货偏差',type:'line',data:[0,0,0,0],itemStyle:{color:'#10b981'}},{name:'实际到货偏差',type:'bar',data:[0,1,-1,0],itemStyle:{color:'rgba(245,158,11,.7)'}}]}));}}

/* ===== RESIZE ===== */
window.addEventListener('resize',()=>{Object.values(charts).forEach(c=>{if(c&&!c.isDisposed())c.resize();});});
/* ===== INIT ===== */
fetch('china.json').then(r=>{if(!r.ok)throw new Error();return r.json();}).then(d=>{mapGeoJSON=d;echarts.registerMap('china',d);initDashboard();}).catch(()=>{fetch('https://geo.datav.aliyun.com/areas_v3/bound/100000_full.json').then(r=>r.json()).then(d=>{mapGeoJSON=d;echarts.registerMap('china',d);initDashboard();}).catch(()=>{initDashboard();});});
</script>
