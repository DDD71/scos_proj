<svg xmlns="http://www.w3.org/2000/svg" width="1780" height="610" viewBox="0 0 1780 610"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4 0 8Z" fill="#333"/></marker><style>.tt{font:bold 18px 'Microsoft YaHei';fill:#222}.lh{font:bold 15px 'Microsoft YaHei';fill:#222}.tx{font:13px 'Microsoft YaHei';fill:#222}.sm{font:12px 'Microsoft YaHei';fill:#444}.b{fill:#fff;stroke:#c94747;stroke-width:1.4}.s{fill:#fff;stroke:#4f7d5b;stroke-width:1.4}.x,.d{fill:#fff;stroke:#555;stroke-width:1.3}.f{fill:none;stroke:#333;stroke-width:1.35;marker-end:url(#a)}</style></defs><rect width="1780" height="610" fill="#fff"/><text x="24" y="34" class="tt">流程编号及名称：（P-ZLTC-SCOS-JSC-006 预警处置跟踪与闭环验证流程）</text><rect x="20" y="55" width="1740" height="490" fill="#fff" stroke="#555"/><rect x="20" y="55" width="145" height="490" fill="#f3f3f3" stroke="#555"/><path d="M20 218H1760M20 381H1760" stroke="#aaa"/><text x="38" y="143" class="lh">业务处置责任人</text><text x="38" y="306" class="lh">驾驶舱</text><text x="38" y="469" class="lh">管理负责人</text><circle cx="200" cy="137" r="20" class="x"/><text x="200" y="142" text-anchor="middle" class="sm">开始</text><rect x="240" y="101" width="190" height="72" class="b"/><text x="335" y="125" text-anchor="middle" class="tx"><tspan x="335">10 接收处置任务</tspan><tspan x="335" dy="19">确认影响与要求</tspan></text><rect x="480" y="101" width="190" height="72" class="b"/><text x="575" y="125" text-anchor="middle" class="tx"><tspan x="575">20 执行业务处置</tspan><tspan x="575" dy="19">并反馈进展结果</tspan></text><rect x="720" y="264" width="190" height="72" class="s"/><text x="815" y="288" text-anchor="middle" class="tx"><tspan x="815">30 跟踪处置进度</tspan><tspan x="815" dy="19">与指标恢复情况</tspan></text><polygon points="1040,256 1110,300 1040,344 970,300" class="d"/><text x="1040" y="295" text-anchor="middle" class="tx"><tspan x="1040">40 是否超时</tspan><tspan x="1040" dy="19">或处置失败？</tspan></text><rect x="1160" y="427" width="190" height="72" class="s"/><text x="1255" y="451" text-anchor="middle" class="tx"><tspan x="1255">50 升级提醒</tspan><tspan x="1255" dy="19">并协调处置资源</tspan></text><polygon points="1460,419 1530,463 1460,507 1390,463" class="d"/><text x="1460" y="458" text-anchor="middle" class="tx"><tspan x="1460">60 风险是否</tspan><tspan x="1460" dy="19">验证关闭？</tspan></text><rect x="1570" y="264" width="160" height="72" class="s"/><text x="1650" y="288" text-anchor="middle" class="tx"><tspan x="1650">70 关闭预警</tspan><tspan x="1650" dy="19">记录完整轨迹</tspan></text><path d="M220 137H240M430 137H480M670 137H695V300H720M910 300H970M1110 300H1135V463H1160M1350 463H1390M1530 463H1550V300H1570" class="f"/><circle cx="1730" cy="390" r="20" class="x"/><text x="1730" y="395" text-anchor="middle" class="sm">结束</text><path d="M1650 336V360H1730V370" class="f"/><path d="M1040 256V200H815V264" class="f"/><text x="850" y="195" class="sm">N：继续跟踪</text><path d="M1460 507V535H575V173" class="f"/><text x="900" y="530" class="sm">N：返回业务处置</text><text x="24" y="578" class="sm">闭环以业务风险消除和指标恢复为准；驾驶舱统一跟踪，采购、库存、排程、追溯等专业处置仍在相关模块完成。</text><g font-family="Microsoft YaHei" font-size="11" font-weight="bold" fill="#fff"><rect x="240" y="101" width="54" height="18" fill="#c94747"/><text x="267" y="114" text-anchor="middle">业务系统</text><rect x="480" y="101" width="54" height="18" fill="#c94747"/><text x="507" y="114" text-anchor="middle">业务系统</text><rect x="720" y="264" width="54" height="18" fill="#4f7d5b"/><text x="747" y="277" text-anchor="middle">驾驶舱</text><rect x="950" y="264" width="54" height="18" fill="#4f7d5b"/><text x="977" y="277" text-anchor="middle">驾驶舱</text><rect x="1160" y="427" width="54" height="18" fill="#4f7d5b"/><text x="1187" y="440" text-anchor="middle">驾驶舱</text><rect x="1570" y="264" width="54" height="18" fill="#4f7d5b"/><text x="1597" y="277" text-anchor="middle">驾驶舱</text></g></svg>
