<style>
:root{--bg:#f3f6fb;--card:#fff;--ink:#172033;--muted:#69768a;--line:#dce4ef;--blue:#245bd7;--blue2:#173f9b;--green:#16845b;--orange:#c56c13;--red:#c93749;--purple:#7553c6;--gray:#eef2f7}
*{box-sizing:border-box}body{margin:0;color:var(--ink);background:radial-gradient(circle at 7% 0,rgba(36,91,215,.1),transparent 25%),var(--bg);font-family:"PingFang SC","Microsoft YaHei",Arial,sans-serif}.page{width:min(1510px,calc(100% - 28px));margin:auto;padding:25px 0 44px}.hero{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:16px}.eyebrow{color:var(--blue);font-size:12px;font-weight:850;letter-spacing:.08em}h1{margin:5px 0 6px;font-size:clamp(27px,3.4vw,40px)}.subtitle{margin:0;color:var(--muted);font-size:13px}.actions{display:flex;gap:7px}.btn{height:39px;border:1px solid var(--line);border-radius:9px;padding:0 14px;color:var(--ink);background:#fff;font:inherit;font-size:11px;font-weight:800;cursor:pointer}.btn:hover{border-color:#9fb2d0}.btn.primary{color:#fff;border-color:var(--blue);background:var(--blue);box-shadow:0 7px 17px rgba(36,91,215,.2)}.card{margin-top:14px;padding:18px;border:1px solid rgba(220,228,239,.96);border-radius:17px;background:var(--card);box-shadow:0 14px 40px rgba(31,53,88,.08)}.section-head{display:flex;align-items:flex-start;justify-content:space-between;gap:15px;margin-bottom:12px}.section-head h2{margin:0;font-size:18px}.section-head p{margin:4px 0 0;color:var(--muted);font-size:10px}.controls{display:flex;align-items:center;flex-wrap:wrap;gap:7px}.control{display:flex;align-items:center;gap:5px;color:var(--muted);font-size:9px}.control input,.control select{height:31px;border:1px solid var(--line);border-radius:7px;padding:0 7px;color:var(--ink);background:#fff;font:inherit;font-size:10px}.control input{width:54px;text-align:center}.control select{min-width:125px}.overview{display:grid;grid-template-columns:minmax(250px,1.3fr) repeat(4,minmax(115px,.7fr));gap:9px}.verdict{padding:13px 15px;border:1px solid #bdd0fa;border-radius:12px;background:linear-gradient(135deg,#edf3ff,#f9fbff)}.verdict.warn{border-color:#efc88f;background:#fff8ed}.verdict.danger{border-color:#efb7bf;background:#fff2f4}.verdict small,.metric small{display:block;color:var(--muted);font-size:8px}.verdict b{display:block;margin-top:4px;color:var(--blue);font-size:18px}.verdict.warn b{color:var(--orange)}.verdict.danger b{color:var(--red)}.verdict span{display:block;margin-top:4px;color:var(--muted);font-size:9px;line-height:1.45}.metric{padding:12px;border:1px solid var(--line);border-radius:12px;background:#fbfcfe}.metric b{display:block;margin-top:5px;font-size:16px}.legend{display:flex;align-items:center;flex-wrap:wrap;gap:13px;margin-top:10px;color:var(--muted);font-size:9px}.legend span{display:flex;align-items:center;gap:5px}.legend i{width:16px;height:9px;border-radius:3px;background:#dce7ff}.legend span:nth-child(2) i{background:#fff0dd}.legend span:nth-child(3) i{background:#173f9b}.legend span:nth-child(4) i{background:#e8edf3}.board-toolbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}.week-nav{display:flex;align-items:center;gap:7px}.week-nav button{width:31px;height:31px;border:1px solid var(--line);border-radius:8px;color:var(--ink);background:#fff;font:800 14px inherit;cursor:pointer}.week-nav button:disabled{opacity:.35;cursor:not-allowed}.week-nav b{min-width:150px;text-align:center;font-size:11px}.schedule-wrap{overflow:auto;border:1px solid var(--line);border-radius:12px}.schedule{min-width:1290px;border-collapse:separate;border-spacing:0;font-size:9px}.schedule th,.schedule td{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:5px;text-align:center;vertical-align:middle}.schedule tr:last-child td,.schedule tr:last-child th{border-bottom:0}.schedule th:last-child,.schedule td:last-child{border-right:0}.schedule thead th{position:sticky;top:0;z-index:4;height:52px;color:var(--muted);background:#f5f7fb}.schedule .supplier-col{position:sticky;left:0;z-index:5;width:184px;min-width:184px;text-align:left;background:#fff}.schedule thead .supplier-col{z-index:7;background:#eef3fa}.supplier-name{display:block;font-size:11px;font-weight:850}.supplier-meta{display:block;margin-top:4px;color:var(--muted);font-size:8px;line-height:1.4}.supplier-meta.bad{color:var(--red)}.date-head{width:77px;min-width:77px;cursor:pointer}.date-head b{display:block;color:var(--ink);font-size:10px}.date-head span{display:block;margin-top:3px}.date-head.weekend{background:#eff2f6}.date-head.selected{color:var(--blue);background:#e8efff}.drop-cell{height:76px;background:#fff;transition:background .15s}.drop-cell.unavailable{background:repeating-linear-gradient(135deg,#f5f6f8,#f5f6f8 5px,#eef0f3 5px,#eef0f3 10px)}.drop-cell.dragover{background:#e8f0ff;box-shadow:inset 0 0 0 2px #86a4eb}.delivery-card{position:relative;margin:2px 0;padding:7px 5px;border-radius:7px;color:#244e98;background:#dce7ff;cursor:grab;box-shadow:0 2px 5px rgba(36,91,215,.1);user-select:none}.delivery-card:active{cursor:grabbing}.delivery-card.manual{color:#7a4b16;background:#fff0dd}.delivery-card.confirmed{color:#fff;background:var(--blue2)}.delivery-card.fixed{color:#586477;background:#e8edf3;cursor:not-allowed;box-shadow:none}.delivery-card.conflict{box-shadow:inset 0 0 0 2px var(--red)}.delivery-card b{display:block;font-size:10px}.delivery-card span{display:block;margin-top:2px;font-size:7px}.delivery-card em{position:absolute;right:4px;top:3px;width:5px;height:5px;border-radius:50%;background:var(--blue);font-style:normal}.delivery-card.manual em{background:var(--orange)}.delivery-card.confirmed em{background:#fff}.summary-row th,.summary-row td{height:42px;background:#fbfcfe}.summary-label{font-weight:850}.summary-row.inventory td{font-weight:850}.summary-row.inventory td.safe{color:var(--green);background:#eef8f4}.summary-row.inventory td.warn{color:var(--orange);background:#fff7eb}.summary-row.inventory td.danger{color:var(--red);background:#fff0f2}.summary-row.buffer td{color:var(--orange)}.day-strip{display:grid;grid-template-columns:155px repeat(5,1fr);gap:7px;margin-top:10px}.day-main,.day-stat{padding:9px 10px;border:1px solid var(--line);border-radius:9px;background:#fbfcfe}.day-main small,.day-stat small{display:block;color:var(--muted);font-size:8px}.day-main b,.day-stat b{display:block;margin-top:4px;font-size:12px}.day-main span{display:block;margin-top:3px;color:var(--muted);font-size:8px}.validation{margin-top:10px}.validation summary{cursor:pointer;color:var(--muted);font-size:9px}.issue-list{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:7px}.issue{padding:8px 9px;border-left:3px solid var(--orange);border-radius:7px;color:#7d531f;background:#fff6e9;font-size:8px;line-height:1.45}.issue.danger{border-left-color:var(--red);color:#84333c;background:#fff0f2}.result-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}.result-head h2{margin:0;font-size:18px}.status{padding:5px 8px;border-radius:999px;color:#fff;background:var(--green);font-size:9px;font-weight:800}.status.editing{background:var(--orange)}.status.error{background:var(--red)}.table-wrap{overflow-x:auto}.result-table{width:100%;border-collapse:collapse;font-size:10px}.result-table th{padding:9px 8px;color:var(--muted);background:#f5f7fb;text-align:right;white-space:nowrap}.result-table th:first-child,.result-table td:first-child{text-align:left}.result-table td{padding:10px 8px;border-bottom:1px solid var(--line);text-align:right}.result-table tr:last-child td{border:0}.result-table td:nth-child(3){font-weight:850}.modal-backdrop{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;padding:18px;background:rgba(18,29,48,.38)}.modal-backdrop.open{display:flex}.modal{width:min(380px,100%);padding:20px;border-radius:15px;background:#fff;box-shadow:0 24px 60px rgba(20,35,60,.25)}.modal h3{margin:0;font-size:17px}.modal-meta{margin:5px 0 15px;color:var(--muted);font-size:10px}.modal label{display:block;color:var(--muted);font-size:10px}.modal input{width:100%;height:42px;margin-top:6px;border:1px solid var(--line);border-radius:9px;padding:0 10px;color:var(--ink);font:inherit;font-size:13px}.modal-actions{display:flex;justify-content:space-between;gap:8px;margin-top:15px}.modal-actions div{display:flex;gap:7px}.btn.danger{color:var(--red);border-color:#efc4ca;background:#fff6f7}
@media(max-width:1080px){.overview{grid-template-columns:1fr 1fr}.verdict{grid-column:1/-1}.day-strip{grid-template-columns:repeat(3,1fr)}.day-main{grid-column:1/-1}.issue-list{grid-template-columns:1fr 1fr}}@media(max-width:720px){.page{width:calc(100% - 18px);padding-top:17px}.hero,.section-head{align-items:flex-start;flex-direction:column}.actions{width:100%}.actions .btn{flex:1}.overview,.day-strip{grid-template-columns:1fr 1fr}.verdict,.day-main{grid-column:1/-1}.issue-list{grid-template-columns:1fr}.card{padding:13px}}@media(max-width:460px){.overview,.day-strip{grid-template-columns:1fr}.verdict,.day-main{grid-column:auto}}@media print{body{background:#fff}.page{width:100%;padding:0}.actions,.controls,.week-nav{display:none}.card{box-shadow:none}.schedule-wrap{overflow:visible}.schedule{transform:scale(.78);transform-origin:left top;margin-bottom:-130px}}
</style>
</head>
<body><main class="page">
<header class="hero"><div><div class="eyebrow">要货计划模块 · 简化人机协同</div><h1>玉米淀粉要货排班</h1><p class="subtitle">拖动卡片改变供应商或日期，点击卡片修改数量，最后确认方案。</p></div><div class="actions"><button class="btn" id="regenerate">重新生成系统方案</button><button class="btn primary" id="confirm">确认当前方案</button></div></header>

<section class="card"><div class="section-head"><div><h2>1. 当前状态</h2><p>系统已自动生成初始解。人工拖动或修改过的卡片会自动保留。</p></div><div class="controls"><label class="control">原材料<select id="material"><option selected>玉米淀粉</option><option disabled>其他原材料（待接入）</option></select></label><label class="control">在库<input id="onhand" type="number" min="0" step="100" value="1200">吨</label><label class="control">Buffer<input id="buffer-days" type="number" min="0" max="10" value="2">天</label><label class="control">排程强度<input id="schedule-factor" type="number" min="20" max="200" step="5" value="100">%</label></div></div><div class="overview"><div class="verdict" id="verdict"><small>未来28天判断</small><b id="verdict-status"></b><span id="verdict-text"></span></div><div class="metric"><small>新增要货</small><b id="metric-total"></b></div><div class="metric"><small>涉及供应商</small><b id="metric-suppliers"></b></div><div class="metric"><small>人工调整</small><b id="metric-manual"></b></div><div class="metric"><small>合同剩余</small><b id="metric-balance"></b></div></div><div class="legend"><span><i></i>系统建议</span><span><i></i>人工调整</span><span><i></i>人工确认</span><span><i></i>已有在途（不可拖动）</span></div></section>

<section class="card"><div class="board-toolbar"><div><h2 style="margin:0;font-size:18px">2. 供应商供货排班</h2><p style="margin:4px 0 0;color:var(--muted);font-size:10px">默认显示14天。拖动蓝色或橙色卡片改变供货安排；点击卡片修改数量。</p></div><div class="week-nav"><button id="prev-week" aria-label="上一周">‹</button><b id="range-label"></b><button id="next-week" aria-label="下一周">›</button></div></div><div class="schedule-wrap"><table class="schedule" id="board"></table></div><div class="day-strip"><div class="day-main"><small>选中日期</small><b id="day-date"></b><span>点击日期表头查看当天情况</span></div><div class="day-stat"><small>已有在途</small><b id="day-fixed"></b></div><div class="day-stat"><small>计划要货</small><b id="day-plan"></b></div><div class="day-stat"><small>生产耗用</small><b id="day-use"></b></div><div class="day-stat"><small>预计库存</small><b id="day-stock"></b></div><div class="day-stat"><small>动态Buffer</small><b id="day-buffer"></b></div></div><details class="validation" id="validation"><summary id="validation-summary"></summary><div class="issue-list" id="issues"></div></details></section>

<section class="card"><div class="result-head"><h2>3. 当前方案汇总</h2><span class="status" id="status"></span></div><div class="table-wrap"><table class="result-table"><thead><tr><th>已签约供应商</th><th>供货日期</th><th>供货总量</th><th>合同价</th><th>计划金额</th><th>计划后合同余额</th><th>来源</th></tr></thead><tbody id="result-body"></tbody></table></div></section>
</main>

<div class="modal-backdrop" id="modal-backdrop" role="dialog" aria-modal="true" aria-labelledby="modal-title"><div class="modal"><h3 id="modal-title">修改供货数量</h3><div class="modal-meta" id="modal-meta"></div><label for="modal-qty">供货数量（吨）</label><input id="modal-qty" type="number" min="0" step="50"><div class="modal-actions"><button class="btn danger" id="remove-card">移除安排</button><div><button class="btn" id="cancel-modal">取消</button><button class="btn primary" id="save-card">保存</button></div></div></div></div>

<script>
(()=>{
const TODAY="2026-09-01",HORIZON=28,WINDOW=14;
const addDays=(iso,n)=>{const d=new Date(`${iso}T00:00:00`);d.setDate(d.getDate()+n);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`};
const fmt=(n,d=0)=>Number(n).toLocaleString("zh-CN",{minimumFractionDigits:d,maximumFractionDigits:d});
const shortDate=iso=>{const d=new Date(`${iso}T00:00:00`);return `${d.getMonth()+1}/${d.getDate()}`};
const week=iso=>"日一二三四五六"[new Date(`${iso}T00:00:00`).getDay()];
const dates=Array.from({length:HORIZON},(_,i)=>addDays(TODAY,i+1));
const suppliers=[{name:"甲供应商",price:3220,remain:1800,end:"2026-11-30",dailyCap:600,minQty:200,notice:3,onTime:97.5,risk:12},{name:"乙供应商",price:3250,remain:1500,end:"2026-10-31",dailyCap:500,minQty:200,notice:4,onTime:98.2,risk:8},{name:"丙供应商",price:3240,remain:1000,end:"2026-09-30",dailyCap:400,minQty:200,notice:2,onTime:96.4,risk:20},{name:"丁供应商",price:3265,remain:800,end:"2026-12-31",dailyCap:400,minQty:200,notice:5,onTime:99,risk:6}];
const fixed=[{supplier:0,day:1,qty:400},{supplier:1,day:4,qty:300},{supplier:2,day:7,qty:200}];
const pattern=[{f42:80,f55:70,malt:50},{f42:90,f55:65,malt:45},{f42:75,f55:80,malt:50},{f42:85,f55:75,malt:55},{f42:95,f55:70,malt:45},{f42:70,f55:65,malt:40},{f42:60,f55:60,malt:35}];
let arrangements=[],daily=[],projection=[],windowStart=0,selectedDay=0,editingId=null,nextId=1,confirmed=false,dragging=false;
function fixedAt(s,d){return fixed.filter(x=>x.supplier===s&&x.day===d).reduce((sum,x)=>sum+x.qty,0)}
function fixedTotal(d){return fixed.filter(x=>x.day===d).reduce((sum,x)=>sum+x.qty,0)}
function available(s,d){const supplier=suppliers[s],date=dates[d];return addDays(TODAY,supplier.notice)<=date&&supplier.end>=date}
function buildDaily(){const factor=Math.max(.2,+document.querySelector("#schedule-factor").value/100||1);daily=dates.map((date,i)=>{const p=pattern[i%pattern.length],f42=p.f42*factor,f55=p.f55*factor,malt=p.malt*factor,consumption=f42*.72/.96+f55*.78/.95+malt*.68/.97;return {date,consumption}})}
function bufferAt(d){const n=Math.max(0,Math.round(+document.querySelector("#buffer-days").value||0));return daily.slice(d+1,d+1+n).reduce((sum,x)=>sum+x.consumption,0)}
function lockedQty(s){return arrangements.filter(x=>x.supplier===s&&x.source!=="system").reduce((sum,x)=>sum+x.qty,0)}
function generate(preserveManual){if(!preserveManual){arrangements=[];confirmed=false}else arrangements=arrangements.filter(x=>x.source!=="system");buildDaily();const remain=suppliers.map((s,i)=>Math.max(0,s.remain-lockedQty(i)));let inventory=Math.max(0,+document.querySelector("#onhand").value||0);for(let d=0;d<HORIZON;d++){inventory+=fixedTotal(d)+arrangements.filter(x=>x.day===d&&x.source!=="system").reduce((sum,x)=>sum+x.qty,0);let need=Math.max(0,bufferAt(d)+daily[d].consumption-inventory);const candidates=suppliers.map((supplier,index)=>({supplier,index})).filter(x=>available(x.index,d)&&remain[x.index]>0&&!arrangements.some(a=>a.supplier===x.index&&a.day===d)).sort((a,b)=>a.supplier.end.localeCompare(b.supplier.end)||b.supplier.onTime-a.supplier.onTime||a.supplier.risk-b.supplier.risk);for(const {supplier,index} of candidates){if(need<=.01)break;const raw=Math.min(need,remain[index],supplier.dailyCap),qty=raw>0?Math.min(remain[index],supplier.dailyCap,Math.max(supplier.minQty,Math.ceil(raw/50)*50)):0;if(!qty)continue;arrangements.push({id:nextId++,supplier:index,day:d,qty,source:"system"});remain[index]-=qty;inventory+=qty;need=Math.max(0,bufferAt(d)+daily[d].consumption-inventory)}inventory-=daily[d].consumption}recalculate()}
function simulate(){let inventory=Math.max(0,+document.querySelector("#onhand").value||0);projection=daily.map((day,d)=>{const fixedQty=fixedTotal(d),planned=arrangements.filter(x=>x.day===d).reduce((sum,x)=>sum+x.qty,0),buffer=bufferAt(d);inventory+=fixedQty+planned-day.consumption;return {...day,fixed:fixedQty,planned,buffer,inventory}})}
function collectIssues(){const issues=[],usage=suppliers.map(()=>0);arrangements.forEach(a=>{const s=suppliers[a.supplier];usage[a.supplier]+=a.qty;if(!available(a.supplier,a.day))issues.push({level:"danger",text:`${s.name}在${shortDate(dates[a.day])}不满足通知时间或合同有效期。`});if(a.qty>s.dailyCap)issues.push({level:"danger",text:`${s.name}在${shortDate(dates[a.day])}超过日供货上限${fmt(s.dailyCap)}吨。`});if(a.qty<s.minQty)issues.push({level:"warn",text:`${s.name}在${shortDate(dates[a.day])}低于最小要货量${fmt(s.minQty)}吨。`})});usage.forEach((qty,s)=>{if(qty>suppliers[s].remain)issues.push({level:"danger",text:`${suppliers[s].name}计划量超过合同余额${fmt(qty-suppliers[s].remain)}吨。`})});projection.forEach(p=>{if(p.inventory<0)issues.push({level:"danger",text:`${shortDate(p.date)}预计缺料${fmt(Math.abs(p.inventory))}吨。`});else if(p.inventory<p.buffer)issues.push({level:"warn",text:`${shortDate(p.date)}预计库存低于Buffer ${fmt(p.buffer-p.inventory)}吨。`})});return issues}
function arrangementConflict(a){const supplier=suppliers[a.supplier],usage=arrangements.filter(x=>x.supplier===a.supplier).reduce((sum,x)=>sum+x.qty,0);return !available(a.supplier,a.day)||a.qty>supplier.dailyCap||a.qty<supplier.minQty||usage>supplier.remain}
function renderBoard(){const start=windowStart,end=Math.min(HORIZON,start+WINDOW),visible=dates.slice(start,end),board=document.querySelector("#board");document.querySelector("#range-label").textContent=`${shortDate(visible[0])} — ${shortDate(visible.at(-1))}`;document.querySelector("#prev-week").disabled=start===0;document.querySelector("#next-week").disabled=end===HORIZON;let html=`<thead><tr><th class="supplier-col">已签约供应商</th>${visible.map((date,i)=>{const d=start+i,weekend=[0,6].includes(new Date(`${date}T00:00:00`).getDay());return `<th class="date-head ${weekend?"weekend":""} ${d===selectedDay?"selected":""}" data-day="${d}"><b>${shortDate(date)}</b><span>周${week(date)}</span></th>`}).join("")}</tr></thead><tbody>`;suppliers.forEach((supplier,s)=>{const used=arrangements.filter(x=>x.supplier===s).reduce((sum,x)=>sum+x.qty,0),balance=supplier.remain-used;html+=`<tr><th class="supplier-col"><span class="supplier-name">${supplier.name}</span><span class="supplier-meta ${balance<0?"bad":""}">合同${fmt(supplier.remain)}吨 · 余额${fmt(balance)}吨<br>¥${fmt(supplier.price)}/吨 · 日上限${fmt(supplier.dailyCap)}吨</span></th>`;for(let d=start;d<end;d++){const unavailable=!available(s,d),fixedQty=fixedAt(s,d),cards=arrangements.filter(x=>x.supplier===s&&x.day===d);html+=`<td class="drop-cell ${unavailable?"unavailable":""}" data-supplier="${s}" data-day="${d}">${fixedQty?`<div class="delivery-card fixed"><b>${fmt(fixedQty)}吨</b><span>已有在途</span></div>`:""}${cards.map(a=>`<div class="delivery-card ${a.source} ${arrangementConflict(a)?"conflict":""}" draggable="true" data-id="${a.id}"><b>${fmt(a.qty)}吨</b><span>${a.source==="system"?"系统建议":a.source==="confirmed"?"人工确认":"人工调整"}</span><em></em></div>`).join("")}</td>`}html+="</tr>"});const rows=[{key:"inventory",label:"日末预计库存",value:d=>projection[d].inventory},{key:"buffer",label:"动态Buffer",value:d=>projection[d].buffer}];rows.forEach(row=>{html+=`<tr class="summary-row ${row.key}"><th class="supplier-col summary-label">${row.label}</th>`;for(let d=start;d<end;d++){let cls="";if(row.key==="inventory")cls=projection[d].inventory<0?"danger":projection[d].inventory<projection[d].buffer?"warn":"safe";html+=`<td class="${cls}">${fmt(row.value(d))}t</td>`}html+="</tr>"});board.innerHTML=html+"</tbody>";wireBoard();renderDay();renderSummary()}
function wireBoard(){document.querySelectorAll(".date-head").forEach(th=>th.onclick=()=>{selectedDay=+th.dataset.day;renderBoard()});document.querySelectorAll(".delivery-card:not(.fixed)").forEach(card=>{card.ondragstart=e=>{dragging=true;e.dataTransfer.setData("text/plain",card.dataset.id);e.dataTransfer.effectAllowed="move"};card.ondragend=()=>setTimeout(()=>dragging=false,0);card.onclick=()=>{if(!dragging)openModal(+card.dataset.id)}});document.querySelectorAll(".drop-cell").forEach(cell=>{cell.ondragover=e=>{e.preventDefault();cell.classList.add("dragover")};cell.ondragleave=()=>cell.classList.remove("dragover");cell.ondrop=e=>{e.preventDefault();cell.classList.remove("dragover");const id=+e.dataTransfer.getData("text/plain"),a=arrangements.find(x=>x.id===id);if(!a)return;a.supplier=+cell.dataset.supplier;a.day=+cell.dataset.day;a.source="manual";confirmed=false;recalculate()}})}
function renderDay(){const p=projection[selectedDay];document.querySelector("#day-date").textContent=`${shortDate(p.date)} · 周${week(p.date)}`;document.querySelector("#day-fixed").textContent=`${fmt(p.fixed)}吨`;document.querySelector("#day-plan").textContent=`${fmt(p.planned)}吨`;document.querySelector("#day-use").textContent=`${fmt(p.consumption)}吨`;document.querySelector("#day-stock").textContent=`${fmt(p.inventory)}吨`;document.querySelector("#day-buffer").textContent=`${fmt(p.buffer)}吨`}
function renderSummary(){const issues=collectIssues(),danger=issues.some(x=>x.level==="danger"),warn=issues.some(x=>x.level==="warn"),total=arrangements.reduce((sum,x)=>sum+x.qty,0),manual=arrangements.filter(x=>x.source==="manual").length,names=new Set(arrangements.map(x=>x.supplier)),balance=suppliers.reduce((sum,s,i)=>sum+s.remain-arrangements.filter(x=>x.supplier===i).reduce((n,x)=>n+x.qty,0),0),verdict=document.querySelector("#verdict");verdict.className="verdict";if(danger){verdict.classList.add("danger");document.querySelector("#verdict-status").textContent="存在冲突";document.querySelector("#verdict-text").textContent="请调整红框卡片；详细原因已在排班表下方展开。"}else if(warn){verdict.classList.add("warn");document.querySelector("#verdict-status").textContent="需要复核";document.querySelector("#verdict-text").textContent="方案可继续调整，存在最小要货量或Buffer提醒。"}else{document.querySelector("#verdict-status").textContent=confirmed?"已人工确认":"方案可执行";document.querySelector("#verdict-text").textContent=confirmed?"当前排班已确认；如继续拖动或修改，将自动转为人工调整。":"系统初始解已满足约束，可直接确认或拖动卡片调整。"}document.querySelector("#metric-total").textContent=`${fmt(total)}吨`;document.querySelector("#metric-suppliers").textContent=`${names.size}家`;document.querySelector("#metric-manual").textContent=`${manual}项`;document.querySelector("#metric-balance").textContent=`${fmt(balance)}吨`;const status=document.querySelector("#status");status.textContent=danger?"存在约束冲突":confirmed?"已人工确认":manual?"含人工调整":"系统建议";status.className=`status ${danger?"error":manual?"editing":""}`;const validation=document.querySelector("#validation"),summary=document.querySelector("#validation-summary");summary.textContent=issues.length?`发现${issues.length}项需要关注，点击查看`:"所有约束校验通过";validation.open=issues.length>0;document.querySelector("#issues").innerHTML=issues.length?issues.slice(0,9).map(x=>`<div class="issue ${x.level}">${x.text}</div>`).join(""):'<div class="issue" style="border-left-color:var(--green);color:#356252;background:#edf8f3">库存、合同和供货能力校验均通过。</div>';const rows=[];suppliers.forEach((s,i)=>{const items=arrangements.filter(x=>x.supplier===i);if(!items.length)return;const qty=items.reduce((sum,x)=>sum+x.qty,0),sources=[...new Set(items.map(x=>x.source))];rows.push({s,qty,dates:items.sort((a,b)=>a.day-b.day).map(x=>shortDate(dates[x.day])).join("、"),source:sources.includes("manual")?"人工调整":sources.includes("confirmed")?"人工确认":"系统建议"})});document.querySelector("#result-body").innerHTML=rows.length?rows.map(r=>`<tr><td>${r.s.name}</td><td>${r.dates}</td><td>${fmt(r.qty)}吨</td><td>${fmt(r.s.price)}元/吨</td><td>${fmt(r.qty*r.s.price/10000,1)}万元</td><td>${fmt(r.s.remain-r.qty)}吨</td><td>${r.source}</td></tr>`).join(""):'<tr><td colspan="7">当前无需新增要货。</td></tr>'}
function openModal(id){const a=arrangements.find(x=>x.id===id);if(!a)return;editingId=id;document.querySelector("#modal-meta").textContent=`${suppliers[a.supplier].name} · ${shortDate(dates[a.day])}`;document.querySelector("#modal-qty").value=a.qty;document.querySelector("#modal-backdrop").classList.add("open");setTimeout(()=>document.querySelector("#modal-qty").focus(),0)}
function closeModal(){editingId=null;document.querySelector("#modal-backdrop").classList.remove("open")}
function recalculate(){buildDaily();simulate();renderBoard()}
document.querySelector("#prev-week").onclick=()=>{windowStart=Math.max(0,windowStart-7);selectedDay=Math.max(windowStart,selectedDay-7);renderBoard()};document.querySelector("#next-week").onclick=()=>{windowStart=Math.min(HORIZON-WINDOW,windowStart+7);selectedDay=Math.min(windowStart+WINDOW-1,selectedDay+7);renderBoard()};document.querySelector("#regenerate").onclick=()=>generate(false);document.querySelector("#confirm").onclick=()=>{recalculate();if(collectIssues().some(x=>x.level==="danger")){document.querySelector("#validation").scrollIntoView({behavior:"smooth",block:"center"});return}arrangements.forEach(x=>x.source="confirmed");confirmed=true;recalculate()};document.querySelectorAll("#onhand,#buffer-days,#schedule-factor").forEach(input=>input.addEventListener("change",()=>{arrangements.forEach(x=>{if(x.source==="confirmed")x.source="manual"});confirmed=false;generate(true)}));document.querySelector("#cancel-modal").onclick=closeModal;document.querySelector("#modal-backdrop").onclick=e=>{if(e.target.id==="modal-backdrop")closeModal()};document.querySelector("#save-card").onclick=()=>{const a=arrangements.find(x=>x.id===editingId);if(a){a.qty=Math.max(0,+document.querySelector("#modal-qty").value||0);a.source="manual";if(!a.qty)arrangements=arrangements.filter(x=>x.id!==editingId);confirmed=false}closeModal();recalculate()};document.querySelector("#remove-card").onclick=()=>{arrangements=arrangements.filter(x=>x.id!==editingId);confirmed=false;closeModal();recalculate()};document.addEventListener("keydown",e=>{if(e.key==="Escape")closeModal()});generate(false);
})();
</script>
</body></html>
