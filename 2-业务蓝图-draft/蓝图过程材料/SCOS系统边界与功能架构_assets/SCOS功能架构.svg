<svg xmlns="http://www.w3.org/2000/svg" width="1780" height="1220" viewBox="0 0 1780 1220">
  <defs><style>.title{font:bold 24px 'PingFang SC','Microsoft YaHei',sans-serif;fill:#222}.layer{font:bold 17px 'PingFang SC','Microsoft YaHei',sans-serif;fill:#222}.head{font:bold 15px 'PingFang SC','Microsoft YaHei',sans-serif;fill:#222}.txt{font:13px 'PingFang SC','Microsoft YaHei',sans-serif;fill:#222}.small{font:12px 'PingFang SC','Microsoft YaHei',sans-serif;fill:#444}.box{fill:#fff;stroke:#555;stroke-width:1.3}.scos{fill:#fff;stroke:#4f7d5b;stroke-width:1.5}.soft{fill:#f4f4f4;stroke:#666;stroke-width:1.3}.ext{fill:#fff;stroke:#c94747;stroke-width:1.3}</style></defs>
