<svg xmlns="http://www.w3.org/2000/svg" width="2300" height="1012" viewBox="0 0 2300 1012"><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8.4" refY="4.5" orient="auto"><path d="M0 0L9 4.5 0 9Z" fill="#111"/></marker><style>.title{font:600 23px SimSun,'Songti SC',STSong,serif;fill:#222}.lane-text{font:16px SimSun,'Songti SC',STSong,serif;fill:#222}.node-text{font:16px SimSun,'Songti SC',STSong,serif;fill:#222}.small-text{font:15px SimSun,'Songti SC',STSong,serif;fill:#333}.note-text{font:14px SimSun,'Songti SC',STSong,serif;fill:#444}.tag-text{font:14px Arial,'Microsoft YaHei',sans-serif;fill:#fff}.node{fill:#fff;stroke:#999;stroke-width:1.2}.divider{stroke:#aaa;stroke-width:1}.flow{fill:none;stroke:#111;stroke-width:1.6;marker-end:url(#arrow)}.merge{fill:none;stroke:#111;stroke-width:1.6}.tag-scos{fill:#058fc7}.tag-data{fill:#08a05c}</style></defs><rect width="2300" height="1012" fill="#fff"/><rect x="20" y="20" width="2260" height="912" fill="#fff" stroke="#aaa"/><text x="34" y="55" class="title">流程编号及名称：（P-ZLTC-SCOS-FYCB-007 基于销售订单成本的多维度成本分析流程）</text><rect x="20" y="82" width="2260" height="850" fill="#fff" stroke="#999"/><rect x="20" y="82" width="72" height="850" fill="#fafafa" stroke="#999"/><path d="M20 252H2280" class="divider"/><path d="M20 422H2280" class="divider"/><path d="M20 592H2280" class="divider"/><path d="M20 762H2280" class="divider"/><text x="56" y="141.5" text-anchor="middle" class="lane-text"><tspan x="56" dy="0">数</tspan><tspan x="56" dy="17">据</tspan><tspan x="56" dy="17">中</tspan><tspan x="56" dy="17">台</tspan></text><text x="56" y="311.5" text-anchor="middle" class="lane-text"><tspan x="56" dy="0">S</tspan><tspan x="56" dy="17">C</tspan><tspan x="56" dy="17">O</tspan><tspan x="56" dy="17">S</tspan></text><text x="56" y="473" text-anchor="middle" class="lane-text"><tspan x="56" dy="0">生</tspan><tspan x="56" dy="17">产</tspan><tspan x="56" dy="17">负</tspan><tspan x="56" dy="17">责</tspan><tspan x="56" dy="17">人</tspan></text><text x="56" y="643" text-anchor="middle" class="lane-text"><tspan x="56" dy="0">销</tspan><tspan x="56" dy="17">售</tspan><tspan x="56" dy="17">负</tspan><tspan x="56" dy="17">责</tspan><tspan x="56" dy="17">人</tspan></text><text x="56" y="813" text-anchor="middle" class="lane-text"><tspan x="56" dy="0">采</tspan><tspan x="56" dy="17">购</tspan><tspan x="56" dy="17">负</tspan><tspan x="56" dy="17">责</tspan><tspan x="56" dy="17">人</tspan></text><circle cx="145" cy="337" r="27" class="node"/><text x="145" y="342" text-anchor="middle" class="small-text">开始</text><rect x="275" y="289" width="250" height="96" class="node"/><rect x="275" y="289" width="56" height="20" class="tag-scos"/><text x="303" y="304" text-anchor="middle" class="tag-text">SCOS</text><text x="400" y="319" text-anchor="middle" class="node-text"><tspan x="400">10</tspan><tspan x="400" dy="20">生成并分发多维成本</tspan><tspan x="400" dy="20">分析数据集</tspan></text><rect x="805" y="459" width="250" height="96" class="node"/><rect x="805" y="459" width="56" height="20" class="tag-scos"/><text x="833" y="474" text-anchor="middle" class="tag-text">SCOS</text><text x="930" y="489" text-anchor="middle" class="node-text"><tspan x="930">20</tspan><tspan x="930" dy="20">接收生产批次和产品</tspan><tspan x="930" dy="20">成本视图</tspan></text><rect x="805" y="629" width="250" height="96" class="node"/><rect x="805" y="629" width="56" height="20" class="tag-scos"/><text x="833" y="644" text-anchor="middle" class="tag-text">SCOS</text><text x="930" y="659" text-anchor="middle" class="node-text"><tspan x="930">30</tspan><tspan x="930" dy="20">接收订单客户和产品</tspan><tspan x="930" dy="20">成本视图</tspan></text><rect x="805" y="799" width="250" height="96" class="node"/><rect x="805" y="799" width="56" height="20" class="tag-scos"/><text x="833" y="814" text-anchor="middle" class="tag-text">SCOS</text><text x="930" y="829" text-anchor="middle" class="node-text"><tspan x="930">40</tspan><tspan x="930" dy="20">接收供应商和采购</tspan><tspan x="930" dy="20">成本视图</tspan></text><rect x="1335" y="289" width="250" height="96" class="node"/><rect x="1335" y="289" width="56" height="20" class="tag-scos"/><text x="1363" y="304" text-anchor="middle" class="tag-text">SCOS</text><text x="1460" y="319" text-anchor="middle" class="node-text"><tspan x="1460">50</tspan><tspan x="1460" dy="20">执行跨维度钻取和</tspan><tspan x="1460" dy="20">差异分析</tspan></text><rect x="1725" y="119" width="250" height="96" class="node"/><rect x="1725" y="119" width="70" height="20" class="tag-data"/><text x="1760" y="134" text-anchor="middle" class="tag-text">数据中台</text><text x="1850" y="149" text-anchor="middle" class="node-text"><tspan x="1850">60</tspan><tspan x="1850" dy="20">持久化分析快照和</tspan><tspan x="1850" dy="20">导出记录</tspan></text><circle cx="2225" cy="167" r="27" class="node"/><text x="2225" y="172" text-anchor="middle" class="small-text">结束</text><path d="M426 259H602V302Q558 316 514 302Q470 288 426 302Z" class="node"/><text x="514" y="280" text-anchor="middle" class="small-text"><tspan x="514">多维成本分析数据集</tspan></text><path d="M956 429H1132V472Q1088 486 1044 472Q1000 458 956 472Z" class="node"/><text x="1044" y="450" text-anchor="middle" class="small-text"><tspan x="1044">生产成本追溯视图</tspan></text><path d="M956 599H1132V642Q1088 656 1044 642Q1000 628 956 642Z" class="node"/><text x="1044" y="620" text-anchor="middle" class="small-text"><tspan x="1044">销售成本追溯视图</tspan></text><path d="M956 769H1132V812Q1088 826 1044 812Q1000 798 956 812Z" class="node"/><text x="1044" y="790" text-anchor="middle" class="small-text"><tspan x="1044">供应商与采购成本视图</tspan></text><path d="M1486 259H1662V302Q1618 316 1574 302Q1530 288 1486 302Z" class="node"/><text x="1574" y="280" text-anchor="middle" class="small-text"><tspan x="1574">跨维度成本指标集</tspan></text><path d="M1876 89H2052V132Q2008 146 1964 132Q1920 118 1876 132Z" class="node"/><text x="1964" y="110" text-anchor="middle" class="small-text"><tspan x="1964">多维成本分析看板</tspan></text><path d="M172 337H275" class="flow"/><path d="M525 337H690" class="merge"/><path d="M690 337V847" class="merge"/><path d="M690 507H805" class="flow"/><path d="M690 677H805" class="flow"/><path d="M690 847H805" class="flow"/><text x="545" y="325" class="small-text">同时分发同一数据版本</text><path d="M1055 507H1260" class="flow"/><path d="M1055 677H1260" class="flow"/><path d="M1055 847H1260" class="flow"/><path d="M1260 337V847" class="merge"/><path d="M1260 337H1335" class="flow"/><text x="1270" y="325" class="small-text">汇合三类分析条件</text><path d="M1585 337H1705V167H1725" class="flow"/><path d="M1975 167H2198" class="flow"/><text x="106" y="978" class="note-text">业务口径：SCOS基于同一成本版本生成多维成本分析数据集，同时分发给生产、销售和采购负责人；供应商及采购维度由采购负责人使用，分析快照持久化到数据中台。</text></svg>
