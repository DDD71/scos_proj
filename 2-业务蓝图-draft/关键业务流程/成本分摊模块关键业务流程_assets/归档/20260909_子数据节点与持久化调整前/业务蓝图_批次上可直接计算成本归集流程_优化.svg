129" width="236" height="96" class="node"/><rect x="192" y="129" width="70" height="20" class="tag-data"/><text x="227" y="144" text-anchor="middle" class="tag-text">数据中台</text><text x="310" y="169" text-anchor="middle" class="node-text"><tspan x="310">10</tspan><tspan x="310" dy="20">提供当月成本事实数据</tspan></text><rect x="512" y="319" width="236" height="96" class="node"/><rect x="512" y="319" width="56" height="20" class="tag-scos"/><text x="540" y="334" text-anchor="middle" class="tag-text">SCOS</text><text x="630" y="349" text-anchor="middle" class="node-text"><tspan x="630">20</tspan><tspan x="630" dy="20">判断成本是否可直接定位</tspan><tspan x="630" dy="20">到批次</tspan></text><rect x="832" y="319" width="236" height="96" class="node"/><rect x="832" y="319" width="56" height="20" class="tag-scos"/><text x="860" y="334" text-anchor="middle" class="tag-text">SCOS</text><text x="950" y="349" text-anchor="middle" class="node-text"><tspan x="950">30</tspan><tspan x="950" dy="20">按实际业务数量计算批次</tspan><tspan x="950" dy="20">直接成本</tspan></text><rect x="1152" y="319" width="236" height="96" class="node"/><rect x="1152" y="319" width="56" height="20" class="tag-scos"/><text x="1180" y="334" text-anchor="middle" class="tag-text">SCOS</text><text x="1270" y="349" text-anchor="middle" class="node-text"><tspan x="1270">40</tspan><tspan x="1270" dy="20">检查成本来源与批次追溯</tspan><tspan x="1270" dy="20">链</tspan></text><rect x="1472" y="509" width="236" height="96" class="node"/><rect x="1472" y="509" width="56" height="20" class="tag-scos"/><text x="1500" y="524" text-anchor="middle" class="tag-text">SCOS</text><text x="1590" y="549" text-anchor="middle" class="node-text"><tspan x="1590">50</tspan><tspan x="1590" dy="20">查看成本口径和异常分类</tspan></text><rect x="1792" y="319" width="236" height="96" class="node"/><rect x="1792" y="319" width="56" height="20" class="tag-scos"/><text x="1820" y="334" text-anchor="middle" class="tag-text">SCOS</text><text x="1910" y="359" text-anchor="middle" class="node-text"><tspan x="1910">60</tspan><tspan x="1910" dy="20">持久化批次直接成本结果</tspan></text><circle cx="2275" cy="367" r="27" class="node"/><text x="2275" y="372" text-anchor="middle" class="small-text">结束</text><path d="M214 209H406V252Q358 266 310 252Q262 238 214 252Z" class="node"/><text x="310" y="230" text-anchor="middle" class="small-text"><tspan x="310" dy="0">当月标准成本事实集</tspan></text><path d="M854 399H1046V442Q998 456 950 442Q902 428 854 442Z" class="node"/><text x="950" y="420" text-anchor="middle" class="small-text"><tspan x="950" dy="0">批次直接成本明细</tspan></text><path d="M1814 399H2006V442Q1958 456 1910 442Q1862 428 1814 442Z" class="node"/><text x="1910" y="420" text-anchor="middle" class="small-text"><tspan x="1910" dy="0">批次直接成本参考版本</tspan></text><path d="M172 367H172V177H192" class="flow"/><path d="M428 177H492V367H512" class="flow"/><path d="M748 367H832" class="flow"/><path d="M1068 367H1152" class="flow"/><path d="M1388 367H1452V557H1472" class="flow"/><path d="M1708 557H1772V367H1792" class="flow"/><path d="M2028 367H2248" class="flow"/><text x="106" y="698" class="note-text">业务口径：SCOS按可追溯性将成本事实区分为批次直接成本和待分摊费用；财务负责人仅查看口径与异常，不承担实际结算审批。</text></svg>
