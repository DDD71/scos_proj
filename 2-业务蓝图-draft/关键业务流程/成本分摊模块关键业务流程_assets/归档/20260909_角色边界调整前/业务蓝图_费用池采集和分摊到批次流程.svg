<rect width="2200" height="680" fill="#fff"/><rect x="18" y="18" width="2164" height="596" fill="#fff" stroke="#aaa"/><text x="30" y="50" class="title">流程编号及名称：（P-ZLTC-SCOS-FYCB-004 费用池采集和分摊到批次流程）</text><rect x="18" y="74" width="2164" height="540" fill="#fff" stroke="#999"/><rect x="18" y="74" width="60" height="540" fill="#fafafa" stroke="#999"/><path d="M18 209H2182" stroke="#bbb"/><path d="M18 344H2182" stroke="#bbb"/><path d="M18 479H2182" stroke="#bbb"/><text x="48" y="87.5" class="lane" text-anchor="middle"><tspan x="48" dy="0">财</tspan><tspan x="48" dy="18">务</tspan><tspan x="48" dy="18">及</tspan><tspan x="48" dy="18">来</tspan><tspan x="48" dy="18">源</tspan><tspan x="48" dy="18">系</tspan><tspan x="48" dy="18">统</tspan></text><text x="48" y="249.5" class="lane" text-anchor="middle"><tspan x="48" dy="0">财</tspan><tspan x="48" dy="18">务</tspan><tspan x="48" dy="18">成</tspan><tspan x="48" dy="18">本</tspan></text><text x="48" y="384.5" class="lane" text-anchor="middle"><tspan x="48" dy="0">S</tspan><tspan x="48" dy="18">C</tspan><tspan x="48" dy="18">O</tspan><tspan x="48" dy="18">S</tspan></text><text x="48" y="501.5" class="lane" text-anchor="middle"><tspan x="48" dy="0">下</tspan><tspan x="48" dy="18">游</tspan><tspan x="48" dy="18">成</tspan><tspan x="48" dy="18">本</tspan><tspan x="48" dy="18">计</tspan><tspan x="48" dy="18">算</tspan></text><circle cx="125" cy="141.5" r="24" class="node"/><text x="125" y="146.5" class="small" text-anchor="middle">开始</text><rect x="168" y="101.5" width="204" height="80" class="node"/><text x="270" y="136.5" class="txt" text-anchor="middle"><tspan x="270" dy="0">10 采集期间费用并扣</tspan><tspan x="270" dy="18">除非池金额</tspan></text><rect x="168" y="101.5" width="72" height="18" fill="#08a05c"/><text x="204" y="114.5" class="tag" text-anchor="middle">外部系统</text><rect x="428" y="236.5" width="204" height="80" class="node"/><text x="530" y="271.5" class="txt" text-anchor="middle"><tspan x="530" dy="0">20 确认受益范围与分</tspan><tspan x="530" dy="18">摊动因</tspan></text><rect x="688" y="371.5" width="204" height="80" class="node"/><text x="790" y="406.5" class="txt" text-anchor="middle"><tspan x="790" dy="0">30 取得动因并计算有</tspan><tspan x="790" dy="18">效分母</tspan></text><rect x="688" y="371.5" width="48" height="18" fill="#058fc7"/><text x="712" y="384.5" class="tag" text-anchor="middle">SCOS</text><polygon points="1050,361.5 1126,411.5 1050,461.5 974,411.5" class="decision"/><text x="1050" y="406.5" class="txt" text-anchor="middle"><tspan x="1050" dy="0">40 判断分母是否有</tspan><tspan x="1050" dy="18">效</tspan></text><rect x="1208" y="236.5" width="204" height="80" class="node"/><text x="1310" y="271.5" class="txt" text-anchor="middle"><tspan x="1310" dy="0">50 转停工池或保持未</tspan><tspan x="1310" dy="18">分配</tspan></text><rect x="1468" y="371.5" width="204" height="80" class="node"/><text x="1570" y="406.5" class="txt" text-anchor="middle"><tspan x="1570" dy="0">60 分摊到批次并审批</tspan><tspan x="1570" dy="18">发布</tspan></text><rect x="1468" y="371.5" width="48" height="18" fill="#058fc7"/><text x="1492" y="384.5" class="tag" text-anchor="middle">SCOS</text><circle cx="2135" cy="546.5" r="24" class="node"/><text x="2135" y="551.5" class="small" text-anchor="middle">结束</text><path d="M149 141.5H168" class="flow"/><path d="M372 141.5H400V276.5H428" class="flow"/><path d="M632 276.5H660V411.5H688" class="flow"/><path d="M892 411.5H974" class="flow"/><path d="M1126 411.5H1468" class="flow"/><text x="1134" y="403.5" class="small">Y</text><path d="M1672 411.5H1891.5V546.5H2111" class="flow"/><path d="M1050 461.5V602H1310V316.5" class="flow"/><text x="1068" y="595" class="small">N</text><path d="M1570 461.5V582H530V316.5" class="flow"/><text x="548" y="575" class="small">对账不通过</text><text x="30" y="654" class="small">费用池先限定期间和实际受益范围，再采用首选或批准的备选动因；分母无效时不得强制分摊。</text></svg>
