55.5" text-anchor="middle" class="node-text"><tspan x="1500" dy="0">50 判断谱系关系是否通</tspan><tspan x="1500" dy="20">过校验</tspan></text><rect x="1688" y="425.5" width="224" height="88" class="node"/><rect x="1688" y="425.5" width="54" height="20" class="tag-scos"/><text x="1715" y="440.5" text-anchor="middle" class="tag-text">SCOS</text><text x="1800" y="465.5" text-anchor="middle" class="node-text"><tspan x="1800" dy="0">60 复核异常关系并确认</tspan><tspan x="1800" dy="20">修正依据</tspan></text><rect x="1988" y="580.5" width="224" height="88" class="node"/><rect x="1988" y="580.5" width="54" height="20" class="tag-scos"/><text x="2015" y="595.5" text-anchor="middle" class="tag-text">SCOS</text><text x="2100" y="620.5" text-anchor="middle" class="node-text"><tspan x="2100" dy="0">70 确认谱系覆盖和成本</tspan><tspan x="2100" dy="20">计算边界</tspan></text><rect x="2288" y="115.5" width="224" height="88" class="node"/><rect x="2288" y="115.5" width="54" height="20" class="tag-scos"/><text x="2315" y="130.5" text-anchor="middle" class="tag-text">SCOS</text><text x="2400" y="155.5" text-anchor="middle" class="node-text"><tspan x="2400" dy="0">80 发布当月批次谱系版</tspan><tspan x="2400" dy="20">本</tspan></text><circle cx="2770" cy="624.5" r="26" class="node"/><text x="2770" y="629.5" text-anchor="middle" class="small-text">结束</text><path d="M338 87.5H514V138.5Q470 152.5 426 138.5Q382 124.5 338 138.5Z" class="node"/><rect x="338" y="87.5" width="64" height="18" class="tag-data"/><text x="370" y="101.5" text-anchor="middle" class="tag-text">数据服务</text><text x="426" y="118.5" text-anchor="middle" class="small-text"><tspan x="426" dy="0">月末关联证据快照</tspan></text><path d="M938 87.5H1114V138.5Q1070 152.5 1026 138.5Q982 124.5 938 138.5Z" class="node"/><rect x="938" y="87.5" width="64" height="18" class="tag-scos"/><text x="970" y="101.5" text-anchor="middle" class="tag-text">SCOS</text><text x="1026" y="118.5" text-anchor="middle" class="small-text"><tspan x="1026" dy="0">候选上下游关系清单</tspan></text><path d="M1238 87.5H1414V138.5Q1370 152.5 1326 138.5Q1282 124.5 1238 138.5Z" class="node"/><rect x="1238" y="87.5" width="64" height="18" class="tag-scos"/><text x="1270" y="101.5" text-anchor="middle" class="tag-text">SCOS</text><text x="1326" y="118.5" text-anchor="middle" class="small-text"><tspan x="1326" dy="0">定量批次关系明细</tspan></text><path d="M2438 87.5H2614V138.5Q2570 152.5 2526 138.5Q2482 124.5 2438 138.5Z" class="node"/><rect x="2438" y="87.5" width="64" height="18" class="tag-scos"/><text x="2470" y="101.5" text-anchor="middle" class="tag-text">SCOS</text><text x="2526" y="118.5" text-anchor="middle" class="small-text"><tspan x="2526" dy="0">当月批次谱系版本</tspan></text><path d="M171 159.5H188" class="flow"/><path d="M412 159.5H488" class="flow"/><path d="M712 159.5H788" class="flow"/><path d="M1012 159.5H1088" class="flow"/><path d="M1312 159.5H1418" class="flow"/><path d="M1582 159.5H1970V624.5H1988" class="flow"/><text x="1592" y="150.5" class="small-text">Y</text><path d="M2212 624.5H2270V159.5H2288" class="flow"/><path d="M2512 159.5H2726V624.5H2744" class="flow"/><path d="M1500 213.5V469.5H1688" class="flow"/><text x="1510" y="235.5" class="small-text">N</text><path d="M1800 513.5V684H1200V203.5" class="flow"/><text x="1218" y="677" class="small-text">补充/修正后返回</text><text x="106" y="749" class="note-text">业务口径：每月月末在当月批次生成完成后，由SCOS依据执行数据快照、有效路由和实际计量建立当月全量上下游定量谱系。</text></svg>
