129" width="236" height="96" class="node"/><rect x="192" y="129" width="70" height="20" class="tag-data"/><text x="227" y="144" text-anchor="middle" class="tag-text">数据中台</text><text x="310" y="169" text-anchor="middle" class="node-text"><tspan x="310">10</tspan><tspan x="310" dy="20">提供当月成本事实数据</tspan></text><rect x="532" y="319" width="236" height="96" class="node"/><rect x="532" y="319" width="56" height="20" class="tag-scos"/><text x="560" y="334" text-anchor="middle" class="tag-text">SCOS</text><text x="650" y="349" text-anchor="middle" class="node-text"><tspan x="650">20</tspan><tspan x="650" dy="20">判断成本是否可直接定位</tspan><tspan x="650" dy="20">到批次</tspan></text><rect x="872" y="319" width="236" height="96" class="node"/><rect x="872" y="319" width="56" height="20" class="tag-scos"/><text x="900" y="334" text-anchor="middle" class="tag-text">SCOS</text><text x="990" y="349" text-anchor="middle" class="node-text"><tspan x="990">30</tspan><tspan x="990" dy="20">按实际业务数量计算批次</tspan><tspan x="990" dy="20">直接成本</tspan></text><rect x="1212" y="319" width="236" height="96" class="node"/><rect x="1212" y="319" width="56" height="20" class="tag-scos"/><text x="1240" y="334" text-anchor="middle" class="tag-text">SCOS</text><text x="1330" y="349" text-anchor="middle" class="node-text"><tspan x="1330">40</tspan><tspan x="1330" dy="20">检查成本来源与批次追溯</tspan><tspan x="1330" dy="20">链</tspan></text><rect x="1552" y="509" width="236" height="96" class="node"/><rect x="1552" y="509" width="56" height="20" class="tag-scos"/><text x="1580" y="524" text-anchor="middle" class="tag-text">SCOS</text><text x="1670" y="549" text-anchor="middle" class="node-text"><tspan x="1670">50</tspan><tspan x="1670" dy="20">查看成本口径和异常分类</tspan></text><rect x="1892" y="129" width="236" height="96" class="node"/><rect x="1892" y="129" width="70" height="20" class="tag-data"/><text x="1927" y="144" text-anchor="middle" class="tag-text">数据中台</text><text x="2010" y="169" text-anchor="middle" class="node-text"><tspan x="2010">60</tspan><tspan x="2010" dy="20">持久化批次直接成本结果</tspan></text><circle cx="2395" cy="177" r="27" class="node"/><text x="2395" y="182" text-anchor="middle" class="small-text">结束</text><path d="M332 95H508V138Q464 152 420 138Q376 124 332 138Z" class="node"/><text x="420" y="116" text-anchor="middle" class="small-text"><tspan x="420" dy="0">当月标准成本事实集</tspan></text><path d="M1012 285H1188V328Q1144 342 1100 328Q1056 314 1012 328Z" class="node"/><text x="1100" y="306" text-anchor="middle" class="small-text"><tspan x="1100" dy="0">批次直接成本明细</tspan></text><path d="M2032 95H2208V138Q2164 152 2120 138Q2076 124 2032 138Z" class="node"/><text x="2120" y="116" text-anchor="middle" class="small-text"><tspan x="2120" dy="0">批次直接成本参考版本</tspan></text><path d="M172 367H172V177H192" class="flow"/><path d="M428 177H512V367H532" class="flow"/><path d="M768 367H872" class="flow"/><path d="M1108 367H1212" class="flow"/><path d="M1448 367H1532V557H1552" class="flow"/><path d="M1788 557H1872V177H1892" class="flow"/><path d="M2128 177H2368" class="flow"/><text x="106" y="698" class="note-text">业务口径：SCOS按可追溯性将成本事实区分为批次直接成本和待分摊费用；财务负责人仅查看口径与异常，不承担实际结算审批。</text></svg>
