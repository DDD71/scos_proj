<svg xmlns="http://www.w3.org/2000/svg" width="2800" height="960" viewBox="0 0 1780 610"><defs><marker id="a" markerWidth="6" markerHeight="6" refX="6" refY="3" orient="auto"><path d="M0 0L6 3 0 6Z" fill="#333"/></marker><style>.tt{font-family:'SimSun','Songti SC','STSong',serif;font-size:15px;font-weight:600;fill:#1a1a1a}
