.f{fill:none;stroke:#111;stroke-width:1.27;stroke-linejoin:round;stroke-linecap:square;marker-end:url(#a)}</style></defs><rect width="1780" height="610" fill="#fff"/><rect x="20" y="15" width="1740" height="40" fill="#fff" stroke="#777" stroke-width=".75"/><text x="24" y="34" class="tt">流程编号及名称：（P-ZLTC-SCOS-JSC-005 预警事件接入与分级派发流程）</text><rect x="20" y="55" width="1740" height="535" fill="#fff" stroke="#777" stroke-width=".75"/><rect x="20" y="55" width="45" height="535" fill="#fff" stroke="#777" stroke-width=".75"/><path d="M20 218H1760M20 381H1760" stroke="#aaa"/><text x="42.5" y="85.5" class="lh"><tspan x="42.5">数</tspan><tspan x="42.5" dy="13.5">据</tspan><tspan x="42.5" dy="13.5">平</tspan><tspan x="42.5" dy="13.5">台</tspan><tspan x="42.5" dy="13.5">/</tspan><tspan x="42.5" dy="13.5">业</tspan><tspan x="42.5" dy="13.5">务</tspan><tspan x="42.5" dy="13.5">模</tspan><tspan x="42.5" dy="13.5">块</tspan></text><text x="42.5" y="289.0" class="lh"><tspan x="42.5">驾</tspan><tspan x="42.5" dy="13.5">驶</tspan><tspan x="42.5" dy="13.5">舱</tspan></text><text x="42.5" y="454.8" class="lh"><tspan x="42.5">运</tspan><tspan x="42.5" dy="13.5">营</tspan><tspan x="42.5" dy="13.5">管</tspan><tspan x="42.5" dy="13.5">理</tspan><tspan x="42.5" dy="13.5">人</tspan><tspan x="42.5" dy="13.5">员</tspan></text><circle cx="100" cy="137" r="20" class="x"/><text x="100" y="142" text-anchor="middle" class="sm">开始</text><rect x="240" y="101" width="180" height="72" class="b"/><text x="330" y="116" text-anchor="middle" class="tx"><tspan x="330">10</tspan><tspan x="330" dy="19">提供预警事件</tspan><tspan x="330" dy="19">或指标越界信息</tspan></text><rect x="470" y="264" width="180" height="72" class="s"/><text x="560" y="279" text-anchor="middle" class="tx"><tspan x="560">20</tspan><tspan x="560" dy="19">校验事件信息</tspan><tspan x="560" dy="19">并聚合去重</tspan></text><rect x="700" y="264" width="180" height="72" class="s"/><text x="790" y="279" text-anchor="middle" class="tx"><tspan x="790">30</tspan><tspan x="790" dy="19">识别