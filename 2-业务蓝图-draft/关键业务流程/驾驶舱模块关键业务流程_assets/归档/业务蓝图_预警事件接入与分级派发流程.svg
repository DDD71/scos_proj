text x="1240" y="295" text-anchor="middle" class="tx"><tspan x="1240">50 是否需要</tspan><tspan x="1240" dy="19">发起处置？</tspan></text><rect x="1360" y="427" width="180" height="72" class="s"/><text x="1450" y="451" text-anchor="middle" class="tx"><tspan x="1450">60 确认责任人</tspan><tspan x="1450" dy="19">并派发处置任务</tspan></text><rect x="1580" y="264" width="150" height="72" class="s"/><text x="1655" y="288" text-anchor="middle" class="tx"><tspan x="1655">70 记录派发结果</tspan><tspan x="1655" dy="19">进入跟踪队列</tspan></text><path d="M220 137H240M420 137H445V300H470M650 300H700M880 300H930M1110 300H1170M1310 300H1335V463H1360M1540 463H1560V300H1580" class="f"/><circle cx="1730" cy="390" r="20" class="x"/><text x="1730" y="395" text-anchor="middle" class="sm">结束</text><path d="M1655 336V360H1730V370" class="f"/><path d="M1240 344V390H1020V336" class="f"/><text x="1050" y="385" class="sm">N：持续监控并记录原因</text><text x="24" y="578" class="sm">一级预警优先推送；二级预警按时间排序；信息不完整或责任人无法匹配时进入待核实/待分派队列。</text><g font-family="Microsoft YaHei" font-size="11" font-weight="bold" fill="#fff"><rect x="240" y="101" width="54" height="18" fill="#c94747"/><text x="267" y="114" text-anchor="middle">业务系统</text><rect x="470" y="264" width="54" height="18" fill="#4f7d5b"/><text x="497" y="277" text-anchor="middle">驾驶舱</text><rect x="700" y="264" width="54" height="18" fill="#4f7d5b"/><text x="727" y="277" text-anchor="middle">驾驶舱</text><rect x="930" y="264" width="54" height="18" fill="#4f7d5b"/><text x="957" y="277" text-anchor="middle">驾驶舱</text><rect x="1150" y="264" width="54" height="18" fill="#4f7d5b"/><text x="1177" y="277" text-anchor="middle">驾驶舱</text><rect x="1360" y="427" width="54" height="18" fill="#4f7d5b"/><text x="1387" y="440" text-anchor="middle">驾驶舱</text><rect x="1580" y="264" width="54" height="18" fill="#4f7d5b"/><text x="1607" y="277" text-anchor="middle">驾驶舱</text></g></svg>
