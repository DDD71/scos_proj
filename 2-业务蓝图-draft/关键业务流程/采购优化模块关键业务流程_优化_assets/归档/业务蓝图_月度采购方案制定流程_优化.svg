<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="2800" height="860" viewBox="0 0 2800 860">
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L9,4.5 L0,9 Z" fill="#111111"/></marker>
    <style>
      .title{font-family:"SimSun","Songti SC","STSong",serif;font-size:23px;font-weight:600;fill:#1a1a1a}
      .lane-text{font-family:"SimSun","Songti SC","STSong",serif;font-size:18px;fill:#222;text-anchor:middle}
      .node-text{font-family:"SimSun","Songti SC","STSong",serif;font-size:16px;fill:#222;text-anchor:middle}
      .small-text{font-family:"SimSun","Songti SC","STSong",serif;font-size:15px;fill:#222}
      .note-text{font-family:"SimSun","Songti SC","STSong",serif;font-size:14px;fill:#444}
      .tag-text{font-family:Arial,"Microsoft YaHei",sans-serif;font-size:14px;fill:#fff;text-anchor:middle}
      .frame{fill:#fff;stroke:#777;stroke-width:1.15}.divider{fill:none;stroke:#888;stroke-width:1}
      .node{fill:#fff;stroke:#8b8b8b;stroke-width:1.35}
      .flow{fill:none;stroke:#111;stroke-width:2;stroke-linejoin:round;stroke-linecap:square;marker-end:url(#arrow)}
      .flow-stem{fill:none;stroke:#111;stroke-width:2;stroke-linejoin:round;stroke-linecap:square}
      .artifact-link{fill:none;stroke:#777;stroke-width:1.1;stroke-dasharray:4 4}
      .tag-scos{fill:#0088c7}.tag-external{fill:#00a651}
    </style>
  </defs>

  <rect width="2800" height="860" fill="#ffffff"/>
  <rect x="40" y="26" width="2720" height="809" class="frame"/>
  <line x1="40" y1="102" x2="2760" y2="102" class="divider"/>
  <text x="51" y="70" class="title">流程编号及名称：（P-ZLTC-SCOS-CGYH-001 月度采购方案制定流程）</text>

  <!-- 泳道 -->
  <line x1="85" y1="102" x2="85" y2="835" class="divider"/>
  <line x1="40" y1="290" x2="2760" y2="290" class="divider"/>
  <line x1="40" y1="500" x2="2760" y2="500" class="divider"/>
  <line x1="40" y1="670" x2="2760" y2="670" class="divider"/>
  <text x="62.5" y="151" class="lane-text"><tspan x="62.5">采</tspan><tspan x="62.5" dy="24">购</tspan><tspan x="62.5" dy="24">计</tspan><tspan x="62.5" dy="24">划</tspan><tspan x="62.5" dy="24">员</tspan></text>
  <text x="62.5" y="325" class="lane-text"><tspan x="62.5">S</tspan><tspan x="62.5" dy="27">C</tspan><tspan x="62.5" dy="27">O</tspan><tspan x="62.5" dy="27">S</tspan></text>
  <text x="62.5" y="521" class="lane-text"><tspan x="62.5">采</tspan><tspan x="62.5" dy="25">购</tspan><tspan x="62.5" dy="25">负</tspan><tspan x="62.5" dy="25">责</tspan><tspan x="62.5" dy="25">人</tspan></text>
  <text x="62.5" y="690" class="lane-text"><tspan x="62.5">E</tspan><tspan x="62.5" dy="23">采</tspan><tspan x="62.5" dy="23">／</tspan><tspan x="62.5" dy="23">S</tspan><tspan x="62.5" dy="23">A</tspan><tspan x="62.5" dy="23">P</tspan></text>

  <!-- 开始 -->
  <circle cx="145" cy="170" r="32" class="node"/><text x="145" y="176" class="node-text">开始</text>

  <!-- 10 形成待采购需求 -->
  <rect x="280" y="335" width="270" height="90" class="node"/><rect x="270" y="324" width="58" height="22" class="tag-scos"/><text x="299" y="340" class="tag-text">SCOS</text>
  <text x="415" y="360" class="node-text"><tspan x="415">10</tspan><tspan x="415" dy="21">形成待采购需求</tspan><tspan x="415" dy="21">明确采购量和到货日期</tspan></text>

  <!-- 20 生成采购建议 -->
  <rect x="650" y="325" width="300" height="110" class="node"/><rect x="640" y="314" width="58" height="22" class="tag-scos"/><text x="669" y="330" class="tag-text">SCOS</text>
  <text x="800" y="349" class="node-text"><tspan x="800">20</tspan><tspan x="800" dy="20">生成月度采购建议</tspan><tspan x="800" dy="20">供应商、数量、成本</tspan><tspan x="800" dy="20">及合同／锁价建议</tspan></text>

  <!-- 30 评审方案 -->
  <rect x="1040" y="120" width="300" height="100" class="node"/><rect x="1030" y="109" width="58" height="22" class="tag-scos"/><text x="1059" y="125" class="tag-text">SCOS</text>
  <text x="1190" y="143" class="node-text"><tspan x="1190">30</tspan><tspan x="1190" dy="20">评审并调整方案</tspan><tspan x="1190" dy="20">填写最终采购数量</tspan><tspan x="1190" dy="20">确认锁价策略</tspan></text>

  <!-- 40 方案确认 -->
  <polygon points="1470,110 1565,170 1470,230 1375,170" class="node"/><rect x="1370" y="109" width="58" height="22" class="tag-scos"/><text x="1399" y="125" class="tag-text">SCOS</text>
  <text x="1470" y="163" class="node-text"><tspan x="1470">40</tspan><tspan x="1470" dy="21">方案是否确认？</tspan></text>

  <!-- 50 审批 -->
  <polygon points="1740,520 1835,580 1740,640 1645,580" class="node"/><rect x="1640" y="519" width="58" height="22" class="tag-scos"/><text x="1669" y="535" class="tag-text">SCOS</text>
  <text x="1740" y="573" class="node-text"><tspan x="1740">50</tspan><tspan x="1740" dy="21">审批是否通过？</tspan></text>

  <!-- 60 发布月度采购方案 -->
  <rect x="1950" y="335" width="270" height="90" class="node"/><rect x="1940" y="324" width="58" height="22" class="tag-scos"/><text x="1969" y="340" class="tag-text">SCOS</text>
  <text x="2085" y="360" class="node-text"><tspan x="2085">60</tspan><tspan x="2085" dy="21">发布已确认</tspan><tspan x="2085" dy="21">月度采购方案</tspan></text>

  <!-- 70 进入采购执行 -->
  <rect x="2250" y="700" width="230" height="90" class="node"/><rect x="2240" y="689" width="82" height="22" class="tag-external"/><text x="2281" y="705" class="tag-text">E采/SAP</text>
  <text x="2365" y="725" class="node-text"><tspan x="2365">70</tspan><tspan x="2365" dy="21">进入采购执行</tspan><tspan x="2365" dy="21">与执行协同</tspan></text>
  <circle cx="2600" cy="745" r="32" class="node"/><text x="2600" y="751" class="node-text">结束</text>

  <!-- 输出物：取消连接线，少量覆盖在父节点右下角 -->
  <path d="M420,415 H610 V465 C563,452 516,476 468,465 C452,461 436,461 420,465 Z" class="node"/><text x="515" y="444" class="small-text" text-anchor="middle">待采购需求</text>
  <path d="M2070,415 H2280 V465 C2228,452 2176,476 2123,465 C2105,461 2088,461 2070,465 Z" class="node"/><text x="2175" y="444" class="small-text" text-anchor="middle">月度采购方案</text>

  <!-- 主流程 -->
  <path d="M177,170 H230 V380 H280" class="flow"/>
  <path d="M550,380 H650" class="flow"/>
  <path d="M950,380 H990 V170 H1040" class="flow"/>
  <path d="M1340,170 H1375" class="flow"/>
  <path d="M1565,170 H1605 V580 H1645" class="flow"/><text x="1578" y="158" class="small-text">Y</text>
  <path d="M1835,580 H1890 V380 H1950" class="flow"/><text x="1848" y="568" class="small-text">Y</text>
  <path d="M2220,380 H2365 V700" class="flow"/>
  <path d="M2480,745 H2568" class="flow"/>

  <!-- 40与50分别返回，仅进入30的最后一段连线和箭头重合 -->
  <path d="M1470,230 V260 H1190" class="flow-stem"/><text x="1280" y="254" class="small-text">N：返回30调整</text>
  <path d="M1740,640 V660 H1190 V260" class="flow-stem"/><text x="1510" y="654" class="small-text">N：退回30修改</text>
  <path d="M1190,260 V220" class="flow"/>

  <text x="110" y="817" class="note-text">“形成待采购需求”是采购范围确认的关键业务结果；其内部数据获取和扣减计算不再拆分为独立节点。</text>
</svg>
