<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="2660" height="860" viewBox="0 0 2660 860">
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L9,4.5 L0,9 Z" fill="#111111"/></marker>
    <style>
      .title{font-family:"SimSun","Songti SC","STSong",serif;font-size:23px;font-weight:600;fill:#1a1a1a}
      .lane-text{font-family:"SimSun","Songti SC","STSong",serif;font-size:18px;fill:#222;text-anchor:middle}
      .node-text{font-family:"SimSun","Songti SC","STSong",serif;font-size:16px;fill:#222;text-anchor:middle}
      .small-text{font-family:"SimSun","Songti SC","STSong",serif;font-size:15px;fill:#222}
      .note-text{font-family:"SimSun","Songti SC","STSong",serif;font-size:14px;fill:#444}
      .tag-text{font-family:Arial,"Microsoft YaHei",sans-serif;font-size:14px;fill:#fff;text-anchor:middle}
      .frame{fill:#fff;stroke:#777;stroke-width:1.15}.divider{fill:none;stroke:#888;stroke-width:1}
      .node{fill:#fff;stroke:#8b8b8b;stroke-width:1.35}
      .flow{fill:none;stroke:#111;stroke-width:2;stroke-linejoin:round;stroke-linecap:square;marker-end:url(#arrow)}
      .artifact-link{fill:none;stroke:#777;stroke-width:1.1;stroke-dasharray:4 4}
      .tag-scos{fill:#0088c7}.tag-upstream{fill:#c94747}
    </style>
  </defs>

  <rect width="2660" height="860" fill="#ffffff"/>
  <rect x="40" y="26" width="2580" height="809" class="frame"/>
  <line x1="40" y1="102" x2="2620" y2="102" class="divider"/>
  <text x="51" y="70" class="title">流程编号及名称：（P-ZLTC-SCOS-KCYH-004 库存策略异常调整流程）</text>

  <!-- 泳道 -->
  <line x1="85" y1="102" x2="85" y2="835" class="divider"/>
  <line x1="40" y1="255" x2="2620" y2="255" class="divider"/>
  <line x1="40" y1="480" x2="2620" y2="480" class="divider"/>
  <line x1="40" y1="650" x2="2620" y2="650" class="divider"/>
  <text x="62.5" y="114" class="lane-text"><tspan x="62.5">上</tspan><tspan x="62.5" dy="22">游</tspan><tspan x="62.5" dy="22">业</tspan><tspan x="62.5" dy="22">务</tspan><tspan x="62.5" dy="22">／</tspan><tspan x="62.5" dy="22">数</tspan><tspan x="62.5" dy="22">据</tspan></text>
  <text x="62.5" y="312" class="lane-text"><tspan x="62.5">S</tspan><tspan x="62.5" dy="27">C</tspan><tspan x="62.5" dy="27">O</tspan><tspan x="62.5" dy="27">S</tspan></text>
  <text x="62.5" y="500" class="lane-text"><tspan x="62.5">库</tspan><tspan x="62.5" dy="25">存</tspan><tspan x="62.5" dy="25">计</tspan><tspan x="62.5" dy="25">划</tspan><tspan x="62.5" dy="25">员</tspan></text>
  <text x="62.5" y="671" class="lane-text"><tspan x="62.5">库</tspan><tspan x="62.5" dy="25">存</tspan><tspan x="62.5" dy="25">负</tspan><tspan x="62.5" dy="25">责</tspan><tspan x="62.5" dy="25">人</tspan></text>

  <!-- 开始与重大变化信息 -->
  <circle cx="145" cy="170" r="32" class="node"/><text x="145" y="176" class="node-text">开始</text>
  <rect x="235" y="120" width="290" height="100" class="node"/><rect x="225" y="109" width="82" height="22" class="tag-upstream"/><text x="266" y="125" class="tag-text">上游系统</text>
  <text x="380" y="143" class="node-text"><tspan x="380">10</tspan><tspan x="380" dy="20">提供重大变化信息</tspan><tspan x="380" dy="20">需求、产能、储罐容量</tspan><tspan x="380" dy="20">或生产补充周期</tspan></text>

  <!-- 识别影响 -->
  <rect x="610" y="330" width="250" height="90" class="node"/><rect x="600" y="319" width="58" height="22" class="tag-scos"/><text x="629" y="335" class="tag-text">SCOS</text>
  <text x="735" y="356" class="node-text"><tspan x="735">20</tspan><tspan x="735" dy="21">识别策略影响</tspan><tspan x="735" dy="21">形成异常调整提示</tspan></text>

  <!-- 是否重新计算 -->
  <polygon points="985,505 1080,565 985,625 890,565" class="node"/><rect x="885" y="504" width="58" height="22" class="tag-scos"/><text x="914" y="520" class="tag-text">SCOS</text>
  <text x="985" y="558" class="node-text"><tspan x="985">30</tspan><tspan x="985" dy="21">是否需要重新计算？</tspan></text>

  <!-- 生成调整后策略 -->
  <rect x="1150" y="325" width="290" height="100" class="node"/><rect x="1140" y="314" width="58" height="22" class="tag-scos"/><text x="1169" y="330" class="tag-text">SCOS</text>
  <text x="1295" y="349" class="node-text"><tspan x="1295">40</tspan><tspan x="1295" dy="20">生成调整后策略</tspan><tspan x="1295" dy="20">与调整前后差异</tspan><tspan x="1295" dy="20">校验服务与容量风险</tspan></text>

  <!-- 评审 -->
  <rect x="1510" y="520" width="270" height="90" class="node"/><rect x="1500" y="509" width="58" height="22" class="tag-scos"/><text x="1529" y="525" class="tag-text">SCOS</text>
  <text x="1645" y="546" class="node-text"><tspan x="1645">50</tspan><tspan x="1645" dy="21">评审库存策略</tspan><tspan x="1645" dy="21">异常调整方案</tspan></text>

  <!-- 审批 -->
  <polygon points="1900,680 1995,740 1900,800 1805,740" class="node"/><rect x="1800" y="679" width="58" height="22" class="tag-scos"/><text x="1829" y="695" class="tag-text">SCOS</text>
  <text x="1900" y="733" class="node-text"><tspan x="1900">60</tspan><tspan x="1900" dy="21">调整是否审批通过？</tspan></text>

  <!-- 发布与结束 -->
  <rect x="2110" y="330" width="250" height="90" class="node"/><rect x="2100" y="319" width="58" height="22" class="tag-scos"/><text x="2129" y="335" class="tag-text">SCOS</text>
  <text x="2235" y="356" class="node-text"><tspan x="2235">70</tspan><tspan x="2235" dy="21">发布库存策略</tspan><tspan x="2235" dy="21">新版本及调整记录</tspan></text>
  <circle cx="2500" cy="375" r="32" class="node"/><text x="2500" y="381" class="node-text">结束</text>

  <!-- 输出物 -->
  <path d="M1210,435 H1380 V475 C1338,463 1296,484 1253,475 C1239,471 1224,471 1210,475 Z" class="node"/><text x="1295" y="459" class="small-text" text-anchor="middle">策略调整方案</text><line x1="1295" y1="425" x2="1295" y2="435" class="artifact-link"/>
  <path d="M2150,435 H2320 V475 C2278,463 2236,484 2193,475 C2179,471 2164,471 2150,475 Z" class="node"/><text x="2235" y="459" class="small-text" text-anchor="middle">库存策略新版本</text><line x1="2235" y1="420" x2="2235" y2="435" class="artifact-link"/>

  <!-- 主流程 -->
  <path d="M177,170 H235" class="flow"/>
  <path d="M525,170 H565 V375 H610" class="flow"/>
  <path d="M860,375 H985 V505" class="flow"/>
  <path d="M1080,565 H1115 V375 H1150" class="flow"/><text x="1093" y="553" class="small-text">Y</text>
  <path d="M1440,375 H1475 V565 H1510" class="flow"/>
  <path d="M1780,565 H1900 V680" class="flow"/>
  <path d="M1995,740 H2040 V375 H2110" class="flow"/><text x="2008" y="728" class="small-text">Y</text>
  <path d="M2360,375 H2468" class="flow"/>

  <!-- 不重算：沿最底层及右侧外缘汇入唯一结束节点 -->
  <path d="M985,625 V825 H2580 V375 H2532" class="flow"/><text x="1010" y="819" class="small-text">N：保留当前策略并持续监控</text>

  <!-- 审批退回：库存负责人泳道底部独立回路 -->
  <path d="M1900,800 V810 H1645 V610" class="flow"/><text x="1705" y="804" class="small-text">N：退回50补充</text>

  <text x="110" y="817" class="note-text">只有重大变化才进入月中策略调整；新策略必须经业务确认和审批后生效，原版本完整保留。</text>
</svg>
