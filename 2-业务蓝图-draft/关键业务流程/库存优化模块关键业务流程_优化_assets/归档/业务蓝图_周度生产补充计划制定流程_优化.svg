<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="3000" height="860" viewBox="0 0 3000 860">
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L9,4.5 L0,9 Z" fill="#111111"/></marker>
    <style>
      .title{font-family:"SimSun","Songti SC","STSong",serif;font-size:23px;font-weight:600;fill:#1a1a1a}
      .lane-text{font-family:"SimSun","Songti SC","STSong",serif;font-size:18px;fill:#222;text-anchor:middle}
      .node-text{font-family:"SimSun","Songti SC","STSong",serif;font-size:16px;fill:#222;text-anchor:middle}
      .small-text{font-family:"SimSun","Songti SC","STSong",serif;font-size:15px;fill:#222}
      .note-text{font-family:"SimSun","Songti SC","STSong",serif;font-size:14px;fill:#444}
      .tag-text{font-family:Arial,"Microsoft YaHei",sans-serif;font-size:14px;fill:#fff;text-anchor:middle}
      .frame{fill:#fff;stroke:#777;stroke-width:1.15}.divider{fill:none;stroke:#888;stroke-width:1}
      .node{fill:#fff;stroke:#8b8b8b;stroke-width:1.35}
      .flow{fill:none;stroke:#111;stroke-width:2;stroke-linejoin:round;stroke-linecap:square;marker-end:url(#arrow)}
      .artifact-link{fill:none;stroke:#777;stroke-width:1.1;stroke-dasharray:4 4}
      .tag-scos{fill:#0088c7}.tag-data{fill:#c94747}
    </style>
  </defs>

  <rect width="3000" height="860" fill="#ffffff"/>
  <rect x="40" y="26" width="2920" height="809" class="frame"/>
  <line x1="40" y1="102" x2="2960" y2="102" class="divider"/>
  <text x="51" y="70" class="title">流程编号及名称：（P-ZLTC-SCOS-KCYH-002 周度生产补充计划制定流程）</text>

  <!-- 泳道 -->
  <line x1="85" y1="102" x2="85" y2="835" class="divider"/>
  <line x1="40" y1="255" x2="2960" y2="255" class="divider"/>
  <line x1="40" y1="465" x2="2960" y2="465" class="divider"/>
  <line x1="40" y1="640" x2="2960" y2="640" class="divider"/>
  <text x="62.5" y="112" class="lane-text"><tspan x="62.5">统</tspan><tspan x="62.5" dy="22">一</tspan><tspan x="62.5" dy="22">数</tspan><tspan x="62.5" dy="22">据</tspan><tspan x="62.5" dy="22">服</tspan><tspan x="62.5" dy="22">务</tspan><tspan x="62.5" dy="22">层</tspan></text>
  <text x="62.5" y="303" class="lane-text"><tspan x="62.5">S</tspan><tspan x="62.5" dy="27">C</tspan><tspan x="62.5" dy="27">O</tspan><tspan x="62.5" dy="27">S</tspan></text>
  <text x="62.5" y="489" class="lane-text"><tspan x="62.5">库</tspan><tspan x="62.5" dy="25">存</tspan><tspan x="62.5" dy="25">计</tspan><tspan x="62.5" dy="25">划</tspan><tspan x="62.5" dy="25">员</tspan></text>
  <text x="62.5" y="665" class="lane-text"><tspan x="62.5">生</tspan><tspan x="62.5" dy="25">产</tspan><tspan x="62.5" dy="25">计</tspan><tspan x="62.5" dy="25">划</tspan><tspan x="62.5" dy="25">员</tspan></text>

  <!-- 00 开始 -->
  <circle cx="145" cy="170" r="32" class="node"/><text x="145" y="176" class="node-text">开始</text>

  <!-- 10 数据准备 -->
  <rect x="235" y="120" width="260" height="100" class="node"/>
  <rect x="225" y="109" width="82" height="22" class="tag-data"/><text x="266" y="125" class="tag-text">数据服务</text>
  <text x="365" y="143" class="node-text"><tspan x="365">10</tspan><tspan x="365" dy="20">汇集周计划输入数据</tspan><tspan x="365" dy="20">未来4周日度需求、库存</tspan><tspan x="365" dy="20">月度剩余量与生产排程</tspan></text>

  <!-- 20 日度补充量 -->
  <rect x="565" y="292" width="280" height="110" class="node"/>
  <rect x="555" y="281" width="58" height="22" class="tag-scos"/><text x="584" y="297" class="tag-text">SCOS</text>
  <text x="705" y="316" class="node-text"><tspan x="705">20</tspan><tspan x="705" dy="20">每周五一次性生成</tspan><tspan x="705" dy="20">未来4周日度生产补充量</tspan><tspan x="705" dy="20">每周按周六至下周五划分</tspan></text>

  <!-- 30 周度汇总 -->
  <rect x="925" y="292" width="290" height="110" class="node"/>
  <rect x="915" y="281" width="58" height="22" class="tag-scos"/><text x="944" y="297" class="tag-text">SCOS</text>
  <text x="1070" y="316" class="node-text"><tspan x="1070">30</tspan><tspan x="1070" dy="20">按周加和日度生产补充量</tspan><tspan x="1070" dy="20">形成未来4周</tspan><tspan x="1070" dy="20">周度生产补充建议</tspan></text>

  <!-- 40 评审 -->
  <rect x="1295" y="500" width="260" height="100" class="node"/>
  <rect x="1285" y="489" width="58" height="22" class="tag-scos"/><text x="1314" y="505" class="tag-text">SCOS</text>
  <text x="1425" y="526" class="node-text"><tspan x="1425">40</tspan><tspan x="1425" dy="21">评审未来4周</tspan><tspan x="1425" dy="21">周度生产补充建议</tspan></text>

  <!-- 50 建议确认 -->
  <polygon points="1695,495 1790,550 1695,605 1600,550" class="node"/>
  <rect x="1595" y="494" width="58" height="22" class="tag-scos"/><text x="1624" y="510" class="tag-text">SCOS</text>
  <text x="1695" y="543" class="node-text"><tspan x="1695">50</tspan><tspan x="1695" dy="21">补充建议是否确认？</tspan></text>

  <!-- 60 排程承接 -->
  <rect x="1870" y="688" width="250" height="95" class="node"/>
  <text x="1995" y="716" class="node-text"><tspan x="1995">60</tspan><tspan x="1995" dy="21">确认生产排程</tspan><tspan x="1995" dy="21">承接安排</tspan></text>

  <!-- 70 是否纳入排程 -->
  <polygon points="2260,680 2355,735 2260,790 2165,735" class="node"/>
  <rect x="2160" y="679" width="58" height="22" class="tag-scos"/><text x="2189" y="695" class="tag-text">SCOS</text>
  <text x="2260" y="728" class="node-text"><tspan x="2260">70</tspan><tspan x="2260" dy="21">确认纳入生产排程？</tspan></text>

  <!-- 80 锁定第一周 -->
  <rect x="2410" y="292" width="240" height="110" class="node"/>
  <rect x="2400" y="281" width="58" height="22" class="tag-scos"/><text x="2429" y="297" class="tag-text">SCOS</text>
  <text x="2530" y="316" class="node-text"><tspan x="2530">80</tspan><tspan x="2530" dy="20">锁定第1周</tspan><tspan x="2530" dy="20">生产补充量</tspan><tspan x="2530" dy="20">锁定后不可修改</tspan></text>

  <!-- 90 发布 -->
  <rect x="2710" y="302" width="180" height="90" class="node"/>
  <rect x="2700" y="291" width="58" height="22" class="tag-scos"/><text x="2729" y="307" class="tag-text">SCOS</text>
  <text x="2800" y="328" class="node-text"><tspan x="2800">90</tspan><tspan x="2800" dy="21">发布周度生产</tspan><tspan x="2800" dy="21">补货计划</tspan></text>
  <circle cx="2930" cy="347" r="30" class="node"/><text x="2930" y="353" class="node-text">结束</text>

  <!-- 过程输出物 -->
  <path d="M630,412 H780 V452 C743,440 706,461 668,452 C655,448 643,448 630,452 Z" class="node"/><text x="705" y="435" class="small-text" text-anchor="middle">未来4周日度生产补充量</text><line x1="705" y1="402" x2="705" y2="412" class="artifact-link"/>
  <path d="M995,412 H1145 V452 C1108,440 1071,461 1033,452 C1020,448 1008,448 995,452 Z" class="node"/><text x="1070" y="435" class="small-text" text-anchor="middle">4周周度生产补充建议</text><line x1="1070" y1="402" x2="1070" y2="412" class="artifact-link"/>
  <path d="M2435,412 H2625 V452 C2578,440 2531,461 2483,452 C2467,448 2451,448 2435,452 Z" class="node"/><text x="2530" y="435" class="small-text" text-anchor="middle">第1周锁定生产补充量</text><line x1="2530" y1="402" x2="2530" y2="412" class="artifact-link"/>

  <!-- 主流程：持续向右推进，跨泳道仅作短距离折转 -->
  <path d="M177,170 H235" class="flow"/>
  <path d="M495,170 H525 V347 H565" class="flow"/>
  <path d="M845,347 H925" class="flow"/>
  <path d="M1215,347 H1255 V550 H1295" class="flow"/>
  <path d="M1555,550 H1600" class="flow"/>
  <path d="M1790,550 H1830 V735 H1870" class="flow"/><text x="1803" y="538" class="small-text">Y</text>
  <path d="M2120,735 H2165" class="flow"/>
  <path d="M2355,735 H2380 V347 H2410" class="flow"/><text x="2368" y="723" class="small-text">Y</text>
  <path d="M2650,347 H2710" class="flow"/>
  <path d="M2890,347 H2900" class="flow"/>

  <!-- 评审退回：位于库存计划员泳道底部 -->
  <path d="M1695,605 V625 H1425 V600" class="flow"/><text x="1525" y="620" class="small-text">N：返回40调整</text>
  <!-- 排程退回：位于生产计划员泳道底部 -->
  <path d="M2260,790 V815 H1995 V783" class="flow"/><text x="2075" y="809" class="small-text">N：返回60协调</text>

  <text x="110" y="817" class="note-text">业务口径：一周为周六至下周五；每周五一次性生成未来4周日度生产补充量并按周汇总；确认纳入生产排程后，锁定第1周生产补充量（不可修改）并发布周度生产补货计划。</text>
</svg>
