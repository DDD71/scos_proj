<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="3000" height="860" viewBox="0 0 3000 860">
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L9,4.5 L0,9 Z" fill="#111111"/></marker>
    <style>
      .title{font-family:"SimSun","Songti SC","STSong",serif;font-size:23px;font-weight:600;fill:#1a1a1a}
      .lane-text{font-family:"SimSun","Songti SC","STSong",serif;font-size:18px;fill:#222;text-anchor:middle}
      .node-text{font-family:"SimSun","Songti SC","STSong",serif;font-size:16px;fill:#222;text-anchor:middle}
      .small-text{font-family:"SimSun","Songti SC","STSong",serif;font-size:15px;fill:#222}
      .note-text{font-family:"SimSun","Songti SC","STSong",serif;font-size:14px;fill:#444}
      .tag-text{font-family:Arial,"Microsoft YaHei",sans-serif;font-size:14px;fill:#fff;text-anchor:middle}
      .frame{fill:#fff;stroke:#777;stroke-width:1.15}.divider{fill:none;stroke:#888;stroke-width:1}
      .node{fill:#fff;stroke:#8b8b8b;stroke-width:1.35}
      .flow{fill:none;stroke:#111;stroke-width:2;stroke-linejoin:round;stroke-linecap:square;marker-end:url(#arrow)}
      .artifact-link{fill:none;stroke:#777;stroke-width:1.1;stroke-dasharray:4 4}
      .tag-scos{fill:#0088c7}.tag-data{fill:#c94747}
    </style>
  </defs>

  <rect width="3000" height="860" fill="#ffffff"/>
  <rect x="40" y="26" width="2920" height="809" class="frame"/>
  <line x1="40" y1="102" x2="2960" y2="102" class="divider"/>
  <text x="51" y="70" class="title">流程编号及名称：（P-ZLTC-SCOS-KCYH-003 日度库存水位监控与滚动校验流程）</text>

  <!-- 泳道 -->
  <line x1="85" y1="102" x2="85" y2="835" class="divider"/>
  <line x1="40" y1="255" x2="2960" y2="255" class="divider"/>
  <line x1="40" y1="520" x2="2960" y2="520" class="divider"/>
  <line x1="40" y1="670" x2="2960" y2="670" class="divider"/>
  <text x="62.5" y="112" class="lane-text"><tspan x="62.5">统</tspan><tspan x="62.5" dy="22">一</tspan><tspan x="62.5" dy="22">数</tspan><tspan x="62.5" dy="22">据</tspan><tspan x="62.5" dy="22">服</tspan><tspan x="62.5" dy="22">务</tspan><tspan x="62.5" dy="22">层</tspan></text>
  <text x="62.5" y="325" class="lane-text"><tspan x="62.5">S</tspan><tspan x="62.5" dy="27">C</tspan><tspan x="62.5" dy="27">O</tspan><tspan x="62.5" dy="27">S</tspan></text>
  <text x="62.5" y="533" class="lane-text"><tspan x="62.5">库</tspan><tspan x="62.5" dy="25">存</tspan><tspan x="62.5" dy="25">计</tspan><tspan x="62.5" dy="25">划</tspan><tspan x="62.5" dy="25">员</tspan></text>
  <text x="62.5" y="689" class="lane-text"><tspan x="62.5">生</tspan><tspan x="62.5" dy="25">产</tspan><tspan x="62.5" dy="25">计</tspan><tspan x="62.5" dy="25">划</tspan><tspan x="62.5" dy="25">员</tspan></text>

  <!-- 开始与数据准备 -->
  <circle cx="145" cy="170" r="32" class="node"/><text x="145" y="176" class="node-text">开始</text>
  <rect x="235" y="120" width="280" height="100" class="node"/><rect x="225" y="109" width="82" height="22" class="tag-data"/><text x="266" y="125" class="tag-text">数据服务</text>
  <text x="375" y="143" class="node-text"><tspan x="375">10</tspan><tspan x="375" dy="20">汇集日度库存、需求</tspan><tspan x="375" dy="20">4周补充建议与排程状态</tspan><tspan x="375" dy="20">形成日度监控数据集</tspan></text>

  <!-- 20 未来4周日度库存水位 -->
  <rect x="585" y="330" width="290" height="110" class="node"/><rect x="575" y="319" width="58" height="22" class="tag-scos"/><text x="604" y="335" class="tag-text">SCOS</text>
  <text x="730" y="354" class="node-text"><tspan x="730">20</tspan><tspan x="730" dy="20">滚动测算未来4周</tspan><tspan x="730" dy="20">日度库存水位</tspan><tspan x="730" dy="20">识别缺口、时间及容量风险</tspan></text>

  <!-- 30 库存风险判断 -->
  <polygon points="985,325 1080,385 985,445 890,385" class="node"/><rect x="885" y="324" width="58" height="22" class="tag-scos"/><text x="914" y="340" class="tag-text">SCOS</text>
  <text x="985" y="378" class="node-text"><tspan x="985">30</tspan><tspan x="985" dy="21">是否存在库存风险？</tspan></text>

  <!-- 40 锁定期判断 -->
  <polygon points="1240,325 1335,385 1240,445 1145,385" class="node"/><rect x="1140" y="324" width="58" height="22" class="tag-scos"/><text x="1169" y="340" class="tag-text">SCOS</text>
  <text x="1240" y="378" class="node-text"><tspan x="1240">40</tspan><tspan x="1240" dy="21">风险是否位于锁定期？</tspan></text>

  <!-- 锁定期：只预警，不调整 -->
  <rect x="1410" y="270" width="300" height="90" class="node"/><rect x="1400" y="259" width="58" height="22" class="tag-scos"/><text x="1429" y="275" class="tag-text">SCOS</text>
  <text x="1560" y="295" class="node-text"><tspan x="1560">50</tspan><tspan x="1560" dy="21">生成锁定期库存预警</tspan><tspan x="1560" dy="21">不调整生产补充建议</tspan></text>
  <rect x="1790" y="270" width="280" height="90" class="node"/><rect x="1780" y="259" width="58" height="22" class="tag-scos"/><text x="1809" y="275" class="tag-text">SCOS</text>
  <text x="1930" y="295" class="node-text"><tspan x="1930">60</tspan><tspan x="1930" dy="21">记录库存预警</tspan><tspan x="1930" dy="21">保持第1周锁定量不变</tspan></text>
  <!-- 锁定期外：预警并调整第2至第4周 -->
  <rect x="1410" y="420" width="320" height="90" class="node"/><rect x="1400" y="409" width="58" height="22" class="tag-scos"/><text x="1429" y="425" class="tag-text">SCOS</text>
  <text x="1570" y="445" class="node-text"><tspan x="1570">70</tspan><tspan x="1570" dy="21">生成库存预警并调整</tspan><tspan x="1570" dy="21">第2至第4周生产补货建议</tspan></text>
  <rect x="1810" y="550" width="280" height="90" class="node"/><rect x="1800" y="539" width="58" height="22" class="tag-scos"/><text x="1829" y="555" class="tag-text">SCOS</text>
  <text x="1950" y="575" class="node-text"><tspan x="1950">80</tspan><tspan x="1950" dy="21">复核并提交</tspan><tspan x="1950" dy="21">生产补货调整建议</tspan></text>

  <!-- 生产端协同判断 -->
  <polygon points="2260,690 2355,750 2260,810 2165,750" class="node"/>
  <text x="2260" y="743" class="node-text"><tspan x="2260">90</tspan><tspan x="2260" dy="21">是否调整生产计划？</tspan></text>
  <rect x="2430" y="705" width="280" height="90" class="node"/>
  <text x="2570" y="730" class="node-text"><tspan x="2570">100</tspan><tspan x="2570" dy="21">反馈补货调整建议</tspan><tspan x="2570" dy="21">并进入生产排程</tspan></text>
  <circle cx="2830" cy="750" r="32" class="node"/><text x="2830" y="756" class="node-text">结束</text>

  <!-- 过程输出物 -->
  <path d="M650,450 H810 V493 C770,480 731,503 690,493 C677,489 663,489 650,493 Z" class="node"/><text x="730" y="475" class="small-text" text-anchor="middle">未来4周日度库存轨迹</text><line x1="730" y1="440" x2="730" y2="450" class="artifact-link"/>
  <path d="M1475,370 H1645 V410 C1603,398 1561,419 1518,410 C1504,406 1489,406 1475,410 Z" class="node"/><text x="1560" y="394" class="small-text" text-anchor="middle">锁定期库存预警</text><line x1="1560" y1="360" x2="1560" y2="370" class="artifact-link"/>
  <path d="M1455,530 H1685 V575 C1628,562 1571,585 1513,575 C1494,571 1474,571 1455,575 Z" class="node"/><text x="1570" y="556" class="small-text" text-anchor="middle">第2至第4周库存预警与补货调整建议</text><line x1="1570" y1="510" x2="1570" y2="530" class="artifact-link"/>

  <!-- 主流程 -->
  <path d="M177,170 H235" class="flow"/>
  <path d="M515,170 H545 V385 H585" class="flow"/>
  <path d="M875,385 H890" class="flow"/>
  <path d="M1080,385 H1145" class="flow"/><text x="1095" y="373" class="small-text">Y</text>

  <!-- 无风险：沿顶部外缘汇入唯一结束节点 -->
  <path d="M985,325 V235 H2900 V750 H2862" class="flow"/><text x="1000" y="229" class="small-text">N：记录正常状态</text>

  <!-- 锁定期分支 -->
  <path d="M1240,325 V315 H1410" class="flow"/><text x="1260" y="303" class="small-text">Y：锁定期内</text>
  <path d="M1710,315 H1790" class="flow"/>
  <path d="M2070,315 H2875 V690 H2830 V718" class="flow"/>

  <!-- 锁定期外分支 -->
  <path d="M1240,445 V465 H1410" class="flow"/><text x="1260" y="485" class="small-text">N：锁定期外三周</text>
  <path d="M1730,465 H1765 V595 H1810" class="flow"/>
  <path d="M2090,595 H2125 V750 H2165" class="flow"/>
  <path d="M2355,750 H2430" class="flow"/><text x="2370" y="738" class="small-text">Y</text>
  <path d="M2710,750 H2798" class="flow"/>
  <!-- 不调整生产计划：独立底部通道进入同一终点 -->
  <path d="M2260,810 V822 H2830 V782" class="flow"/><text x="2380" y="816" class="small-text">N：记录不调整原因，保留调整建议</text>

  <text x="110" y="817" class="note-text">控制原则：日度监控覆盖已生成的未来4周；第1周为锁定期，发生风险时只生成库存预警，不修改锁定生产补充量；第2至第4周发生风险时，在预警的同时调整生产补货建议，并与生产端协同是否调整生产计划。</text>
</svg>
