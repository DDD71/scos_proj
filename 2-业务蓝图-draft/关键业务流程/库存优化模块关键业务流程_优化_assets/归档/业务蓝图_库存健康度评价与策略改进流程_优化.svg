<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="2660" height="860" viewBox="0 0 2660 860">
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L9,4.5 L0,9 Z" fill="#111111"/></marker>
    <style>
      .title{font-family:"SimSun","Songti SC","STSong",serif;font-size:23px;font-weight:600;fill:#1a1a1a}
      .lane-text{font-family:"SimSun","Songti SC","STSong",serif;font-size:18px;fill:#222;text-anchor:middle}
      .node-text{font-family:"SimSun","Songti SC","STSong",serif;font-size:16px;fill:#222;text-anchor:middle}
      .small-text{font-family:"SimSun","Songti SC","STSong",serif;font-size:15px;fill:#222}
      .note-text{font-family:"SimSun","Songti SC","STSong",serif;font-size:14px;fill:#444}
      .tag-text{font-family:Arial,"Microsoft YaHei",sans-serif;font-size:14px;fill:#fff;text-anchor:middle}
      .frame{fill:#fff;stroke:#777;stroke-width:1.15}.divider{fill:none;stroke:#888;stroke-width:1}
      .node{fill:#fff;stroke:#8b8b8b;stroke-width:1.35}
      .flow{fill:none;stroke:#111;stroke-width:2;stroke-linejoin:round;stroke-linecap:square;marker-end:url(#arrow)}
      .artifact-link{fill:none;stroke:#777;stroke-width:1.1;stroke-dasharray:4 4}
      .tag-scos{fill:#0088c7}.tag-data{fill:#c94747}
    </style>
  </defs>

  <rect width="2660" height="860" fill="#ffffff"/>
  <rect x="40" y="26" width="2580" height="809" class="frame"/>
  <line x1="40" y1="102" x2="2620" y2="102" class="divider"/>
  <text x="51" y="70" class="title">流程编号及名称：（P-ZLTC-SCOS-KCYH-005 库存健康度评价与策略改进流程）</text>

  <!-- 泳道 -->
  <line x1="85" y1="102" x2="85" y2="835" class="divider"/>
  <line x1="40" y1="255" x2="2620" y2="255" class="divider"/>
  <line x1="40" y1="480" x2="2620" y2="480" class="divider"/>
  <line x1="40" y1="650" x2="2620" y2="650" class="divider"/>
  <text x="62.5" y="112" class="lane-text"><tspan x="62.5">统</tspan><tspan x="62.5" dy="22">一</tspan><tspan x="62.5" dy="22">数</tspan><tspan x="62.5" dy="22">据</tspan><tspan x="62.5" dy="22">服</tspan><tspan x="62.5" dy="22">务</tspan><tspan x="62.5" dy="22">层</tspan></text>
  <text x="62.5" y="312" class="lane-text"><tspan x="62.5">S</tspan><tspan x="62.5" dy="27">C</tspan><tspan x="62.5" dy="27">O</tspan><tspan x="62.5" dy="27">S</tspan></text>
  <text x="62.5" y="500" class="lane-text"><tspan x="62.5">库</tspan><tspan x="62.5" dy="25">存</tspan><tspan x="62.5" dy="25">计</tspan><tspan x="62.5" dy="25">划</tspan><tspan x="62.5" dy="25">员</tspan></text>
  <text x="62.5" y="671" class="lane-text"><tspan x="62.5">库</tspan><tspan x="62.5" dy="25">存</tspan><tspan x="62.5" dy="25">负</tspan><tspan x="62.5" dy="25">责</tspan><tspan x="62.5" dy="25">人</tspan></text>

  <!-- 开始与策略执行数据 -->
  <circle cx="145" cy="170" r="32" class="node"/><text x="145" y="176" class="node-text">开始</text>
  <rect x="235" y="120" width="290" height="100" class="node"/><rect x="225" y="109" width="82" height="22" class="tag-data"/><text x="266" y="125" class="tag-text">数据服务</text>
  <text x="380" y="143" class="node-text"><tspan x="380">10</tspan><tspan x="380" dy="21">提供策略与实际</tspan><tspan x="380" dy="21">库存执行数据</tspan></text>

  <!-- 健康度评价 -->
  <rect x="610" y="325" width="300" height="100" class="node"/><rect x="600" y="314" width="58" height="22" class="tag-scos"/><text x="629" y="330" class="tag-text">SCOS</text>
  <text x="760" y="349" class="node-text"><tspan x="760">20</tspan><tspan x="760" dy="20">生成库存健康度评价</tspan><tspan x="760" dy="20">周转、服务水平、缺货</tspan><tspan x="760" dy="20">滞销、呆滞与临期</tspan></text>

  <!-- 复核 -->
  <rect x="1000" y="520" width="280" height="90" class="node"/><rect x="990" y="509" width="58" height="22" class="tag-scos"/><text x="1019" y="525" class="tag-text">SCOS</text>
  <text x="1140" y="546" class="node-text"><tspan x="1140">30</tspan><tspan x="1140" dy="21">复核库存健康度</tspan><tspan x="1140" dy="21">与策略有效性</tspan></text>

  <!-- 是否需要改进 -->
  <polygon points="1440,505 1535,565 1440,625 1345,565" class="node"/><rect x="1340" y="504" width="58" height="22" class="tag-scos"/><text x="1369" y="520" class="tag-text">SCOS</text>
  <text x="1440" y="558" class="node-text"><tspan x="1440">40</tspan><tspan x="1440" dy="21">是否需要改进策略？</tspan></text>

  <!-- 改进建议 -->
  <rect x="1630" y="520" width="270" height="90" class="node"/><rect x="1620" y="509" width="58" height="22" class="tag-scos"/><text x="1649" y="525" class="tag-text">SCOS</text>
  <text x="1765" y="546" class="node-text"><tspan x="1765">50</tspan><tspan x="1765" dy="21">形成库存策略</tspan><tspan x="1765" dy="21">改进建议</tspan></text>

  <!-- 是否纳入调整 -->
  <polygon points="2070,680 2165,740 2070,800 1975,740" class="node"/><rect x="1970" y="679" width="58" height="22" class="tag-scos"/><text x="1999" y="695" class="tag-text">SCOS</text>
  <text x="2070" y="733" class="node-text"><tspan x="2070">60</tspan><tspan x="2070" dy="21">是否纳入策略调整？</tspan></text>

  <!-- 发布与结束 -->
  <rect x="2260" y="330" width="250" height="90" class="node"/><rect x="2250" y="319" width="58" height="22" class="tag-scos"/><text x="2279" y="335" class="tag-text">SCOS</text>
  <text x="2385" y="356" class="node-text"><tspan x="2385">70</tspan><tspan x="2385" dy="21">发布健康度报告</tspan><tspan x="2385" dy="21">与改进结论</tspan></text>
  <circle cx="2580" cy="375" r="32" class="node"/><text x="2580" y="381" class="node-text">结束</text>

  <!-- 输出物 -->
  <path d="M675,435 H845 V475 C803,463 761,484 718,475 C704,471 689,471 675,475 Z" class="node"/><text x="760" y="459" class="small-text" text-anchor="middle">库存健康度报告</text><line x1="760" y1="425" x2="760" y2="435" class="artifact-link"/>
  <path d="M1680,620 H1850 V660 C1808,648 1766,669 1723,660 C1709,656 1694,656 1680,660 Z" class="node"/><text x="1765" y="644" class="small-text" text-anchor="middle">策略改进建议</text><line x1="1765" y1="610" x2="1765" y2="620" class="artifact-link"/>

  <!-- 主流程 -->
  <path d="M177,170 H235" class="flow"/>
  <path d="M525,170 H565 V375 H610" class="flow"/>
  <path d="M910,375 H1140 V520" class="flow"/>
  <path d="M1280,565 H1345" class="flow"/>
  <path d="M1535,565 H1630" class="flow"/><text x="1550" y="553" class="small-text">Y</text>
  <path d="M1900,565 H1935 V740 H1975" class="flow"/>
  <path d="M2165,740 H2205 V375 H2260" class="flow"/><text x="2178" y="728" class="small-text">Y</text>
  <path d="M2510,375 H2548" class="flow"/>

  <!-- 无参数改进建议：沿SCOS泳道上方独立通道直接进入70 -->
  <path d="M1440,505 V270 H2385 V330" class="flow"/><text x="1460" y="264" class="small-text">N：无参数改进建议，直接进入70</text>

  <!-- 不纳入策略调整：从60顶部直接向上，绕开策略改进建议子节点并返回50顶部 -->
  <path d="M2070,680 V480 H1765 V520" class="flow"/><text x="1830" y="474" class="small-text">N：保留建议待后续复核</text>

  <text x="110" y="817" class="note-text">健康度评价用于验证已发布策略的实际效果；改进建议只有经业务确认后才进入月度制定或异常调整流程。</text>
</svg>
