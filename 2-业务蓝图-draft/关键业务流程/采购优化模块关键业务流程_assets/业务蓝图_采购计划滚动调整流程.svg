<svg xmlns="http://www.w3.org/2000/svg" width="1550" height="520" viewBox="0 0 1550 520"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4 0 8Z" fill="#333"/></marker><style>.tt{font:bold 18px 'Microsoft YaHei';fill:#222}.lh{font:bold 15px 'Microsoft YaHei';fill:#222}.tx{font:13px 'Microsoft YaHei';fill:#222}.sm{font:12px 'Microsoft YaHei';fill:#444}.b{fill:#fff;stroke:#c94747;stroke-width:1.4}.s{fill:#fff;stroke:#4f7d5b;stroke-width:1.4}.x,.d{fill:#fff;stroke:#555;stroke-width:1.3}.f{fill:none;stroke:#333;stroke-width:1.35;marker-end:url(#a)}</style></defs>
<rect width="1550" height="520" fill="#fff"/><text x="24" y="34" class="tt">流程编号及名称：（P-ZLTC-SCOS-CGYH-003 采购计划滚动调整流程）</text><rect x="20" y="55" width="1510" height="400" fill="#fff" stroke="#555"/><rect x="20" y="55" width="145" height="400" fill="#f3f3f3" stroke="#555"/><path d="M20 188H1530M20 321H1530" stroke="#aaa"/><text x="70" y="125" class="lh">SCOS</text><text x="52" y="258" class="lh">采购计划员</text><text x="48" y="391" class="lh">E采/SAP、TMS</text>
<circle cx="205" cy="121" r="20" class="x"/><text x="205" y="126" text-anchor="middle" class="sm">开始</text><polygon points="330,77 395,121 330,165 265,121" class="d"/><text x="330" y="116" text-anchor="middle" class="tx"><tspan x="330">10 未执行安排</tspan><tspan x="330" dy="18">受影响？</tspan></text><rect x="440" y="87" width="180" height="68" class="s"/><text x="530" y="110" text-anchor="middle" class="tx"><tspan x="530">20 生成滚动调整建议</tspan><tspan x="530" dy="19">仅重算受影响的</tspan><tspan x="530" dy="19">未执行部分</tspan></text>
<rect x="675" y="222" width="180" height="70" class="b"/><text x="765" y="245" text-anchor="middle" class="tx"><tspan x="765">30 评审调整建议</tspan><tspan x="765" dy="19">确认调整范围</tspan><tspan x="765" dy="19">已执行部分保持不变</tspan></text><polygon points="945,213 1010,257 945,301 880,257" class="d"/><text x="945" y="252" text-anchor="middle" class="tx"><tspan x="945">40 是否确认</tspan><tspan x="945" dy="18">调整？</tspan></text><rect x="1060" y="90" width="165" height="62" class="s"/><text x="1142" y="114" text-anchor="middle" class="tx"><tspan x="1142">50 发布采购计划</tspan><tspan x="1142" dy="19">新版本</tspan></text><rect x="1280" y="359" width="155" height="62" class="x"/><text x="1357" y="383" text-anchor="middle" class="tx"><tspan x="1357">60 接收调整后的</tspan><tspan x="1357" dy="19">未执行计划</tspan></text>
<path d="M225 121H265M395 121H440M620 121H645V257H675M855 257H880M1010 257H1035V121H1060M1225 121H1250V390H1280" class="f"/><text x="405" y="109" class="sm">Y</text><text x="1018" y="245" class="sm">Y</text><text x="265" y="180" class="sm">N：保留当前计划并结束</text><text x="880" y="315" class="sm">N：保留当前计划</text><text x="24" y="488" class="sm">先判断未执行计划是否受影响，只有受影响时才生成调整建议，避免把“每周检查”等同于“每周必调”。</text><g font-family="Microsoft YaHei" font-size="11" font-weight="bold" fill="#fff"><rect x="265" y="79" width="42" height="18" fill="#4f7d5b"/><text x="286" y="92" text-anchor="middle">SCOS</text><rect x="440" y="87" width="42" height="18" fill="#4f7d5b"/><text x="461" y="100" text-anchor="middle">SCOS</text><rect x="675" y="222" width="42" height="18" fill="#4f7d5b"/><text x="696" y="235" text-anchor="middle">SCOS</text><rect x="880" y="215" width="42" height="18" fill="#4f7d5b"/><text x="901" y="228" text-anchor="middle">SCOS</text><rect x="1060" y="90" width="42" height="18" fill="#4f7d5b"/><text x="1081" y="103" text-anchor="middle">SCOS</text><rect x="1280" y="359" width="78" height="18" fill="#c94747"/><text x="1319" y="372" text-anchor="middle">E采/TMS</text></g><path d="M505 170H650V210Q614 197 578 210Q542 223 505 210Z" fill="#fff" stroke="#666"/><text x="578" y="190" text-anchor="middle" class="sm">采购计划调整方案</text><path d="M1125 170H1260V210Q1226 197 1192 210Q1158 223 1125 210Z" fill="#fff" stroke="#666"/><text x="1192" y="190" text-anchor="middle" class="sm">采购计划新版本</text></svg>
