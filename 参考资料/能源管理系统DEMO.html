<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>能源管理系统（EMS）演示 · 中粮生物科技太仓 55万吨/年淀粉糖项目</title>
<style>
  :root{--bg:#f5f7fa;--main:#f5f7fa;--card:#ffffff;--ink:#1e293b;--sub:#64748b;--accent:#3b82f6;--warn:#f59e0b;--danger:#ef4444;--good:#10b981;--chip:#f1f5f9;--line:#e2e8f0;--shadow:0 1px 3px rgba(15,23,42,.06),0 1px 2px rgba(15,23,42,.04)}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:"Microsoft YaHei","Segoe UI",Roboto,Arial,sans-serif;background:var(--main);color:var(--ink);font-size:14px}
  .app{display:flex;height:100vh;overflow:hidden}
  .sidebar{width:272px;background:linear-gradient(180deg,#1e293b,#16202e);color:#cbd5e1;display:flex;flex-direction:column;flex-shrink:0}
  .brand{padding:18px 18px 14px;border-bottom:1px solid #2b3a4f}
  .brand h1{font-size:16px;color:#fff;letter-spacing:.5px}
  .brand .sub{font-size:11px;color:#7e93a8;margin-top:4px;line-height:1.5}
  .nav{flex:1;overflow-y:auto;padding:8px 0}
  .nav::-webkit-scrollbar{width:8px}.nav::-webkit-scrollbar-thumb{background:#33465e;border-radius:4px}
  .nav-group{margin:2px 0}
  .nav-group>.grp-title{display:flex;align-items:center;gap:8px;padding:10px 16px;cursor:pointer;font-size:13px;color:#a5b6c8;font-weight:600;user-select:none}
  .nav-group>.grp-title:hover{background:#273549}
  .nav-group>.grp-title .ar{margin-left:auto;transition:transform .2s;font-size:10px;color:#6f8298}
  .nav-group.open>.grp-title .ar{transform:rotate(90deg)}
  .nav-items{display:none;background:#182230}
  .nav-group.open .nav-items{display:block}
  .nav-item{padding:9px 16px 9px 34px;cursor:pointer;font-size:13px;color:#94a7bc;border-left:3px solid transparent;display:flex;align-items:center;gap:8px}
  .nav-item:hover{background:#22303f;color:#dbe4ee}
  .nav-item.active{background:#1d3350;color:#fff;border-left-color:var(--accent)}
  .nav-item .tag{margin-left:auto;font-size:10px;background:#2c3e55;color:#8fb3d1;border-radius:3px;padding:1px 5px}
  .side-foot{padding:12px 16px;border-top:1px solid #2b3a4f;font-size:11px;color:#6f8298;line-height:1.6}
  .main{flex:1;display:flex;flex-direction:column;overflow:hidden}
  .topbar{height:54px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 20px;gap:14px;flex-shrink:0}
  .topbar .crumb{font-size:14px;font-weight:600}
  .topbar .crumb span{color:var(--sub);font-weight:400}
  .topbar .right{margin-left:auto;display:flex;align-items:center;gap:16px;font-size:12px;color:var(--sub)}
  .pill{display:inline-flex;align-items:center;gap:5px;background:#ecfdf5;color:#059669;border-radius:12px;padding:3px 10px;font-size:11px;font-weight:600}
  .pill i{width:7px;height:7px;border-radius:50%;background:#10b981;display:inline-block}
  .avatar{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,#3b82f6,#0ea5e9);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700}
  .content{flex:1;overflow-y:auto;padding:18px 20px 40px}
  .view{display:none;animation:fade .25s}
  .view.active{display:block}
  @keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
  .page-head{margin-bottom:14px}
  .page-head h2{font-size:19px}
  .page-head p{font-size:12px;color:var(--sub);margin-top:4px;line-height:1.7;max-width:1100px}
  .grid{display:grid;gap:14px}
  .g4{grid-template-columns:repeat(4,1fr)}
  .g3{grid-template-columns:repeat(3,1fr)}
  .g2{grid-template-columns:repeat(2,1fr)}
  .card{background:var(--card);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow)}
  .card .hd{padding:12px 16px;border-bottom:1px solid #eef2f6;display:flex;align-items:center;gap:8px}
  .card .hd h3{font-size:14px}
  .card .hd .more{margin-left:auto;font-size:11px;color:var(--accent);cursor:pointer}
  .card .bd{padding:14px 16px}
  .kpi{padding:16px}
  .kpi .lbl{font-size:12px;color:var(--sub)}
  .kpi .val{font-size:26px;font-weight:700;margin-top:6px}
  .kpi .val small{font-size:13px;font-weight:400;color:var(--sub);margin-left:3px}
  .kpi .trend{font-size:11px;margin-top:6px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .up{color:var(--danger)}.down{color:var(--good)}
  table.tb{width:100%;border-collapse:collapse;font-size:12.5px}
  table.tb th{background:#f8fafc;color:#475569;text-align:left;padding:8px 10px;font-weight:600;border-bottom:1px solid var(--line);white-space:nowrap}
  table.tb td{padding:8px 10px;border-bottom:1px solid #eef2f6;color:#334155}
  table.tb tr:hover td{background:#f8fafc}
  .chip{display:inline-block;background:var(--chip);border-radius:4px;padding:2px 8px;font-size:11px;color:#475569;margin:2px 3px 2px 0}
  .chip.b{background:#eff6ff;color:#2563eb}
  .chip.g{background:#ecfdf5;color:#059669}
  .chip.o{background:#fffbeb;color:#d97706}
  .chip.r{background:#fef2f2;color:#dc2626}
  .bar{height:8px;background:#eef2f6;border-radius:4px;overflow:hidden;min-width:80px}
  .bar>i{display:block;height:100%;border-radius:4px}
  .flow{display:flex;align-items:center;gap:0;flex-wrap:wrap}
  .flow .node{background:#fff;border:1.5px solid #cbd5e1;border-radius:8px;padding:10px 14px;font-size:12.5px;text-align:center;min-width:130px}
  .flow .node b{display:block;font-size:13px;margin-bottom:3px}
  .flow .node small{color:var(--sub)}
  .flow .arr{color:#94a3b8;font-size:18px;padding:0 8px}
  .note{font-size:11.5px;color:var(--sub);line-height:1.7;background:#f8fafc;border:1px dashed #dbe3ec;border-radius:8px;padding:10px 12px;margin-top:12px}
  .tabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
  .tabs button{border:1px solid #dbe3ec;background:#fff;border-radius:6px;padding:6px 14px;font-size:12.5px;cursor:pointer;color:#46607a}
  .tabs button.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .legend{font-size:11px;color:var(--sub);display:flex;gap:14px;flex-wrap:wrap;margin-top:8px;align-items:center}
  .legend i{width:10px;height:10px;border-radius:2px;display:inline-block;margin-right:4px;vertical-align:-1px}
  .split{display:grid;grid-template-columns:1.15fr .85fr;gap:14px}
  .lvl{display:flex;gap:10px;align-items:stretch}
  .lvl .step{flex:1;border:1px solid #e2e8f0;border-radius:8px;padding:10px;background:#fbfdff}
  .lvl .step h4{font-size:12.5px;margin-bottom:6px;color:#1e40af}
  .lvl .step ul{margin-left:16px;font-size:11.5px;color:#5b6b7e;line-height:1.8}
  .lvl .ar2{align-self:center;color:#94a3b8;font-size:18px}
  .alarm{border-left:3px solid var(--danger);background:#fef2f2;border-radius:0 6px 6px 0;padding:8px 12px;margin-bottom:8px;font-size:12px}
  .alarm.w{border-left-color:var(--warn);background:#fffbeb}
  .alarm b{margin-right:8px}
  .alarm .t{float:right;color:var(--sub);font-size:11px}
  .seclist{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
  .seclist .it{border:1px solid #e2e8f0;border-radius:8px;padding:10px;background:#fbfdff;font-size:12px}
  .seclist .it b{display:block;font-size:12.5px;margin-bottom:4px}
  .seclist .it small{color:var(--sub);line-height:1.6}
  .formula{font-family:Consolas,monospace;background:#0f172a;color:#7dd3fc;border-radius:6px;padding:8px 12px;font-size:12px;margin:6px 0}
  .sub-h{font-size:13px;font-weight:700;color:#1e40af;margin:14px 0 8px;padding-left:9px;border-left:3px solid var(--accent)}
  .proto{font-size:10px;font-weight:700;border-radius:3px;padding:1px 6px;margin-left:5px}
  .proto.kafka{background:#1f2937;color:#fbbf24}
  .proto.http{background:#eff6ff;color:#2563eb}
  .proto.esb{background:#f5f3ff;color:#7c3aed}
  .proto.opc{background:#ecfdf5;color:#059669}
  .dir-in{color:#2563eb;font-weight:700}
  .dir-out{color:#d97706;font-weight:700}
  .chart{width:100%;height:auto;display:block}
  .chart-lbl{font-size:11px;fill:#64748b}
  .chart-val{font-size:11px;font-weight:700;fill:#334155}
  .chart-grid{stroke:#eef2f6;stroke-width:1}
  .flow-img-wrap{position:relative}
  .flow-img{display:block;width:100%;height:auto;max-height:620px;object-fit:contain;background:#0a1a2e;border-radius:6px;cursor:zoom-in}
  .flow-img:hover{box-shadow:0 0 0 2px var(--accent),0 8px 24px rgba(15,23,42,.18)}
  .img-meta{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end;margin-top:10px;font-size:11px;color:var(--sub)}
  .img-meta span{background:#f8fafc;padding:3px 10px;border-radius:12px;border:1px solid var(--line);color:#475569}
  .img-meta .k{color:var(--sub);margin-right:4px}
  /* ============ KPI 可点击数字 + 统计明细弹窗 ============ */
  .kpi-link{cursor:pointer;color:inherit;position:relative;transition:color .15s}
  .kpi-link:hover{color:var(--accent)}
  .kpi-link::after{content:'▸ 明细';font-size:10px;color:var(--accent);margin-left:7px;font-weight:400;opacity:.65;letter-spacing:.5px}
  .kpi-link:hover::after{opacity:1}
  .modal-mask{position:fixed;inset:0;background:rgba(15,23,42,.55);z-index:99;display:flex;align-items:center;justify-content:center;padding:24px;animation:fade .2s}
  .modal-mask[hidden]{display:none}
  .modal{background:#fff;border-radius:12px;width:min(860px,96vw);max-height:88vh;display:flex;flex-direction:column;box-shadow:0 22px 64px rgba(15,23,42,.38);overflow:hidden}
  .modal-hd{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;flex-shrink:0}
  .modal-hd h3{font-size:16px;color:#1e293b}
  .modal-hd .sub{font-size:11px;color:var(--sub);margin-top:3px}
  .modal-hd .x{margin-left:auto;width:32px;height:32px;border-radius:8px;border:1px solid var(--line);background:#f8fafc;cursor:pointer;color:#475569;font-size:16px;line-height:1;flex-shrink:0;transition:.15s}
  .modal-hd .x:hover{background:#eef2f6;color:#ef4444}
  .modal-bd{padding:18px 20px;overflow-y:auto}
  .modal-bd .kpi-mini{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
  .modal-bd .kpi-mini .m{flex:1;min-width:120px;border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:#fbfdff}
  .modal-bd .kpi-mini .m .l{font-size:11px;color:var(--sub)}
  .modal-bd .kpi-mini .m .v{font-size:18px;font-weight:700;margin-top:3px}
  .modal-bd .hint{font-size:11.5px;color:var(--sub);background:#f1f5f9;border:1px dashed #cbd5e1;border-radius:8px;padding:8px 12px;margin-top:10px;line-height:1.7}
  /* ===== 能源流向图（内联 SVG · 动态流动） ===== */
  .energy-flow{display:block;width:100%;height:auto;max-height:68vh;background:#0a1a2e;border-radius:6px;cursor:grab;touch-action:none}
  .mq-mnet .energy-flow{max-height:none}
  .energy-flow:active{cursor:grabbing}
  .energy-flow:hover{box-shadow:0 0 0 2px var(--accent),0 8px 24px rgba(15,23,42,.18)}
  @keyframes flowDash{to{stroke-dashoffset:-44}}
  .pipe-flow{stroke-dasharray:13 11;animation:flowDash 1.15s linear infinite}
  .pipe-flow.rev{animation-direction:reverse}
  @keyframes nodePulse{0%,100%{opacity:.30}50%{opacity:.85}}
  .pipe-halo{animation:nodePulse 2.4s ease-in-out infinite}
  @keyframes flowDot{0%{opacity:.2}50%{opacity:1}100%{opacity:.2}}
  .flow-dot{animation:flowDot 1.15s linear infinite}
  /* ===== 能流图缩放/平移工具条 ===== */
  .flow-zoombar{position:absolute;top:10px;right:10px;z-index:6;display:flex;align-items:center;gap:6px;background:rgba(8,23,38,.82);border:1px solid rgba(148,197,230,.35);border-radius:10px;padding:5px 7px;backdrop-filter:blur(2px);user-select:none}
  .flow-zoombar button{width:28px;height:28px;border-radius:7px;border:1px solid rgba(148,197,230,.4);background:#0f2c44;color:#eaf4ff;font-size:15px;line-height:1;cursor:pointer;transition:.15s}
  .flow-zoombar button:hover{background:#15334f;border-color:var(--accent)}
  .flow-zoombar button.reset{width:auto;padding:0 10px;font-size:12px}
  .flow-zoombar .zp{min-width:46px;text-align:center;color:#9fc6e6;font-size:12px;font-variant-numeric:tabular-nums}
  /* 计量点徽标（能流图节点下方实时值） */
  .meter-val{font-variant-numeric:tabular-nums}
  /* 计量点清单侧栏 */
  .meter-side{background:#0c1c2e;border:1px solid #1f3a52;border-radius:10px;padding:12px 14px;margin-top:14px}
  .meter-side .ms-cols{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
  .meter-side .ms-col{background:#0a1a2e;border:1px solid #1b3247;border-radius:8px;padding:10px 12px}
  .meter-side::-webkit-scrollbar{width:8px}.meter-side::-webkit-scrollbar-thumb{background:#33465e;border-radius:4px}
  .meter-side .ms-head{font-size:14px;font-weight:700;color:#eaf4ff;margin-bottom:4px}
  .meter-side .ms-note{font-size:11px;color:#7e93a8;line-height:1.6;margin-bottom:10px;border-left:2px solid var(--accent);padding-left:8px}
  .meter-side .ms-grp{font-size:12.5px;font-weight:700;color:#9fc6e6;margin:10px 0 6px;padding-bottom:4px;border-bottom:1px dashed #24425c}
  .meter-side .ms-cnt{font-size:10px;font-weight:600;color:#7ee0a8;background:#0f3324;border:1px solid #1f5c3e;border-radius:10px;padding:0 7px;margin-left:6px}
  .meter-side .ms-row{display:flex;align-items:center;gap:8px;padding:5px 2px;border-bottom:1px solid #14283b;font-size:12px}
  .meter-side .ms-row:hover{background:#102338}
  .meter-side .ms-tag{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:10.5px;color:#7fd0ff;background:#0c2c44;border:1px solid #1f4b6b;border-radius:4px;padding:1px 6px;white-space:nowrap}
  .meter-side .ms-name{color:#cde0f0;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .meter-side .meter-side-val{color:#7ee0a8;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}

  /* ===== 重点耗能设备监控 ===== */
  .dm-summary{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:14px}
  .dm-summary .s{background:#0c1c2e;border:1px solid #1f3a52;border-radius:10px;padding:12px 14px}
  .dm-summary .s .l{font-size:11.5px;color:#9fc6e6}
  .dm-summary .s .v{font-size:22px;font-weight:800;color:#eaf4ff;font-variant-numeric:tabular-nums;margin-top:2px}
  .dm-summary .s .v small{font-size:12px;color:#7e93a8;font-weight:600;margin-left:3px}
  .dm-layout{display:grid;grid-template-columns:236px 1fr;gap:14px;align-items:start}
  .dm-nav{background:#0c1c2e;border:1px solid #1f3a52;border-radius:12px;padding:10px;position:sticky;top:14px;max-height:78vh;overflow:auto}
  .dm-nav .grp{margin-bottom:8px}
  .dm-nav .grp-title{font-size:12px;font-weight:700;color:#9fc6e6;padding:6px 8px;border-bottom:1px dashed #24425c;margin-bottom:4px}
  .dm-nav .dev{display:flex;align-items:center;gap:8px;padding:7px 8px;border-radius:8px;cursor:pointer;font-size:12.5px;color:#cde0f0;border:1px solid transparent;margin-bottom:3px}
  .dm-nav .dev:hover{background:#102338}
  .dm-nav .dev.on{background:#10294a;border-color:#2f6ea3;color:#eaf4ff;box-shadow:0 0 0 1px #2f6ea3 inset}
  .dm-nav .dev .dot{width:8px;height:8px;border-radius:50%;background:#36d399;flex:0 0 auto;box-shadow:0 0 6px #36d399}
  .dm-nav .dev .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .dm-nav .dev .tg{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:10px;color:#7fd0ff;background:#0c2c44;border:1px solid #1f4b6b;border-radius:4px;padding:0 5px}
  .dm-main{min-width:0}
  .dm-card{background:#0b1d30;border:1px solid #20405c;border-radius:14px;padding:16px;box-shadow:0 6px 24px rgba(0,0,0,.25)}
  .dm-head{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding-bottom:12px;margin-bottom:14px;border-bottom:1px solid #1c3856}
  .dm-head .h-ico{width:46px;height:46px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:24px;background:linear-gradient(135deg,#0e3a5e,#0a2740);border:1px solid #2f6ea3}
  .dm-head .h-t{font-size:19px;font-weight:800;color:#eaf4ff}
  .dm-head .h-t small{font-size:12px;color:#7fd0ff;font-weight:600;margin-left:8px;font-family:ui-monospace,Menlo,Consolas,monospace}
  .dm-head .h-sub{font-size:12px;color:#9fc6e6;margin-top:1px}
  .dm-head .h-pw{margin-left:auto;text-align:right}
  .dm-head .h-pw .v{font-size:20px;font-weight:800;color:#ffd479;font-variant-numeric:tabular-nums}
  .dm-head .h-pw .v small{font-size:11px;color:#c9a85a;margin-left:2px}
  .dm-head .h-pw .l{font-size:11px;color:#9fc6e6}
  .st-badge{font-size:11.5px;font-weight:700;padding:3px 10px;border-radius:20px}
  .st-run{color:#7ee0a8;background:#0f3324;border:1px solid #1f5c3e}
  .st-idle{color:#ffd479;background:#332a0f;border:1px solid #5c4a1f}
  .st-maint{color:#ff9a9a;background:#330f0f;border:1px solid #5c1f1f}
  .dm-grid{display:grid;grid-template-columns:236px minmax(0,1fr) 246px;grid-template-areas:"left center right" "bottom bottom bottom";gap:14px}
  .dm-left{grid-area:left;display:flex;flex-direction:column;gap:10px}
  .dm-right{grid-area:right;display:flex;flex-direction:column;gap:10px}
  .dm-center{grid-area:center;background:radial-gradient(circle at 50% 42%,#0f3354 0%,#0a1f33 60%,#081626 100%);border:1px solid #1c3856;border-radius:12px;padding:14px;display:flex;align-items:center;justify-content:center;min-height:340px}
  .dm-center svg{width:100%;height:auto;max-height:360px;display:block}
  .dm-kpi{background:#0a1a2e;border:1px solid #1b3247;border-radius:10px;padding:10px 12px}
  .dm-kpi .k-l{font-size:11.5px;color:#9fc6e6;display:flex;justify-content:space-between}
  .dm-kpi .k-l .u{color:#6f8aa3;font-size:10px}
  .dm-kpi .k-v{font-size:21px;font-weight:800;color:#eaf4ff;font-variant-numeric:tabular-nums;margin-top:2px}
  .dm-kpi .k-v small{font-size:12px;color:#7e93a8;margin-left:2px;font-weight:600}
  .dm-kpi .k-bar{height:5px;border-radius:3px;background:#13263a;margin-top:7px;overflow:hidden}
  .dm-kpi .k-bar i{display:block;height:100%;border-radius:3px;background:linear-gradient(90deg,#3b82f6,#36d399)}
  .dm-gauge{background:#0a1a2e;border:1px solid #1b3247;border-radius:10px;padding:10px 12px;display:flex;align-items:center;gap:12px}
  .dm-gauge svg{flex:0 0 auto}
  .dm-gauge .g-txt .g-l{font-size:11.5px;color:#9fc6e6}
  .dm-gauge .g-txt .g-v{font-size:22px;font-weight:800;color:#eaf4ff;font-variant-numeric:tabular-nums}
  .dm-gauge .g-txt .g-v small{font-size:12px;color:#7e93a8;margin-left:2px;font-weight:600}
  .dm-bottom{grid-area:bottom;display:grid;grid-template-columns:1.15fr 1fr;gap:14px;margin-top:2px}
  .dm-chart,.dm-param{background:#0a1a2e;border:1px solid #1b3247;border-radius:10px;padding:12px 14px}
  .dm-chart .c-h,.dm-param .c-h{font-size:13px;font-weight:700;color:#eaf4ff;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center}
  .dm-chart .c-h .cur{font-size:13px;color:#7ee0a8;font-weight:800;font-variant-numeric:tabular-nums}
  .dm-param table{width:100%;border-collapse:collapse;font-size:12px}
  .dm-param td{padding:6px 8px;border-bottom:1px solid #14283b;color:#cde0f0}
  .dm-param td.k{color:#9fc6e6;width:96px;font-weight:600}
  .dm-param td.v{color:#eaf4ff}
  /* 设备样图动态 */
  @keyframes dm-spin{to{transform:rotate(360deg)}}
  @keyframes dm-flick{0%,100%{opacity:.85;transform:scaleY(1)}50%{opacity:1;transform:scaleY(1.12)}}
  @keyframes dm-flow2{to{stroke-dashoffset:-20}}
  .dm-spin{transform-box:fill-box;transform-origin:center;animation:dm-spin 3.4s linear infinite}
  .dm-flick{transform-box:fill-box;transform-origin:bottom center;animation:dm-flick 1.1s ease-in-out infinite}
  .dm-pipe{stroke-dasharray:6 6;animation:dm-flow2 1s linear infinite}
  @media(max-width:1100px){.dm-grid{grid-template-columns:1fr;grid-template-areas:"center" "left" "right" "bottom"}}
  /* ============ 时间查询条 ============ */
  .time-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:linear-gradient(180deg,#f8fbff,#eef4fb);
    border:1px solid #d4e2f2;border-radius:10px;padding:10px 14px;margin-bottom:14px}
  .time-bar .tb-lbl{font-size:13px;font-weight:700;color:#1e40af;display:flex;align-items:center;gap:6px}
  .time-bar .tb-lbl::before{content:'';width:4px;height:14px;background:var(--accent);border-radius:2px;display:inline-block}
  .time-bar label{font-size:12px;color:#475569;display:flex;align-items:center;gap:5px}
  .time-bar input[type=date]{border:1px solid #cbd5e1;border-radius:7px;padding:5px 9px;font-size:12.5px;color:#1e293b;background:#fff;font-family:inherit}
  .time-bar input[type=date]:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 2px rgba(59,130,246,.18)}
  .time-bar .tb-q{margin-left:4px;border:none;background:linear-gradient(135deg,#3b82f6,#0ea5e9);color:#fff;font-size:12.5px;font-weight:600;
    padding:7px 18px;border-radius:8px;cursor:pointer;box-shadow:0 2px 6px rgba(59,130,246,.28)}
  .time-bar .tb-q:hover{filter:brightness(1.05)}
  .time-bar .tb-rand{margin-left:2px;border:1px solid #cbd5e1;background:#fff;color:#475569;font-size:12.5px;padding:7px 12px;border-radius:8px;cursor:pointer}
  .time-bar .tb-hint{margin-left:auto;font-size:11.5px;color:#059669;font-weight:600}
  .time-bar .tb-hint.err{color:#dc2626}
  /* ============ 数据穿透（柱状图点击） ============ */
  .bar-rect.clickable{cursor:pointer;transition:opacity .15s}
  .bar-rect.clickable:hover{opacity:.7}
  /* ============ 多层级能源计划编制 · 工作流 ============ */
  .plan-toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:14px;padding:12px 14px;border:1px solid #e3ebf3;border-radius:10px;background:linear-gradient(180deg,#f7fbff,#eef5fc)}
  .plan-toolbar .pt-lbl{font-size:13px;font-weight:700;color:#1e293b}
  .plan-toolbar .pbtn{padding:8px 14px;border-radius:8px;border:1px solid #2563eb;background:#2563eb;color:#fff;font-size:13px;font-weight:600;cursor:pointer;transition:.15s}
  .plan-toolbar .pbtn:hover{background:#1d4ed8}
  .plan-toolbar .pbtn.disabled,.plan-toolbar .pbtn:disabled{background:#e2e8f0;border-color:#cbd5e1;color:#94a3b8;cursor:not-allowed}
  .plan-toolbar .pt-ts{font-size:11.5px;color:#16a34a;margin-left:auto}
  .ppanel{margin-top:14px;border:1px solid #dbe7f2;border-radius:10px;background:#f6fbff;overflow:hidden}
  .ppanel .pp-h{padding:10px 14px;background:#e8f2ff;border-bottom:1px solid #dbe7f2;display:flex;align-items:baseline;gap:10px}
  .ppanel .pp-h .pp-sub{font-size:11.5px;color:#5b6b7e}
  .ppanel .bd{padding:0 14px 6px}
  /* ============ 报警系统：闪烁 / 基准线 / 滚动汇总 ============ */
  @keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}
  .meter-val.alarm{fill:#ef4444;font-weight:700;animation:blink 1s infinite}
  .meter-side-val.alarm{color:#dc2626;font-weight:700;animation:blink 1s infinite}
  /* 计量点清单：点击「计量点在线」弹出的暗色弹窗 */
  .modal.dark{background:#0c1c2e;border:1px solid #1f3a52;width:min(1180px,96vw)}

  .ms-open{color:var(--accent);font-weight:700;cursor:pointer;text-decoration:none;border-bottom:1px dashed var(--accent);padding-bottom:1px}
  .ms-open:hover{color:#7fd0ff;border-bottom-color:#7fd0ff}
  .meter-dot.alarm{fill:#ef4444}
  .dm-alarm-dot{animation:blink 1s infinite}
  #dmBase{stroke:#ef4444;stroke-dasharray:5 3}
  .dm-alarm{display:none;margin-top:8px;border-left:3px solid #ef4444;background:#fef2f2;border-radius:0 6px 6px 0;
    padding:7px 11px;font-size:12px;color:#b91c1c;cursor:pointer;animation:blink 1.4s infinite}
  .dm-alarm:hover{background:#fee2e2}
  .dm-alarm::before{content:'⚠ ';}
  .ab{display:inline-block;margin:4px 6px 0 0;padding:3px 9px;border-radius:6px;background:#fef2f2;color:#dc2626;
    border:1px solid #fecaca;font-size:11.5px;cursor:pointer}
  .ab:hover{background:#fee2e2}
  .ab::before{content:'⚠ ';}
  .alarm-banner{margin-top:10px;padding:9px 12px;border:1px dashed #fca5a5;border-radius:8px;background:#fff5f5;font-size:12px;line-height:1.9}
  /* 报警中心滚动汇总 */
  .alarm-cols-h{display:grid;grid-template-columns:150px 1.3fr 1.4fr 1.4fr;gap:10px;padding:7px 12px;background:#eef2f7;
    border:1px solid #e2e8f0;border-bottom:none;border-radius:10px 10px 0 0;font-size:11.5px;font-weight:700;color:#475569}
  .alarm-ticker{position:relative;height:260px;overflow:hidden;border:1px solid #e2e8f0;border-top:none;border-radius:0 0 10px 10px;background:#fbfdff}
  .alarm-track{position:absolute;left:0;right:0;top:0;will-change:transform}
  /* 数据修订 · 四步填报页 */
  .rev-flow .rev-node{cursor:pointer;transition:.15s;font-family:inherit}
  .rev-flow .rev-node.on{border-color:#2563eb;background:#eff6ff;box-shadow:0 0 0 2px rgba(37,99,235,.15)}
  .rev-pages{margin-top:14px}
  .rev-ph{font-size:14px;margin:14px 0 8px;color:#0f172a;font-weight:700}
  .rev-ph.sub{color:#475569;font-size:13px}
  .rev-form{background:#f8fafc;border:1px solid #e2e8f0;border-radius:10px;padding:14px}
  .rev-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px 14px}
  .rev-field{display:flex;flex-direction:column;gap:4px;font-size:12px;color:#475569}
  .rev-field>span{font-weight:600}
  .rev-field input,.rev-field select,.rev-field textarea{border:1px solid #cbd5e1;border-radius:7px;padding:7px 9px;font-size:13px;font-family:inherit;color:#0f172a;background:#fff}

  .rev-radio{display:flex;gap:18px;padding-top:6px}
  .rev-radio label{font-size:13px;color:#334155;display:flex;align-items:center;gap:5px}
  .rev-check{font-weight:600;color:#334155;display:flex;align-items:center;gap:6px}
  .rev-actions{display:flex;align-items:center;gap:12px;margin-top:12px}
  .btn-p,.btn-s{border:none;border-radius:8px;padding:8px 18px;font-size:13px;font-weight:700;cursor:pointer}
  .btn-p{background:#2563eb;color:#fff}.btn-p:hover{background:#1d4ed8}
  .btn-s{background:#e2e8f0;color:#334155}.btn-s:hover{background:#cbd5e1}
  .rev-ok{color:#16a34a;font-size:13px;font-weight:700}
  .rev-list{display:flex;flex-direction:column;gap:8px}
  .rev-item{display:flex;justify-content:space-between;align-items:center;gap:10px;background:#fff;border:1px solid #e2e8f0;border-radius:9px;padding:10px 12px;font-size:12.5px;color:#334155}
  .rev-tags{display:flex;gap:6px;flex-shrink:0}
  .tg{font-size:11px;padding:2px 8px;border-radius:5px;font-weight:700}
  .tg.warn{background:#fffbeb;color:#d97706}.tg.ok{background:#eff6ff;color:#2563eb}
  .rev-timeline{display:flex;flex-direction:column;gap:0;padding-left:6px}
  .rev-tl-item{position:relative;padding:0 0 16px 22px;border-left:2px solid #cbd5e1;margin-left:6px}
  .rev-tl-item:last-child{border-left-color:transparent}
  .rev-tl-item .dot{position:absolute;left:-7px;top:2px;width:11px;height:11px;border-radius:50%;border:2px solid #fff}
  .rev-tl-item .dot.a{background:#2563eb}.rev-tl-item .dot.b{background:#d97706}.rev-tl-item .dot.c{background:#16a34a}.rev-tl-item .dot.d{background:#7c3aed}
  .rev-tl-item b{font-size:13px;color:#0f172a}
  .rev-tl-item small{color:#64748b}
  .alarm-row{display:grid;grid-template-columns:150px 1.3fr 1.4fr 1.4fr;gap:10px;padding:9px 12px;
    border-bottom:1px dashed #e2e8f0;font-size:11.5px;line-height:1.45;align-items:start;cursor:pointer}
  .alarm-row:hover{background:#f1f5f9}
  .alarm-row .c-src{font-weight:700;color:#334155}
  .alarm-row .c-rec{color:#dc2626;font-weight:700}
  .alarm-row .c-reason,.alarm-row .c-measure{color:#475569}
  .alarm-row .lvl{display:inline-block;font-size:10px;padding:1px 6px;border-radius:4px;margin-right:5px;vertical-align:middle;font-weight:700}
  .alarm-row .lvl.urg{background:#fef2f2;color:#dc2626}
  .alarm-row .lvl.imp{background:#fffbeb;color:#d97706}
  .alarm-row .lvl.nor{background:#eff6ff;color:#2563eb}
  .alarm-row .lvl.sev{background:#fef2f2;color:#b91c1c}
  .alarm-empty{padding:30px;text-align:center;color:#94a3b8;font-size:13px}
  .alarm-detail .row{display:grid;grid-template-columns:128px 1fr;gap:8px;padding:8px 0;border-bottom:1px dashed #e2e8f0;font-size:13px}
  .alarm-detail .row .k{color:#64748b;font-weight:600}
  .alarm-detail .row .v{color:#1e293b}
  .alarm-detail .row .v.danger{color:#dc2626;font-weight:700}
  .alarm-pill{background:#fef2f2;color:#dc2626;border:1px solid #fecaca;animation:blink 1.2s infinite;cursor:pointer;font-weight:600}
  .alarm-pill b{font-size:13px}
  /* ===== 能源驾驶舱（总览）· 暗蓝商务科技风 ===== */
  .cockpit{position:relative;color:#dbe7f5;border-radius:14px;padding:18px 18px 22px;overflow:hidden;
    background:
      radial-gradient(1100px 560px at 12% -12%,rgba(56,130,246,.20),transparent 60%),
      radial-gradient(900px 520px at 100% -4%,rgba(14,165,233,.16),transparent 55%),
      linear-gradient(160deg,#08182c 0%,#0a2236 46%,#07182a 100%);
    box-shadow:inset 0 0 0 1px rgba(120,170,230,.18),0 12px 44px rgba(0,0,0,.4)}
  .cockpit::before{content:"";position:absolute;inset:0;pointer-events:none;
    background-image:linear-gradient(rgba(120,170,230,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(120,170,230,.06) 1px,transparent 1px);
    background-size:34px 34px;mask:radial-gradient(circle at 50% -5%,#000,transparent 82%)}

    background:linear-gradient(90deg,#7dd3fc,#3b82f6,#a5b4fc);-webkit-background-clip:text;background-clip:text;color:transparent}
  .cockpit .cp-title .bar{display:inline-block;width:5px;height:22px;background:linear-gradient(#38bdf8,#2563eb);border-radius:3px;margin-right:11px;vertical-align:-3px}

  .cockpit .cp-pills{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
  .cockpit .cp-pill{font-size:11px;color:#bcd4ec;background:rgba(56,130,246,.14);border:1px solid rgba(120,170,230,.32);border-radius:20px;padding:4px 12px}
  .cockpit .cp-pill i{width:7px;height:7px;border-radius:50%;background:#34d399;display:inline-block;margin-right:5px;box-shadow:0 0 8px #34d399}
  .cockpit .card{background:linear-gradient(180deg,rgba(20,40,66,.66),rgba(12,28,48,.66));border:1px solid rgba(120,170,230,.2);box-shadow:0 6px 22px rgba(0,0,0,.28)}
  .cockpit .card .hd{border-bottom:1px solid rgba(120,170,230,.16)}

  .cockpit .kpi .lbl{color:#9fb8d2}
  .cockpit .kpi .val{color:#eaf3ff;text-shadow:0 0 18px rgba(56,130,246,.35)}
  .cockpit .kpi .val small{color:#9fb8d2}
  .cockpit .kpi .trend{color:#9fb8d2}
  .cockpit .up{color:#f87171}.cockpit .down{color:#34d399}

  .cockpit table.tb tr:hover td{background:rgba(56,130,246,.1)}
  .cockpit .chip{background:rgba(120,170,230,.14);color:#bcd4ec}
  .cockpit .chip.b{background:rgba(59,130,246,.2);color:#bcd4ff}
  .cockpit .chip.g{background:rgba(16,185,129,.16);color:#6ee7b7}
  .cockpit .chip.o{background:rgba(245,158,11,.16);color:#fcd34d}
  .cockpit .chip.r{background:rgba(239,68,68,.18);color:#fca5a5}
  .cockpit .bar{background:rgba(120,170,230,.12)}
  .cockpit .note{background:rgba(15,32,54,.6);border-color:rgba(120,170,230,.22);color:#9fb8d2}

  .cockpit .alarm{border-left-color:#f87171;background:rgba(239,68,68,.1);color:#fecaca}
  .cockpit .alarm.w{border-left-color:#fcd34d;background:rgba(245,158,11,.1);color:#fde68a}
  .cockpit .alarm b{color:#fff}

  .cockpit .chart-lbl{fill:#8fb0cc}

  .drill-row{cursor:pointer}
  .drill-row:hover{background:rgba(56,130,246,.08)!important}
/* ===== 参考界面统一主题：蓝色平台顶栏 / 浅灰导航 / 白色工作区 ===== */
:root{--bg:#f6f7f9;--main:#f6f7f9;--card:#fff;--ink:#303133;--sub:#606b7b;--accent:#3478f5;--chip:#f4f5f7;--line:#e9eaec;--shadow:none}
body{font-family:"Microsoft YaHei","Segoe UI",Arial,sans-serif}
.app{padding-top:60px;position:relative}

.content{padding:14px 16px 30px}.page-head{background:#fff;border-radius:4px;padding:16px;margin-bottom:14px}.page-head h2{font-size:18px;font-weight:500}.page-head p{font-size:12px;color:#909399}

<body>
<div class="app">

  </header>

    <nav class="nav" id="nav"></nav>

  </aside>

      <div class="crumb" id="crumb">能源驾驶舱 <span>/ 总览</span></div>

    </div>

  </div>
</div>
<div class="modal-mask" id="statModal" hidden>
  <div class="modal" role="dialog" aria-modal="true">
    <div class="modal-hd"><div><h3 id="statTitle"></h3><div class="sub" id="statSub"></div></div><button class="x" id="statClose" title="关闭 (Esc)">✕</button></div>
    <div class="modal-bd" id="statBody"></div>
  </div>
</div>
<script>
/* ============ 轻量 SVG 图表库（商务简约风） ============ */
const PALETTE=['#3b82f6','#10b981','#f59e0b','#8b5cf6','#0ea5e9','#ef4444','#64748b','#14b8a6'];
const NS='http://www.w3.org/2000/svg';
function fmtN(v){if(v==null)return'';if(Math.abs(v)>=10000)return(v/10000).toFixed(1)+'w';if(Number.isInteger(v))return v.toLocaleString();return(+v).toFixed(1);}
function hexA(hex,a){const n=parseInt(hex.slice(1),16);return `rgba(${(n>>16)&255},${(n>>8)&255},${n&255},${a})`;}
/* ============ 时间查询 · 数据模拟（按视图隔离的种子） ============ */
let RPT_SEEDS={};      // 各报表独立种子：id -> 种子（0/未查询=基准不扰动）
let CUR_RPT_VIEW=null; // 当前正在渲染的视图 id（供 J 取该视图种子）
function J(v,salt){ // 按当前视图种子确定性扰动（仅数值，非数值原样返回）
  const seed=RPT_SEEDS[CUR_RPT_VIEW]||0;
  if(seed===0||typeof v!=='number'||isNaN(v)) return v;
  let h=0; const s=String(salt)+'|'+seed;
  for(let i=0;i<s.length;i++) h=(h*31+s.charCodeAt(i))>>>0;
  return v*(0.85+((h%1001)/1000)*0.30); // 0.85~1.15
}
function Jarr(a,salt){return (a||[]).map((v,i)=>J(v,salt+'-'+i));}
function mkSeed(s,e){let h=0; const str=(s||'')+'~'+(e||'');
  for(let i=0;i<str.length;i++) h=(h*31+str.charCodeAt(i))>>>0; return (h>>>0)||1;}
/* ============ 数据穿透（柱状图点击 → 弹窗明细） ============ */
const DRILL_HTML={};   // 键: '<图标识>:<系列>:<标签>' -> 弹窗 HTML 正文
// 计划 vs 实际 月度穿透明细
function drillPlanRow(series, month, plan, act){
  const dev=act-plan, rate=plan?(act-plan)/plan*100:0, comp=plan&&act? plan/act*100:0;
  const ch=dev>0?'r':'g';
  return `<div class="kpi-mini">
    <div class="m"><div class="l">${month} · ${series}</div><div class="v">${plan.toLocaleString()}</div><div style="font-size:11px;color:#64748b">计划 tce</div></div>
    <div class="m"><div class="l">实际能耗</div><div class="v">${act.toLocaleString()}</div><div style="font-size:11px;color:#64748b">实际 tce</div></div>
    <div class="m"><div class="l">偏差</div><div class="v" style="color:${dev>0?'#ef4444':'#16a34a'}">${dev>0?'+':''}${dev.toLocaleString()}</div><div style="font-size:11px;color:#64748b">${rate>=0?'+':''}${rate.toFixed(1)}%</div></div></div>
    <table class="tb"><tr><th>月份</th><th>计划(tce)</th><th>实际(tce)</th><th>偏差(tce)</th><th>完成率</th></tr>
    <tr><td>${month}</td><td>${plan.toLocaleString()}</td><td>${act.toLocaleString()}</td><td><span class="chip ${ch}">${dev>0?'+':''}${dev.toLocaleString()}</span></td><td>${comp.toFixed(1)}%</td></tr></table>
    <div class="hint">${dev>0?'实际高于计划，需核查用能超支原因（负荷波动 / 单耗上升）；':'实际低于计划，能效控制良好；'}计划完成率 ${comp.toFixed(1)}%。可结合日计划细化至车间 / 装置定位偏差来源。</div>`;
}
function openBarDrill(key){
  const html=DRILL_HTML[key]||'<p style="color:#64748b">暂无数据穿透详情。</p>';
  document.getElementById('statTitle').textContent='数据穿透 · 明细';
  document.getElementById('statSub').textContent=key.replace(/:/g,' · ');
  document.getElementById('statBody').innerHTML=html;
  document.getElementById('statModal').hidden=false;
}
/* ============ 多层级能源计划编制 · 工作流状态 ============ */
let PLAN_FETCHED=false, PLAN_MADE=false, PLAN_DECOMPOSED=false, PLAN_TS='';
const PROD_PLAN_SRC=[ // 上级平台 SCOS / MES 下发的年度产品产量计划（模拟）
  {p:'麦芽糖浆',q:420000,se:127.3},{p:'果葡糖浆',q:310000,se:122.0},
  {p:'麦芽糊精',q:90000,se:118.0},{p:'食用酒精',q:90000,se:142.5},{p:'小包装成品',q:30000,se:146.0}
];
function barChart(o){const W=o.w||560,H=o.h||240,pL=8,pR=8,pT=28,pB=o.tall?46:30;
  const cW=W-pL-pR,cH=H-pT-pB,base=pT+cH,n=o.values.length,slot=cW/n,bw=slot*(o.bw||0.55);
  const maxv=(o.max||Math.max(...o.values))*1.15;
  const cols=o.colors||o.values.map((_,i)=>o.color||PALETTE[i%PALETTE.length]);
  let s=`<svg class="chart" viewBox="0 0 ${W} ${H}" xmlns="${NS}">`;
  for(let g=0;g<=4;g++){const y=pT+cH*g/4;const v=maxv*(1-g/4);
    s+=`<line x1="${pL}" y1="${y}" x2="${W-pR}" y2="${y}" class="chart-grid"/>`;
    if(o.axis!==false)s+=`<text x="${pL+2}" y="${y-2}" class="chart-lbl" font-size="9">${fmtN(v)}</text>`;}
  o.values.forEach((v,i)=>{const h=v/maxv*cH,x=pL+slot*i+(slot-bw)/2,y=base-h,c=cols[i];
    let rc=''; if(o.jump) rc=` class="bar-rect clickable" data-jump="${o.jump}" data-val="${i}"`; else if(o.drill) rc=` class="bar-rect clickable" data-bar="${o.drill}:${o.labels[i]}"`;
    s+=`<rect x="${x}" y="${y}" width="${bw}" height="${Math.max(h,1)}" rx="3" fill="${c}"${rc}/>`;
    if(o.valOnTop!==false)s+=`<text x="${x+bw/2}" y="${y-5}" text-anchor="middle" class="chart-val">${(o.fmt||fmtN)(v)}</text>`;
    s+=`<text x="${x+bw/2}" y="${base+14}" text-anchor="middle" class="chart-lbl">${o.labels[i]}</text>`;});
  if(o.ref!=null){const ry=base-o.ref/maxv*cH;
    s+=`<line x1="${pL}" y1="${ry}" x2="${W-pR}" y2="${ry}" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="5,3"/>`;
    s+=`<text x="${W-pR}" y="${ry-4}" text-anchor="end" fill="#ef4444" font-size="10" font-weight="700">${o.refLabel||''} ${o.ref}</text>`;}
  return s+'</svg>';}
function groupBar(o){const W=o.w||560,H=o.h||250,pL=8,pR=8,pT=32,pB=30;
  const cW=W-pL-pR,cH=H-pT-pB,base=pT+cH,n=o.labels.length,slot=cW/n;
  const series=o.series,ns=series.length,bw=slot*0.72/ns;
  const maxv=(o.max||Math.max(...series.flatMap(x=>x.values)))*1.15;
  let s=`<svg class="chart" viewBox="0 0 ${W} ${H}" xmlns="${NS}">`;
  for(let g=0;g<=4;g++){const y=pT+cH*g/4;s+=`<line x1="${pL}" y1="${y}" x2="${W-pR}" y2="${y}" class="chart-grid"/>`;}
  o.labels.forEach((lab,i)=>{const xc=pL+slot*i+slot/2-(ns*bw)/2;
    series.forEach((se,j)=>{const v=se.values[i],h=v/maxv*cH,x=xc+j*bw,y=base-h;
      s+=`<rect x="${x}" y="${y}" width="${bw-2}" height="${Math.max(h,1)}" rx="2" fill="${se.color}"${o.drill?` class="bar-rect clickable" data-bar="${o.drill}:${se.name}:${lab}"`:''}/>`;
      s+=`<text x="${x+(bw-2)/2}" y="${y-4}" text-anchor="middle" class="chart-val" font-size="9" fill="${se.color}">${(se.fmt||fmtN)(v)}</text>`;});
    s+=`<text x="${pL+slot*i+slot/2}" y="${base+14}" text-anchor="middle" class="chart-lbl">${lab}</text>`;});
  let lx=pL;series.forEach(se=>{s+=`<rect x="${lx}" y="6" width="10" height="10" rx="2" fill="${se.color}"/><text x="${lx+14}" y="15" class="chart-lbl">${se.name}</text>`;lx+=14+se.name.length*11+18;});
  return s+'</svg>';}
function lineChart(o){const W=o.w||560,H=o.h||240,pL=36,pR=12,pT=20,pB=30;
  const cW=W-pL-pR,cH=H-pT-pB,base=pT+cH,n=o.labels.length;
  const series=o.series||[{values:o.values,color:o.color||PALETTE[0],name:o.name}];
  const maxv=(o.max||Math.max(...series.flatMap(x=>x.values)))*1.12;
  const minv=o.min!=null?o.min:0;
  let s=`<svg class="chart" viewBox="0 0 ${W} ${H}" xmlns="${NS}">`;
  for(let g=0;g<=4;g++){const y=pT+cH*g/4;const v=minv+(maxv-minv)*(1-g/4);
    s+=`<line x1="${pL}" y1="${y}" x2="${W-pR}" y2="${y}" class="chart-grid"/>`;
    s+=`<text x="${pL-4}" y="${y+3}" text-anchor="end" class="chart-lbl" font-size="9">${fmtN(v)}</text>`;}
  const X=i=>pL+(n===1?cW/2:cW*i/(n-1)),Y=v=>base-(v-minv)/(maxv-minv)*cH;
  series.forEach(se=>{const pts=se.values.map((v,i)=>`${X(i)},${Y(v)}`).join(' ');
    if(o.area)s+=`<polygon points="${pL},${base} ${pts} ${X(n-1)},${base}" fill="${hexA(se.color,.12)}"/>`;
    s+=`<polyline points="${pts}" fill="none" stroke="${se.color}" stroke-width="2.2" stroke-linejoin="round"/>`;
    se.values.forEach((v,i)=>{s+=`<circle cx="${X(i)}" cy="${Y(v)}" r="${o.jump?5:3}" fill="#fff" stroke="${se.color}" stroke-width="2"${o.jump?` class="dot clickable" data-jump="${o.jump}" data-val="${i}" style="cursor:pointer"`:''}/>`;
      if(o.showVal)s+=`<text x="${X(i)}" y="${Y(v)-7}" text-anchor="middle" class="chart-val" font-size="9" fill="${se.color}">${(se.fmt||fmtN)(v)}</text>`;});});
  o.labels.forEach((lab,i)=>{s+=`<text x="${X(i)}" y="${base+14}" text-anchor="middle" class="chart-lbl">${lab}</text>`;});
  if(o.ref!=null){const ry=Y(o.ref);
    s+=`<line x1="${pL}" y1="${ry}" x2="${W-pR}" y2="${ry}" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="5,3"/>`;
    s+=`<text x="${W-pR}" y="${ry-4}" text-anchor="end" fill="#ef4444" font-size="10" font-weight="700">${o.refLabel||''} ${o.ref}</text>`;}
  if(series.length>1||o.name){let lx=pL;series.forEach(se=>{if(!se.name)return;
    s+=`<line x1="${lx}" y1="10" x2="${lx+16}" y2="10" stroke="${se.color}" stroke-width="2.5"/><text x="${lx+20}" y="14" class="chart-lbl">${se.name}</text>`;lx+=20+se.name.length*11+16;});}
  return s+'</svg>';}
function donut(o){const S=o.size||180,cx=104,cy=S/2+6,r=62,ir=40;
  const total=o.items.reduce((a,b)=>a+b.value,0);let a0=-Math.PI/2;
  let s=`<svg class="chart" viewBox="0 0 ${S+150} ${S+14}" xmlns="${NS}" style="max-width:${S+150}px">`;
  o.items.forEach((it,i)=>{const frac=it.value/total,a1=a0+frac*Math.PI*2,c=it.color||PALETTE[i%PALETTE.length];
    const large=frac>0.5?1:0;
    const x0=cx+r*Math.cos(a0),y0=cy+r*Math.sin(a0),x1=cx+r*Math.cos(a1),y1=cy+r*Math.sin(a1);
    const xi1=cx+ir*Math.cos(a1),yi1=cy+ir*Math.sin(a1),xi0=cx+ir*Math.cos(a0),yi0=cy+ir*Math.sin(a0);
    s+=`<path d="M${x0},${y0} A${r},${r} 0 ${large} 1 ${x1},${y1} L${xi1},${yi1} A${ir},${ir} 0 ${large} 0 ${xi0},${yi0} Z" fill="${c}"${o.jump?` class="clickable" data-jump="${o.jump}" data-val="${i}"`:''}/>`;a0=a1;});
  s+=`<text x="${cx}" y="${cy-2}" text-anchor="middle" font-size="14" font-weight="700" fill="#1e293b">${o.center||''}</text>`;
  s+=`<text x="${cx}" y="${cy+14}" text-anchor="middle" font-size="10" fill="#64748b">${o.centerSub||''}</text>`;
  let ly=18;o.items.forEach((it,i)=>{const c=it.color||PALETTE[i%PALETTE.length];
    const lbl=o.pct?`${(it.value/total*100).toFixed(1)}%`:`${(o.fmt||fmtN)(it.value)}${o.unit||''}`;
    s+=`<rect x="${S+8}" y="${ly-8}" width="9" height="9" rx="2" fill="${c}"/><text x="${S+21}" y="${ly}" class="chart-lbl">${it.name} ${lbl}</text>`;ly+=18;});
  return s+'</svg>';}

function scatterChart(o){const W=o.w||560,H=o.h||240,pL=42,pR=12,pT=18,pB=30;
  const cW=W-pL-pR,cH=H-pT-pB,base=pT+cH;
  const pts=o.points||[];
  const xs=pts.map(p=>p.x),ys=pts.map(p=>p.y);
  const maxx=(o.maxx||Math.max(...xs))*1.06, minx=(o.minx!=null)?o.minx:Math.min(...xs)*0.94;
  const maxy=(o.maxy||Math.max(...ys))*1.1, miny=(o.miny!=null)?o.miny:0;
  const X=x=>pL+(x-minx)/(maxx-minx)*cW, Y=y=>base-(y-miny)/(maxy-miny)*cH;
  let s=`<svg class="chart" viewBox="0 0 ${W} ${H}" xmlns="${NS}">`;
  for(let g=0;g<=4;g++){const y=pT+cH*g/4;s+=`<line x1="${pL}" y1="${y}" x2="${W-pR}" y2="${y}" class="chart-grid"/>`;
    const v=miny+(maxy-miny)*(1-g/4);s+=`<text x="${pL-4}" y="${y+3}" text-anchor="end" class="chart-lbl" font-size="9">${(+v).toFixed(0)}</text>`;}
  // 线性回归趋势线
  if(o.trend&&pts.length>1){let n=pts.length,sx=0,sy=0,sxy=0,sxx=0;
    pts.forEach(p=>{sx+=p.x;sy+=p.y;sxy+=p.x*p.y;sxx+=p.x*p.x;});
    const d=n*sxx-sx*sx;const slope=d? (n*sxy-sx*sy)/d:0;const inter=(sy-slope*sx)/n;
    const x0=minx,x1=maxx,y0=inter+slope*x0,y1=inter+slope*x1;
    s+=`<line x1="${X(x0)}" y1="${Y(y0)}" x2="${X(x1)}" y2="${Y(y1)}" stroke="#0ea5e9" stroke-width="1.8" stroke-dasharray="6,3"/>`;
    let ssTot=0,ssRes=0,my=sy/n;pts.forEach(p=>{const pred=inter+slope*p.x;ssRes+=(p.y-pred)**2;ssTot+=(p.y-my)**2;});
    const r2=ssTot? (1-ssRes/ssTot):0;
    s+=`<text x="${pL+6}" y="${pT+12}" class="chart-val" font-size="10" fill="#0ea5e9">R²=${r2.toFixed(2)}　斜率=${slope.toFixed(3)}</text>`;}
  s+=`<text x="${pL+cW/2}" y="${H-6}" text-anchor="middle" class="chart-lbl">${o.xLabel||''}</text>`;
  s+=`<text x="13" y="${pT+cH/2}" text-anchor="middle" class="chart-lbl" transform="rotate(-90 13 ${pT+cH/2})">${o.yLabel||''}</text>`;
  pts.forEach(p=>{const c=p.color||PALETTE[0];
    s+=`<circle cx="${X(p.x)}" cy="${Y(p.y)}" r="${o.r||4.5}" fill="${hexA(c,.55)}" stroke="${c}" stroke-width="1.3"/>`;
    if(p.lab)s+=`<text x="${X(p.x)}" y="${Y(p.y)-7}" text-anchor="middle" class="chart-lbl" font-size="8">${p.lab}</text>`;});
  return s+'</svg>';}
/* ============ 能源流向图（内联 SVG · 动态流动 · 离线自包含） ============ */
function flowDiagram(cfg){
  const uid=cfg.uid, color=cfg.color, cons=cfg.consumers;
  const mmap=cfg.meterMap||null;
  const mget=l=>mmap?(mmap[l]||null):null;
  // 公共绘图原语
  function pipe(id,d,noArrow){
    const me=noArrow?'':` marker-end="url(#arr-${uid})"`;
    return `<path id="${uid}-${id}" d="${d}" fill="none" stroke="${color}" stroke-opacity=".20" stroke-width="7" stroke-linecap="round"/>`
      +`<path d="${d}" fill="none" stroke="${color}" stroke-width="3.2" stroke-linecap="round" class="pipe-flow"${me}/>`
      +`<circle class="flow-dot" r="3.6" fill="#fff" filter="url(#glow-${uid})"><animateMotion dur="1.3s" repeatCount="indefinite" rotate="auto"><mpath href="#${uid}-${id}"/></animateMotion></circle>`;
  }
  function node(x,y,w,h,label,sub,val,big,sub2,meter){
    const f1=v=>(Math.round(v*10)/10).toFixed(1);
    let s=`<g>`;
    if(big)s+=`<rect x="${x-5}" y="${y-5}" width="${w+10}" height="${h+10}" rx="13" fill="none" stroke="${color}" stroke-opacity=".55" stroke-width="1.6" class="pipe-halo"/>`;
    s+=`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="10" fill="#0f2c44" stroke="${color}" stroke-width="1.7"/>`;
    const cy=y+h/2;
    s+=`<text x="${x+w/2}" y="${cy-(sub||val||sub2?9:0)}" text-anchor="middle" fill="#eaf4ff" font-size="${big?14:13}" font-weight="700" font-family="inherit">${label}</text>`;
    if(sub)s+=`<text x="${x+w/2}" y="${cy+9}" text-anchor="middle" fill="#9fc6e6" font-size="10.5" font-family="inherit">${sub}</text>`;
    if(val)s+=`<text x="${x+w/2}" y="${cy+9}" text-anchor="middle" fill="${color}" font-size="11" font-weight="700" font-family="inherit">${val}</text>`;
    if(sub2)s+=`<text x="${x+w/2}" y="${cy+24}" text-anchor="middle" fill="#9fc6e6" font-size="10.5" font-family="inherit">${sub2}</text>`;
    if(meter){
      const base=(meter.base!=null)?meter.base:0, unit=meter.unit||'';
      const mTag=meter.tag||'', mName=meter.name||label, mMed=meter.medium||'';
      s+=`<title>${mName}　位号 ${mTag}　介质 ${mMed}</title>`;
      s+=`<circle class="meter-dot" data-tag="${mTag}" data-name="${mName}" data-medium="${mMed}" data-base="${base}" cx="${x+w-7}" cy="${y+7}" r="3.2" fill="#22c55e" stroke="#0a1a2e" stroke-width="1"><animate attributeName="opacity" values="1;0.35;1" dur="1.6s" repeatCount="indefinite"/></circle>`;
      s+=`<rect x="${x-4}" y="${y+h+5}" width="${w+8}" height="15" rx="4" fill="#0c1c2e" stroke="#1f3a52"/>`;
      s+=`<text class="meter-val" data-tag="${mTag}" data-name="${mName}" data-medium="${mMed}" data-base="${base}" data-unit="${unit}" x="${x+w/2}" y="${y+h+16}" text-anchor="middle" fill="#7ee0a8" font-size="9.5" font-family="inherit">${f1(base)} ${unit}</text>`;
    }
    s+=`</g>`; return s;
  }
  const head=`<text x="28" y="40" fill="${color}" font-size="15.5" font-weight="700" font-family="inherit">${cfg.icon||'◆'} ${cfg.title}</text>`
    +`<text x="28" y="58" fill="#9fc6e6" font-size="11" font-family="inherit">${cfg.subtitle||''}</text>`;
  const svgOpen=(W,H)=>`<svg class="energy-flow" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet" xmlns="${NS}" role="img" aria-label="${cfg.title}">`
    +`<defs>`
    +`<linearGradient id="bg-${uid}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0c2236"/><stop offset="1" stop-color="#081726"/></linearGradient>`
    +`<marker id="arr-${uid}" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L6,3 L0,6 Z" fill="${color}"/></marker>`
    +`<filter id="glow-${uid}" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="2.3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>`
    +`</defs>`
    +`<rect x="0" y="0" width="${W}" height="${H}" fill="url(#bg-${uid})"/>`;
  const wrap=(W,H,body)=>svgOpen(W,H)+`<g class="zoom-layer">`+head+body+`</g></svg>`;
  const maxKids=cons.reduce((m,c)=>Math.max(m,(c.children||[]).length),0);
  const subHubCount=cons.filter(c=>(c.children||[]).length>0).length;

  // ===== 多车道布局（母线并联 / busbar）：≥2 个系统各带工序链（电/水/蒸汽） =====
  if(subHubCount>=2){
    const GAP=25;                       // 矩形之间统一间距 25px
    const boxW=140, boxH=32, headH=42;
    const childOffsetX=40;              // 父 → 子列横向偏移（父在上方，x 重叠不可见）
    const busY=150, dropLen=46;
    const sysStartX=454;
    const n=cons.length;
    const sysRowY=busY+dropLen;
    const srcX=24, srcW=168, srcH=76, srcY=busY-srcH/2;
    const hasHub=!!cfg.hub;
    const hubX=hasHub?224:srcX+srcW, hubW=hasHub?186:0;
    const hubH=hasHub?Math.min(150,64+n*6):0;
    const hubY=hasHub?busY-hubH/2:busY;
    const busStartX=hasHub?(hubX+hubW):(srcX+srcW);
    let pipes='', nodes='';
    let pid=0;
    const P=(d,noArrow)=>{ pipes+=pipe('q'+(pid++),d,noArrow); };
    // 递归：求子树占位（相对节点左上角）。列宽=列内各子树最大右展；列内行高按子树高度顺延
    function extent(node, nodeH){
      if(!node.children||!node.children.length) return {r:boxW, b:nodeH};
      const kn=node.children.length;
      const cols=kn>8?2:1;
      const perCol=Math.ceil(kn/cols);
      const colW=[], colH=[];
      for(let c=0;c<cols;c++){colW.push(0);colH.push(0);}
      node.children.forEach((ch,i)=>{
        const c=Math.floor(i/perCol);
        const e=extent(ch, boxH);
        if(e.r>colW[c])colW[c]=e.r;
        colH[c]+=e.b+GAP;
      });
      let off=childOffsetX, r=0, h=0;
      for(let c=0;c<cols;c++){
        if(off+colW[c]>r)r=off+colW[c];
        colH[c]-=GAP;
        if(colH[c]>h)h=colH[c];
        off+=colW[c]+GAP;
      }
      return {r:Math.max(boxW,r), b:nodeH+GAP+h};
    }
    // 递归：渲染 children（脊线+水平支线）；>8 项分 2 列；列/行均按子树占位顺延，保证 25px 间距不重叠
    function renderSub(parentX, parentY, pH, children){
      if(!children||!children.length) return;
      const kn=children.length;
      const cols=kn>8?2:1;
      const perCol=Math.ceil(kn/cols);
      const exts=children.map(ch=>extent(ch, boxH));
      const colW=[]; for(let c=0;c<cols;c++)colW.push(0);
      children.forEach((ch,i)=>{const c=Math.floor(i/perCol); if(exts[i].r>colW[c])colW[c]=exts[i].r;});
      const colX=[]; let off=parentX+childOffsetX;
      for(let c=0;c<cols;c++){colX[c]=off; off+=colW[c]+GAP;}
      const spineX=parentX+10;
      const cursor=[]; for(let c=0;c<cols;c++)cursor[c]=parentY+pH+GAP;
      let maxBranch=parentY+pH;
      children.forEach((ch,i)=>{
        const c=Math.floor(i/perCol);
        const cx=colX[c], cy=cursor[c];
        cursor[c]=cy+exts[i].b+GAP;
        if(cy+boxH/2>maxBranch)maxBranch=cy+boxH/2;
        P(`M${spineX},${cy+boxH/2} L${cx},${cy+boxH/2}`);
        nodes+=node(cx, cy, boxW, boxH, ch.label, ch.sub||'', ch.val||'', false, null, mget(ch.label));
        if(ch.children&&ch.children.length) renderSub(cx, cy, boxH, ch.children);
      });
      P(`M${spineX},${parentY+pH} L${spineX},${maxBranch}`);
    }
    // 计算各顶层子枢纽的子树占位，并顺序排布（避免相邻子树重叠）
    const extents=cons.map(c=>extent(c, headH));
    const headX=[]; let curX=sysStartX;
    cons.forEach((c,i)=>{ headX[i]=curX; curX+=extents[i].r+GAP; });
    const maxBottom=Math.max(...extents.map(e=>e.b));
    const H=sysRowY+maxBottom+46;
    const maxRight=Math.max(...cons.map((c,i)=>headX[i]+extents[i].r));
    const W=maxRight+48;
    const busEndX=Math.max(headX[n-1]+boxW, maxRight);
    // 源 → 枢纽（仅当有 hub 时）
    if(hasHub) P(`M${srcX+srcW},${busY} C${(srcX+srcW+hubX)/2},${busY} ${(srcX+srcW+hubX)/2},${busY} ${hubX},${busY}`);
    // 母线（busbar，无箭头）
    P(`M${busStartX},${busY} L${busEndX},${busY}`, true);
    // 各子枢纽：竖向下支 + 子枢纽节点 + 子树
    cons.forEach((c,i)=>{
      const x=headX[i];
      const cx=x+boxW/2;
      P(`M${cx},${busY} L${cx},${sysRowY}`);
      nodes+=node(x, sysRowY, boxW, headH, c.label, c.sub||'', c.val||'', true, null, mget(c.label));
      if(c.children&&c.children.length) renderSub(x, sysRowY, headH, c.children);
    });
    nodes+=node(srcX, srcY, srcW, srcH, cfg.source.label, cfg.source.sub, '', true, null, mget(cfg.source.label));
    if(hasHub) nodes+=node(hubX, hubY, hubW, hubH, cfg.hub.label, cfg.hub.sub, cfg.hub.val, true, cfg.hub.sub2, mget(cfg.hub.label));
    return wrap(W, H, pipes+nodes);
  }

  // ===== 平面布局（供水/蒸汽，无子枢纽；或单一子枢纽分支） =====
  const rowH=52, topPad=74, botPad=40, boxW=146, boxH=44;
  const kidCols=maxKids>12?3:maxKids>6?2:1;
  const kidGapX=64, topX=512;
  const kidBaseX=topX+boxW+kidGapX;
  const kidColX=[]; for(let k=0;k<kidCols;k++)kidColX.push(kidBaseX+k*(boxW+kidGapX));
  const kidPerCol=Math.ceil(maxKids/kidCols);
  const needH=Math.max(cons.length,kidPerCol);
  const H=Math.max(360, topPad+(needH-1)*rowH+boxH+botPad);
  const W=(kidCols?kidColX[kidCols-1]+boxW:topX+boxW)+24;
  const srcX=24, srcW=168, srcH=76, srcY=H/2-srcH/2;
  const hubX=296, hubW=190, hubH=Math.min(170,64+cons.length*6), hubY=H/2-hubH/2;
  const pos=cons.map((c,i)=>({x:topX,y:topPad+i*rowH,label:c.label,sub:c.sub||'',val:c.val||'',children:c.children||null}));
  const midY=p=>p.y+boxH/2;
  let pipes='', nodes='';
  const d0=`M${srcX+srcW},${H/2} C${(srcX+srcW+hubX)/2},${H/2} ${(srcX+srcW+hubX)/2},${hubY+hubH/2} ${hubX},${hubY+hubH/2}`;
  pipes+=pipe('p0',d0);
  let pi=1;
  pos.forEach(p=>{
    const d=`M${hubX+hubW},${hubY+hubH/2} C${(hubX+hubW+p.x)/2},${hubY+hubH/2} ${(hubX+hubW+p.x)/2},${midY(p)} ${p.x},${midY(p)}`;
    pipes+=pipe('p'+(pi++),d);
    if(p.children&&p.children.length){
      const per=kidPerCol, startY=midY(p)-(per-1)*rowH/2-boxH/2;
      p.children.forEach((ch,j)=>{
        const col=Math.floor(j/per), r=j%per;
        const cx=kidColX[col], cy=startY+r*rowH;
        const d2=`M${p.x+boxW},${midY(p)} C${(p.x+boxW+cx)/2},${midY(p)} ${(p.x+boxW+cx)/2},${cy+boxH/2} ${cx},${cy+boxH/2}`;
        pipes+=pipe('p'+(pi++),d2);
        nodes+=node(cx,cy,boxW,boxH,ch.label,ch.sub||'',ch.val||'',false,null,mget(ch.label));
      });
    }
  });
  nodes+=node(srcX,srcY,srcW,srcH,cfg.source.label,cfg.source.sub,'',true,null,mget(cfg.source.label));
  nodes+=node(hubX,hubY,hubW,hubH,cfg.hub.label,cfg.hub.sub,cfg.hub.val,true,cfg.hub.sub2,mget(cfg.hub.label));
  pos.forEach(p=>nodes+=node(p.x,p.y,boxW,boxH,p.label,p.sub,p.val,!!p.children,null,mget(p.label)));
  return wrap(W,H,pipes+nodes);
}
/* ============ 能流图缩放 / 平移控制（滚轮缩放 + 拖拽平移 + 工具条） ============ */
function initFlowZoom(root){
  root=root||document;
  const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
  function apply(svg){
    const z=svg._z, layer=svg.querySelector('.zoom-layer');
    if(layer)layer.setAttribute('transform',`translate(${z.tx} ${z.ty}) scale(${z.s})`);
    const pct=svg.closest('.flow-img-wrap')?.querySelector('.zp');
    if(pct)pct.textContent=Math.round(z.s*100)+'%';
  }
  function zoomAt(svg,f,cx,cy){
    const vb=svg.viewBox.baseVal, z=svg._z;
    const ns=clamp(z.s*f,0.5,6), k=ns/z.s;
    z.tx=cx-(cx-z.tx)*k; z.ty=cy-(cy-z.ty)*k; z.s=ns; apply(svg);
  }
  root.querySelectorAll('.energy-flow').forEach(svg=>{
    if(svg._zInited)return; svg._zInited=true;
    svg._z={s:1,tx:0,ty:0};
    svg.addEventListener('wheel',e=>{
      e.preventDefault();
      const r=svg.getBoundingClientRect();
      const mx=(e.clientX-r.left)/r.width*vb(svg).width;
      const my=(e.clientY-r.top)/r.height*vb(svg).height;
      zoomAt(svg,e.deltaY<0?1.12:1/1.12,mx,my);
    },{passive:false});
    let drag=false,lx=0,ly=0;
    svg.addEventListener('pointerdown',e=>{drag=true;lx=e.clientX;ly=e.clientY;svg.setPointerCapture(e.pointerId);});
    svg.addEventListener('pointermove',e=>{
      if(!drag)return;
      const r=svg.getBoundingClientRect(),v=svg.viewBox.baseVal;
      svg._z.tx+=(e.clientX-lx)/r.width*v.width;
      svg._z.ty+=(e.clientY-ly)/r.height*v.height;
      lx=e.clientX;ly=e.clientY;apply(svg);
    });
    const end=()=>{drag=false;};
    svg.addEventListener('pointerup',end);
    svg.addEventListener('pointercancel',end);
    // 工具条
    const wrap=svg.closest('.flow-img-wrap')||svg.parentElement;
    const bar=document.createElement('div');
    bar.className='flow-zoombar';
    bar.innerHTML='<button data-act="out" title="缩小">－</button><span class="zp">100%</span><button data-act="in" title="放大">＋</button><button class="reset" data-act="reset" title="复位视图">复位</button>';
    bar.querySelector('[data-act="in"]').onclick=()=>{const v=svg.viewBox.baseVal;zoomAt(svg,1.25,v.width/2,v.height/2);};
    bar.querySelector('[data-act="out"]').onclick=()=>{const v=svg.viewBox.baseVal;zoomAt(svg,1/1.25,v.width/2,v.height/2);};
    bar.querySelector('[data-act="reset"]').onclick=()=>{svg._z={s:1,tx:0,ty:0};apply(svg);};
    wrap.insertBefore(bar,svg);
  });
  function vb(svg){return svg.viewBox.baseVal;}
}
function spark(values,color,w,h){w=w||120;h=h||34;color=color||PALETTE[0];
  const max=Math.max(...values),min=Math.min(...values),rg=(max-min)||1;
  const pts=values.map((v,i)=>`${(w-4)*i/(values.length-1)+2},${h-4-((v-min)/rg)*(h-8)}`).join(' ');
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" xmlns="${NS}"><polyline points="${pts}" fill="none" stroke="${color}" stroke-width="2" stroke-linejoin="round"/></svg>`;}

function buildForecast(mode){
  const shape=[0.45,0.40,0.38,0.38,0.42,0.55,0.78,0.95,1.0,0.98,0.92,0.80,0.70,0.78,0.95,1.0,0.97,0.90,0.82,0.72,0.62,0.55,0.50,0.47];
  if(mode==='prod'){
    const Q=1850, e0=66.4;                       // 日计划产量(t) × 单位产品电耗基准(kWh/t)
    const daily=Q*e0, avg=daily/24;
    const shapeMean=shape.reduce((a,b)=>a+b,0)/shape.length;
    const fc=shape.map(s=>Math.round(avg*s/shapeMean));
    return {fc, peak:Math.max(...fc),
      formula:'日电量 = 日计划产量 × 单位产品电耗基准 = '+Q+' t × '+e0+' kWh/t = '+(daily/1000).toFixed(1)+' MWh；24h 负荷 = 日电量 ÷ 24 × 归一化时段负荷形态系数',
      note:'依据 MES 下发的日生产作业计划（今日计划产量 '+Q+' t）与单位产品电耗基准推算全天电量，再按典型两班制负荷形态展开至 24 小时。'};
  }
  const eq=[['冰机系统 X5210',900,0.92],['螺杆空压机 C5302/C5306',780,0.85],['MVR 压缩风机',1400,0.88],
    ['蒸发浓缩装置',650,0.80],['干燥/包装系统',900,0.78],['公用水/循环水',600,0.70]];
  const base=650;
  const fc=shape.map(s=>{ let p=base; eq.forEach(([n,r,k])=>{ p+=r*k*(0.6+0.4*s); }); return Math.round(p); });
  return {fc, peak:Math.max(...fc),
    formula:'24h 负荷 = 基础负荷 + Σ(设备额定功率 × 同时系数 × 时段运行系数)',
    note:'依据各重点耗能设备额定功率、同时系数与当日运行排程（时段运行系数随两班制负荷形态变化）逐时累加推算。'};
}

report_device(){
  const factors={electricity:.0001229,steam:.0941};
  const source=[
    ['液化装置','DH-01',62000,1200,18000,6800,18.2,'甲班'],
    ['糖化装置','DH-02',38000,380,14000,5200,8.2,'乙班'],
    ['蒸发装置','DH-03',88000,1980,12000,4600,41.5,'甲班'],
    ['异构装置','DH-04',36000,540,8000,4100,14.2,'乙班'],
    ['色谱分离装置','DH-05',52000,280,11000,3900,8.8,'丙班'],
    ['浓缩装置','DH-06',44000,980,14000,7200,14.5,'甲班'],
    ['成品调配装置','DH-07',28000,160,6000,6500,3.1,'丙班']
  ];
  const data=source.map(x=>{const [name,tag,e,s,w,out,target,team]=x;const energy=e*factors.electricity+s*factors.steam,unit=energy*1000/out;return {name,tag,e,s,w,out,target,team,energy,unit,deviation:(unit/target-1)*100};});
  const sum=k=>data.reduce((n,d)=>n+d[k],0), total=sum('energy'), electric=sum('e')*factors.electricity, steam=sum('s')*factors.steam;
  const ok=data.filter(d=>d.deviation<=0).length, high=data.filter(d=>d.deviation>0).length;
  const sorted=[...data].sort((a,b)=>b.energy-a.energy), max=sorted[0].energy;
  const link=d=>'device-report:'+d.tag;
  data.forEach(d=>{DRILL_HTML[link(d)]=`<div class="kpi-mini"><div class="m"><div class="l">装置综合能耗</div><div class="v">${d.energy.toFixed(2)} tce</div></div><div class="m"><div class="l">工序单耗</div><div class="v">${d.unit.toFixed(2)} kgce/t</div></div><div class="m"><div class="l">单耗目标</div><div class="v">${d.target.toFixed(2)} kgce/t</div></div></div><table class="tb"><tr><th>介质</th><th>实物消耗</th><th>折标系数</th><th>折标能耗</th></tr><tr><td>电力</td><td>${d.e.toLocaleString()} kWh</td><td>0.1229 kgce/kWh</td><td>${(d.e*factors.electricity).toFixed(2)} tce</td></tr><tr><td>蒸汽</td><td>${d.s.toLocaleString()} t</td><td>0.0941 tce/t</td><td>${(d.s*factors.steam).toFixed(2)} tce</td></tr><tr><td>新水</td><td>${d.w.toLocaleString()} m³</td><td>单列管理</td><td>不计入本页综合能耗</td></tr></table><p style="margin-top:14px;color:#606266;font-size:12px">工序产出 ${d.out.toLocaleString()} t；责任班组 ${d.team}。以上为演示核算数据，折标系数为演示配置值。</p>`;});
  const rank=sorted.map((d,i)=>`<button class="dr-rank" data-bar="${link(d)}"><span class="dr-rank-index">${i+1}</span><span>${d.name.replace('装置','')}</span><span class="dr-track"><i style="width:${d.energy/max*100}%"></i></span><b>${d.energy.toFixed(1)}</b></button>`).join('');
  const deviation=data.map(d=>`<button class="dr-deviation" data-bar="${link(d)}"><span>${d.name.replace('装置','')}</span><span class="dr-deviation-axis"><i class="${d.deviation>0?'over':'under'}" style="width:${Math.min(48,Math.abs(d.deviation)*5)}%;${d.deviation>0?'left:50%':'right:50%'}"></i></span><b class="${d.deviation>0?'dr-red':'dr-green'}">${d.deviation>0?'+':''}${d.deviation.toFixed(1)}%</b></button>`).join('');
  const mix=donut({items:[{name:'蒸汽',value:steam,color:'#3478f5'},{name:'电力',value:electric,color:'#19b7a0'}],center:total.toFixed(1),centerSub:'综合能耗 / tce',pct:true});
  const rows=data.map((d,i)=>`<tr><td><span class="dr-device-name">${d.name}</span><small>${d.tag}</small></td><td>${d.e.toLocaleString()}</td><td>${d.s.toLocaleString()}</td><td>${d.w.toLocaleString()}</td><td><b>${d.energy.toFixed(2)}</b></td><td>${d.out.toLocaleString()}</td><td>${d.unit.toFixed(2)}</td><td>${d.target.toFixed(2)}</td><td class="${d.deviation>0?'dr-red':'dr-green'}">${d.deviation>0?'+':''}${d.deviation.toFixed(1)}%</td><td><span class="dr-state ${d.deviation>0?'over':'under'}">${d.deviation>0?'超目标':'达标'}</span></td><td>${d.team}</td><td><button class="dr-detail" data-bar="${link(d)}">明细 ↗</button></td></tr>`).join('');
  return `<div class="dr-report">
    <div class="dr-kpis">
      <div class="dr-metric"><span>装置综合能耗 <em>tce</em></span><b>${total.toFixed(1)}</b><small>电力、蒸汽折标汇总</small></div>
      <div class="dr-metric"><span>累计用电量 <em>万kWh</em></span><b>${(sum('e')/10000).toFixed(2)}</b><small>覆盖 ${data.length} 套工艺装置</small></div>
      <div class="dr-metric"><span>累计蒸汽消耗 <em>t</em></span><b>${sum('s').toLocaleString()}</b><small>蒸汽折标占比 ${(steam/total*100).toFixed(1)}%</small></div>
      <div class="dr-metric"><span>装置单耗达标率 <em>%</em></span><b>${(ok/data.length*100).toFixed(1)}</b><small><i class="dr-green">${ok} 套达标</i>　<i class="dr-red">${high} 套超目标</i></small></div>
    </div>
    <div class="dr-charts">
      <section class="dr-panel"><div class="dr-head"><h3>装置能耗排名</h3><span>tce · 由高到低</span></div><div class="dr-ranks">${rank}</div></section>
      <section class="dr-panel"><div class="dr-head"><h3>单耗目标偏差</h3><span><i class="dr-green">低于目标</i> ← 0 → <i class="dr-red">超目标</i></span></div><div class="dr-deviations">${deviation}</div></section>
      <section class="dr-panel"><div class="dr-head"><h3>用能介质结构</h3><span>折标口径</span></div><div class="dr-donut">${mix}</div><div class="dr-mix-foot"><span>新水取用量</span><b>${sum('w').toLocaleString()} <small>m³</small></b></div></section>
    </div>
    <section class="dr-panel dr-table-panel"><div class="dr-head"><h3>装置能耗核算明细</h3><span>2026年07月 · 演示数据 · ${data.length} 套装置</span></div><div class="dr-table-wrap"><table class="dr-table"><thead><tr><th>装置 / 位号</th><th>电量(kWh)</th><th>蒸汽(t)</th><th>新水(m³)</th><th>综合(tce)</th><th>工序产出(t)</th><th>单耗(kgce/t)</th><th>目标(kgce/t)</th><th>目标偏差</th><th>判定</th><th>班组</th><th>操作</th></tr></thead><tbody>${rows}</tbody><tfoot><tr><td>合计 / 整体</td><td>${sum('e').toLocaleString()}</td><td>${sum('s').toLocaleString()}</td><td>${sum('w').toLocaleString()}</td><td>${total.toFixed(2)}</td><td>—</td><td>—</td><td>—</td><td>—</td><td>${ok} / ${data.length} 达标</td><td>—</td><td>—</td></tr></tfoot></table></div></section>
  </div>`;
},

report_cost(){

/* ============ 报警中心 · 实时报警汇总（设备 + 计量网络） ============ */
const DM_THR=1.08, METER_THR=1.15;          // 设备主参数 / 计量点 超基准比例即报警
let ALARM_SEQ=0, ALARM_LIVE_SEQ=-1;
const ALARMS=[], ALARM_ON={}, ALARM_KEYS={};
/* 实时报警滚动：固定速度（px/s），匀速、可悬停暂停、无缝循环 */
const ALARM_SCROLL_SPEED=26;                // 固定滚动速度（像素/秒）
let alarmScrollY=0, alarmScrollPause=false, alarmScrollRAF=null, alarmScrollBound=false;
function startAlarmScroll(){
  const tl=document.getElementById('alarmLive'); if(!tl) return;
  if(!alarmScrollBound){                     // 仅绑定一次悬停暂停
    tl.addEventListener('mouseenter',()=>alarmScrollPause=true);
    tl.addEventListener('mouseleave',()=>alarmScrollPause=false);
    alarmScrollBound=true;
  }
  if(alarmScrollRAF) return;                 // 已在运行
  let last=performance.now();
  function step(now){
    const el=document.getElementById('alarmLive');
    const track=el&&el.querySelector('.alarm-track');
    if(track){
      const half=track.scrollHeight/2;        // 内容复制一份，half = 单组高度
      const dt=(now-last)/1000; last=now;
      if(half>0 && !alarmScrollPause){
        alarmScrollY += ALARM_SCROLL_SPEED*dt;
        if(alarmScrollY>=half) alarmScrollY-=half;
        track.style.transform='translateY('+(-alarmScrollY).toFixed(1)+'px)';
      }
    }
    alarmScrollRAF=requestAnimationFrame(step);
  }
  alarmScrollRAF=requestAnimationFrame(step);
}
function pushAlarm(key,src,rec,reason,measure,level){
  ALARM_SEQ++; const d=new Date();
  const t=String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')+':'+String(d.getSeconds()).padStart(2,'0');
  const a={seq:ALARM_SEQ,time:t,key,src,rec,reason,measure,level:level||'重要'};
  ALARMS.unshift(a); if(ALARMS.length>200)ALARMS.pop();
  ALARM_KEYS[key]=a;
}
function lvlCls(l){return ({'紧急':'urg','重要':'imp','严重':'sev','普通':'nor'})[l]||'imp';}
function renderAlarmLive(){
  const el=document.getElementById('alarmLive'); if(!el) return;
  if(ALARM_SEQ===ALARM_LIVE_SEQ) return;      // 无新报警则不重绘（避免滚动跳动）
  ALARM_LIVE_SEQ=ALARM_SEQ;
  if(!ALARMS.length){ el.innerHTML='<div class="alarm-empty">暂无实时报警，系统运行正常</div>'; updateAlarmPill(); return; }
  const row=a=>`<div class="alarm-row">
    <div class="c-src">${a.src}</div>
    <div class="c-rec"><span class="lvl ${lvlCls(a.level)}">${a.level}</span>${a.rec}</div>
    <div class="c-reason">${a.reason}</div>
    <div class="c-measure">${a.measure}</div></div>`;
  const rows=ALARMS.map(row).join('');
  el.innerHTML=`<div class="alarm-track">${rows}${rows}</div>`;   // 复制一份实现无缝滚动
  alarmScrollY=0;                              // 新报警重绘后从顶部无缝重新开始
  startAlarmScroll();
  updateAlarmPill();
}
function updateAlarmPill(){
  const pill=document.getElementById('alarmPill'), cnt=document.getElementById('alarmCnt');
  if(!pill) return; let n=0; for(const k in ALARM_ON) if(ALARM_ON[k]) n++;
  if(n>0){ pill.style.display=''; if(cnt)cnt.textContent=n; } else pill.style.display='none';
}
function refreshAlarmBanners(){
  const el=document.getElementById('mpAlarms'); if(!el) return;
  const list=[]; for(const tag in ALARM_ON){ if(ALARM_ON[tag]){ const a=ALARM_KEYS['m:'+tag]; if(a)list.push(a); } }
  if(!list.length){ el.style.display='none'; return; }
  el.style.display='';
  el.innerHTML='<b style="color:#dc2626">⚠ 本页实时报警（'+list.length+'）</b> '+list.map(a=>'<span class="ab">'+a.rec+'</span>').join('');
}

function drawSpark(){
  const path=document.getElementById('dmSpark'); if(!path||!dmPrimary) return;
  const W=320,H=120,n=dmSpark.length;
  const base=dmPrimary[3], unit=dmPrimary[2], label=dmPrimary[1];
  const bl=base*DM_THR;                                   // 基准（报警）线
  let max=Math.max(...dmSpark, bl), min=Math.min(...dmSpark, base*0.8);
  const rng=(max-min)||1; max=max*1.04; min=min*0.96;
  const Y=v=>H-((v-min)/(max-min))*(H-14)-7;
  const X=i=>(i/(n-1))*W;
  let gd='', rd='', full='M'+X(0).toFixed(1)+' '+Y(dmSpark[0]).toFixed(1);
  for(let i=1;i<n;i++){
    const x1=X(i-1), y1=Y(dmSpark[i-1]), x2=X(i), y2=Y(dmSpark[i]);
    const cmd='M'+x1.toFixed(1)+' '+y1.toFixed(1)+' L'+x2.toFixed(1)+' '+y2.toFixed(1)+' ';
    if(dmSpark[i-1]>bl||dmSpark[i]>bl) rd+=cmd; else gd+=cmd;
    full+=' L'+x2.toFixed(1)+' '+y2.toFixed(1);
  }
  path.setAttribute('d', gd.trim());
  const al=document.getElementById('dmSparkAlarm'); if(al) al.setAttribute('d', rd.trim());
  const ba=document.getElementById('dmBase'); if(ba){ ba.setAttribute('y1',Y(bl).toFixed(1)); ba.setAttribute('y2',Y(bl).toFixed(1)); }
  const area=document.getElementById('dmSparkArea'); if(area) area.setAttribute('d', full+` L${W} ${H} L0 ${H} Z`);
  // 超界点闪烁 + 报警信息
  const last=dmSpark[n-1], dot=document.getElementById('dmAlarmDot'), banner=document.getElementById('dmAlarm');
  if(last>bl){
    if(dot){ dot.style.display=''; dot.setAttribute('cx',X(n-1).toFixed(1)); dot.setAttribute('cy',Y(last).toFixed(1)); }
    if(banner){ banner.style.display='';
      banner.innerHTML='实时'+label+' '+fmt(last,1)+unit+' 超基准 '+fmt(bl,1)+unit+'（报警）'; }
  } else { if(dot)dot.style.display='none'; if(banner)banner.style.display='none'; }
}

function startDeviceSim(){

    main.querySelectorAll('[data-live]').forEach(el=>{
      const base=parseFloat(el.dataset.base)||0, dec=parseInt(el.dataset.dec||'0'), unit=el.dataset.unit||'';
      let cur=parseFloat(el.getAttribute('data-cur')); if(isNaN(cur)) cur=base;

      el.innerHTML=fmt(nv,dec)+(unit?('<small>'+unit+'</small>'):'');

      const cur=base*(0.9+Math.random()*0.2);

      let cur=parseFloat(el.getAttribute('data-cur')); if(isNaN(cur)) cur=base;
      let nv=cur+(Math.random()-0.5)*base*0.04;
      nv=Math.max(base*0.7, Math.min(base*1.3, nv));
      el.setAttribute('data-cur', nv.toFixed(2));
      if(el.classList.contains('meter-val')||el.classList.contains('meter-side-val'))
        el.textContent=(Math.round(nv*10)/10).toFixed(1)+' '+unit;
      const alarming=nv>base*METER_THR;
      el.classList.toggle('alarm', alarming);     // 超阈值→红闪
      if(alarming){                                // 上升沿推报警 + 汇总
        if(!ALARM_ON[tag]){ ALARM_ON[tag]=true;
          const info=meterAlarmInfo(tag,name,medium,nv,base,unit);
          pushAlarm('m:'+tag, info.src, info.rec, info.reason, info.measure, '重要'); }
      } else ALARM_ON[tag]=false;
    });
    refreshAlarmBanners(); renderAlarmLive();
  }, 2000);
}

const SCREEN_STATE=new WeakMap();
function prepareScreen(view){
  if(!view||['v-overview','v-report_device','v-report_product','v-report_cost','v-report_water','v-plan_balance','v-opt_benchmark','v-opt_load','v-opt_anomaly','v-enterprise_cockpit','v-workshop_cockpit','v-device_cockpit'].includes(view.id)||typeof ResizeObserver==='undefined')return;
  let state=SCREEN_STATE.get(view);
  if(!state||!view.contains(state.shell)){
    const shell=document.createElement('div');shell.className='screen-shell';
    const controls=document.createElement('div');controls.className='screen-controls';
    const stage=document.createElement('div');stage.className='screen-stage';
    const canvas=document.createElement('div');canvas.className='screen-canvas';
    const pager=document.createElement('div');pager.className='screen-pager';
    const label=document.createElement('span');label.className='screen-label';
    const actions=document.createElement('div');actions.className='screen-actions';
    const prev=document.createElement('button');prev.type='button';prev.textContent='‹ 上一屏';
    const counter=document.createElement('span');counter.setAttribute('aria-live','polite');
    const next=document.createElement('button');next.type='button';next.textContent='下一屏 ›';
    actions.append(prev,counter,next);pager.append(label,actions);stage.append(canvas);shell.append(controls,stage,pager);
    Array.from(view.children).forEach(el=>{
      if(el.classList.contains('page-head')){el.hidden=true;return;}
      if(el.classList.contains('modal-mask'))return;
      if(el.classList.contains('note')||el.classList.contains('time-bar')){el.remove();return;}
      if(el.classList.contains('time-bar')||el.classList.contains('tabs')){controls.append(el);return;}
      const wrap=document.createElement('div');wrap.className='screen-section';wrap.append(el);canvas.append(wrap);
    });
    view.append(shell);state={shell,stage,canvas,pager,label,prev,next,counter,index:0,pages:[],single:true};SCREEN_STATE.set(view,state);
    prev.onclick=()=>{state.index=Math.max(0,state.index-1);paintScreen(state);};
    next.onclick=()=>{state.index=Math.min(state.pages.length-1,state.index+1);paintScreen(state);};
    new ResizeObserver(()=>queueScreen(view)).observe(stage);
    new MutationObserver(()=>queueScreen(view)).observe(canvas,{childList:true,subtree:true});
    controls.addEventListener('click',()=>{state.index=0;queueScreen(view);});
    canvas.addEventListener('click',()=>queueScreen(view));
    canvas.addEventListener('change',()=>queueScreen(view));
  }
  queueScreen(view);
}
function queueScreen(view){
  const state=SCREEN_STATE.get(view);if(!state||state.pending)return;
  state.pending=true;requestAnimationFrame(()=>{state.pending=false;if(!view.classList.contains('active'))return;layoutScreen(state);});
}
function layoutScreen(state){
  const available=state.stage.clientHeight;if(available<1)return;
  state.canvas.style.transform='none';state.canvas.style.width='100%';
  const blocks=Array.from(state.canvas.children);blocks.forEach(b=>b.classList.remove('screen-off'));
  const pages=[];let page=[],used=0;
  blocks.forEach(block=>{
    const el=block.firstElementChild;if(!el||getComputedStyle(el).display==='none'){block.classList.add('screen-off');return;}
    const height=Math.max(block.getBoundingClientRect().height,block.scrollHeight);
    if(!state.single&&page.length&&used+height>available){pages.push(page);page=[];used=0;}
    page.push(block);used+=height;
  });
  if(page.length)pages.push(page);state.pages=pages;state.index=Math.min(state.index,Math.max(0,pages.length-1));paintScreen(state);
}
function paintScreen(state){
  const current=state.pages[state.index]||[];
  Array.from(state.canvas.children).forEach(b=>b.classList.toggle('screen-off',!current.includes(b)));
  state.canvas.style.transform='none';state.canvas.style.width='100%';
  const natural=Math.max(state.canvas.scrollHeight,state.canvas.getBoundingClientRect().height);
  const scale=Math.min(1,state.stage.clientHeight/Math.max(1,natural));
  state.canvas.style.transform=`scale(${scale})`;
  state.canvas.style.marginLeft=scale<1?((state.stage.clientWidth*(1-scale))/2)+'px':'0';
  const names=current.map(b=>{const h=b.querySelector('h3,h4,.sub-h,.tb-lbl');return h?h.textContent.trim():'';}).filter(Boolean);
  state.label.textContent=names.join(' · ')||'统计指标与业务明细';
  state.counter.textContent=`${state.index+1} / ${Math.max(1,state.pages.length)}`;
  state.prev.disabled=state.index===0;state.next.disabled=state.index>=state.pages.length-1;
}

function fillRandomRange(id){
  const base=new Date(2026,0,1).getTime();
  const startOff=Math.floor(Math.random()*180);
  const span=Math.floor(Math.random()*70)+8;
  const s=new Date(base+startOff*86400000), e=new Date(s.getTime()+span*86400000);
  const f=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  const sEl=document.getElementById(id+'-start'), eEl=document.getElementById(id+'-end');
  if(sEl)sEl.value=f(s); if(eEl)eEl.value=f(e);
}
function runRPTquery(id){
  const sEl0=document.getElementById(id+'-start'), eEl0=document.getElementById(id+'-end');
  const s=sEl0?sEl0.value:'', e=eEl0?eEl0.value:'';
  const hEl0=document.getElementById(id+'-hint');
  if(!s||!e){ if(hEl0){hEl0.textContent='请先选择开始与结束时间';hEl0.classList.add('err');} return; }
  if(s>e){ if(hEl0){hEl0.textContent='开始时间不能晚于结束时间';hEl0.classList.add('err');} return; }
  RPT_SEEDS[id]=mkSeed(s,e);      // 仅该视图独立种子，不影响其他报表
  rerenderReportView(id);          // 以当前时段种子重渲染（数据经 J 确定性扰动），DOM 换新
  // 重渲染后重新获取新节点，回填时间并显示提示
  const sEl=document.getElementById(id+'-start'), eEl=document.getElementById(id+'-end'), hEl=document.getElementById(id+'-hint');
  if(sEl)sEl.value=s; if(eEl)eEl.value=e;
  if(hEl){hEl.classList.remove('err');hEl.textContent='已按 '+s+' ~ '+e+' 模拟刷新（数据已更新）';}
}
