<text x="1050" y="206" font-family="STHeiti, PingFang SC, sans-serif" font-size="21" font-weight="700" fill="#46A35B" text-anchor="middle">首个可销售日</text>
<rect x="430" y="850" width="940" height="58" rx="29" fill="#EAF4FB" stroke="#EAF4FB" stroke-width="2"/>
<text x="900.0" y="888.0" font-family="STHeiti, PingFang SC, sans-serif" font-size="22" font-weight="700" fill="#143E66" text-anchor="middle">原始补充量进入共享罐组前，仍须通过 SCIP 容量与兼容校验</text>
