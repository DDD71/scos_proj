<text x="906.0" y="738" font-family="STHeiti, PingFang SC, sans-serif" font-size="18" font-weight="400" fill="#5D6B78" text-anchor="middle">仅撤回未执行部分；替代版本重新审批</text>
<rect x="1180" y="650" width="360" height="130" rx="18" fill="#F5F8FB" stroke="#B9C7D4" stroke-width="2" filter="url(#shadow)"/>
<rect x="1180" y="650" width="12" height="130" rx="6" fill="#143E66" stroke="#143E66" stroke-width="2"/>
<text x="1366.0" y="699" font-family="STHeiti, PingFang SC, sans-serif" font-size="25" font-weight="700" fill="#17212B" text-anchor="middle">异常关闭</text>
<text x="1366.0" y="738" font-family="STHeiti, PingFang SC, sans-serif" font-size="18" font-weight="400" fill="#5D6B78" text-anchor="middle">接受风险、取消或失败均需责任人与证</text>
<text x="1366.0" y="761" font-family="STHeiti, PingFang SC, sans-serif" font-size="18" font-weight="400" fill="#5D6B78" text-anchor="middle">据</text>
